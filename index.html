function CourbeCouverture({ semaines, total }) {
  const L = 300, H = 90;
  const max = Math.max(total, 1);
  const pts = semaines.map((s, i) => `${(i / (semaines.length - 1)) * L},${H - (s.n / max) * H}`).join(" ");
  const aire = `0,${H} ${pts} ${L},${H}`;
  const fin = semaines[semaines.length - 1].n;
  return (
    <div className="p-3 rounded" style={{ background: T.card, border: `1px solid ${T.line}` }}>
      <p className="text-xs mb-2" style={{ color: T.ink2 }}>Items travaillés, 12 dernières semaines</p>
      <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="100" preserveAspectRatio="none">
        <polygon points={aire} fill="#15304A" />
        <polyline points={pts} fill="none" stroke={T.accent} strokeWidth="2" />
      </svg>
      <p className="text-xs mt-1" style={{ fontFamily: mono, color: T.ink2 }}>{fin} / {total}</p>
    </div>
  );
}

/* ================== grille type tableur ================== */
function Courbe({ jours }) {
  const pts = jours.filter((j) => j.taux !== null);
  if (pts.length < 2) return (
    <p className="text-xs p-3 rounded" style={{ background: T.card, border: `1px solid ${T.line}`, color: T.ink2 }}>
      La courbe de réussite apparaît dès que tu auras répondu à des questions sur deux jours différents.
    </p>
  );
  const L = 300, H = 70;
  const d = jours.map((j, i) => j.taux === null ? null : `${(i / (jours.length - 1)) * L},${H - (j.taux / 100) * H}`)
    .filter(Boolean).join(" ");
  return (
    <div className="p-3 rounded" style={{ background: T.card, border: `1px solid ${T.line}` }}>
      <p className="text-xs mb-2" style={{ color: T.ink2 }}>Taux de réussite, 14 derniers jours</p>
      <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="80" preserveAspectRatio="none">
        <line x1="0" y1={H - 0.8 * H} x2={L} y2={H - 0.8 * H} stroke={T.line} strokeDasharray="3 3" />
        <polyline points={d} fill="none" stroke={T.accent} strokeWidth="2" />
      </svg>
    </div>
  );
}

const RUBRIQUES = [
  { k: ["définition", "definition", "généralités"], c: "#54A9EA" },
  { k: ["épidémio", "epidemio", "facteur", "terrain"], c: "#EE9BBF" },
  { k: ["clinique", "signe", "interrogatoire", "symptô"], c: "#E4685D" },
  { k: ["diagnostic", "paraclinique", "imagerie", "biolog", "examen"], c: "#EAAE43" },
  { k: ["traitement", "prise en charge", "thérapeut", "conduite"], c: "#35B48C" },
  { k: ["surveillance", "suivi", "mesure", "prévention", "complication"], c: "#B9A3EE" },
  { k: ["piège", "piege", "retenir", "erreur", "annale"], c: "#EEB061" },
];
function couleurRubrique(t) {
  const b = (t || "").toLowerCase();
  const r = RUBRIQUES.find((x) => x.k.some((m) => b.includes(m)));
  return r ? r.c : T.accent;
}

function ResumeLu({ texte }) {
  if (!texte.trim()) return null;
  const lignes = texte.split("\n");
  const out = []; let buffer = [];
  const vider = (i) => {
    if (!buffer.length) return;
    out.push(<p key={"p" + i} style={{ fontFamily: lecture, fontSize: 17, lineHeight: 1.8, margin: "0 0 15px", color: "#D6E4F1" }}>{buffer.join(" ")}</p>);
    buffer = [];
  };
  lignes.forEach((l, i) => {
    const t = l.trim();
    if (!t) { vider(i); return; }
    if (t.startsWith("[[fig:")) {
      vider(i);
      const corps = t.slice(6).replace(/\]\]$/, "");
      const [nom, leg] = corps.split("|");
      out.push(<Figure key={"f" + i} nom={nom.trim()} legende={(leg || "").trim()} />);
      return;
    }
    if (t.startsWith("![")) {
      vider(i);
      const m = t.match(/^!\[(.*?)\]\((.*?)\)$/);
      if (m) out.push(
        <figure key={"i" + i} style={{ margin: "18px 0 22px" }}>
          <img src={m[2]} alt={m[1]} style={{ width: "100%", borderRadius: 16, border: `1px solid ${T.line}` }} />
          <figcaption className="text-xs mt-2" style={{ color: T.ink2, lineHeight: 1.6 }}>{m[1]}</figcaption>
        </figure>
      );
      return;
    }
    if (t.startsWith("## ")) {
      vider(i);
      const titre = t.slice(3);
      const c = couleurRubrique(titre);
      out.push(
        <h4 key={"h" + i} style={{
          color: c, fontSize: 11.5, letterSpacing: "0.1em", textTransform: "uppercase", fontFamily: serif,
          fontWeight: 700, margin: "26px 0 10px", display: "inline-block",
          background: c + "14", padding: "5px 12px", borderRadius: 999,
        }}>{titre}</h4>
      );
    } else if (t.startsWith("- ")) {
      vider(i);
      out.push(
        <p key={"l" + i} style={{ fontFamily: lecture, fontSize: 17, lineHeight: 1.75, margin: "0 0 8px", paddingLeft: 18, textIndent: -18, color: "#D6E4F1" }}>
          <span style={{ color: T.accent }}>▸ </span>{t.slice(2)}
        </p>
      );
    } else buffer.push(t);
  });
  vider("fin");
  return <div style={{ maxWidth: 640 }}>{out}</div>;
}

function Bilan({ items, colleges, resultats = [], cartes = [], qcms = [], onOuvrir }) {
  const [ouvert, setOuvert] = useState(null);
  const n = items.length || 1;
  const par = [3, 2, 1, 0].map((v) => ({ v, niv: NIV[v], nb: items.filter((i) => (i.niveau || 0) === v).length }));
  const pct = (x) => Math.round((x / n) * 1000) / 10;
  const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;

  const il7 = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
  const majSemaine = items.filter((i) => i.dateNiveau && i.dateNiveau > il7).length;
  const vertSemaine = items.filter((i) => i.dateNiveau && i.dateNiveau > il7 && (i.niveau || 0) === 3).length;
  const restants = n - par[0].nb;

  const il14 = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
  const aRevoir = items
    .filter((i) => (i.niveau || 0) === 1 || ((i.niveau || 0) === 2 && (!i.dateNiveau || i.dateNiveau < il14)))
    .sort((a, b) => (a.niveau || 0) - (b.niveau || 0) || (a.dateNiveau || "").localeCompare(b.dateNiveau || ""))
    .slice(0, 6);

  const detailQcm = (c) => {
    const l = items.filter((i) => i.collegeId === c.id).sort((a, b) => a.numero - b.numero);
    const ids = l.map((i) => i.id);
    const exos = [...cartes.filter((x) => ids.includes(x.itemId)), ...qcms.filter((x) => ids.includes(x.itemId))];
    const rep = resultats.filter((r) => ids.includes(r.itemId));
    const t = taux(rep);
    const avecExos = l.filter((i) => exos.some((e) => e.itemId === i.id));
    const testes = new Set(rep.map((r) => r.itemId));
    return (
      <div className="mt-2 mb-3 vue" style={{ background: T.paper, borderRadius: 16, padding: "12px 13px" }}>
        <div className="flex items-baseline justify-between mb-1">
          <span className="text-xs" style={{ color: T.ink2 }}>{exos.length} exercice(s) · {rep.length} réponse(s)</span>
          <span className="text-sm" style={{ fontWeight: 800, color: couleur(t) }}>{t === null ? "—" : t + " %"}</span>
        </div>
        <p className="text-xs mb-2" style={{ color: T.ink2 }}>{testes.size}/{avecExos.length} item(s) déjà testés</p>
        {avecExos.length === 0 ? (
          <p className="text-xs" style={{ color: T.ink2, lineHeight: 1.6 }}>
            Aucun QCM ici. Ouvre un item et génère-en dans l'onglet IA.
          </p>
        ) : (
          <div style={{ maxHeight: 190, overflowY: "auto" }}>
            {avecExos.map((i) => {
              const ti = taux(rep.filter((r) => r.itemId === i.id));
              const nb = exos.filter((e) => e.itemId === i.id).length;
              return (
                <button key={i.id} onClick={() => onOuvrir && onOuvrir(i.id)}
                  className="w-full text-left flex items-center gap-2 py-1.5 doux">
                  <span className="shrink-0 rounded-full" style={{ width: 7, height: 7, background: couleur(ti) }} />
                  <span className="flex-1 min-w-0 text-xs truncate">
                    <span style={{ color: T.ink2 }}>{i.numero}. </span>{i.titre}
                  </span>
                  <span className="shrink-0 text-xs" style={{ color: T.ink2 }}>{nb}</span>
                  <span className="shrink-0 text-xs" style={{ width: 34, textAlign: "right", color: couleur(ti), fontWeight: 700 }}>
                    {ti === null ? "—" : ti + "%"}
                  </span>
                </button>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 22, padding: "16px 18px" }}>
      <p className="text-xs uppercase mb-3" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Où j'en suis</p>

      <div className="flex h-4 rounded overflow-hidden mb-3" style={{ border: `1px solid ${T.line}` }}>
        {par.map((p) => p.nb > 0 && (
          <div key={p.v} style={{ width: (p.nb / n) * 100 + "%", background: p.niv.c }} title={`${p.niv.nom} : ${p.nb}`} />
        ))}
      </div>

      {par.map((p) => (
        <div key={p.v} className="flex items-center gap-2 mb-1 text-xs">
          <i className="rounded-sm shrink-0" style={{ width: 11, height: 11, background: p.niv.c, border: `1px solid ${T.line}` }} />
          <span className="flex-1">{p.niv.nom}</span>
          <span style={{ color: T.ink2 }}>{p.nb}</span>
          <span style={{ width: 46, textAlign: "right" }}>{pct(p.nb)} %</span>
        </div>
      ))}

      <div className="mt-4 pt-3 text-xs" style={{ borderTop: `1px solid ${T.line}`, color: T.ink2, lineHeight: 1.7 }}>
        <div>{majSemaine} item(s) mis à jour cette semaine, dont {vertSemaine} passé(s) au vert.</div>
        {vertSemaine > 0
          ? <div>À ce rythme, les {restants} restants demandent environ {Math.ceil(restants / vertSemaine)} semaines.</div>
          : <div>Passe des items au vert pour voir apparaître une estimation.</div>}
      </div>

      {colleges.length > 0 && (
        <div className="mt-4 pt-3" style={{ borderTop: `1px solid ${T.line}` }}>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
            Par matière · appuie pour voir les QCM
          </p>
          {colleges.map((c) => {
            const l = items.filter((i) => i.collegeId === c.id);
            if (!l.length) return null;
            const p = pal(c.nom);
            const vert = l.filter((i) => (i.niveau || 0) === 3).length;
            const ids = l.map((i) => i.id);
            const t = taux(resultats.filter((r) => ids.includes(r.itemId)));
            const on = ouvert === c.id;
            return (
              <div key={c.id} className="mb-2">
                <button onClick={() => setOuvert(on ? null : c.id)} className="w-full text-left doux">
                  <div className="flex justify-between items-center text-xs mb-1">
                    <span style={{ color: p.fg, fontWeight: 600 }}>{on ? "▾ " : "▸ "}{c.nom}</span>
                    <span className="flex items-center gap-2">
                      {t !== null && <b style={{ color: couleur(t) }}>{t}%</b>}
                      <span style={{ color: T.ink2 }}>{vert}/{l.length}</span>
                    </span>
                  </div>
                  <div className="flex h-2 rounded overflow-hidden" style={{ background: "#152438" }}>
                    {[3, 2, 1].map((v) => {
                      const nb = l.filter((i) => (i.niveau || 0) === v).length;
                      return nb > 0 && <div key={v} style={{ width: (nb / l.length) * 100 + "%", background: NIV[v].c }} />;
                    })}
                  </div>
                </button>
                {on && detailQcm(c)}
              </div>
            );
          })}
        </div>
      )}

      {aRevoir.length > 0 && (
        <div className="mt-4 pt-3" style={{ borderTop: `1px solid ${T.line}` }}>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>À revoir en premier</p>
          {aRevoir.map((i) => (
            <button key={i.id} onClick={() => onOuvrir && onOuvrir(i.id)} className="block w-full text-left text-xs py-1">
              <i className="inline-block rounded-sm mr-2" style={{ width: 8, height: 8, background: NIV[i.niveau || 0].c }} />
              <span style={{ color: T.ink2 }}>{i.numero}. </span>{i.titre.slice(0, 44)}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* niveaux de compréhension : la couleur que TU choisis fixe la prochaine révision */
const NIVEAUX_C = [
  { v: 0, nom: "Pas encore vu",     court: "—",  jours: null, bg: "#182B41", fg: "#7E93A6", bord: "#2B4260" },
  { v: 1, nom: "Pas compris",       court: "J1", jours: 1,    bg: "#8E2F26", fg: "#FFE4E0", bord: "#E4685D" },
  { v: 2, nom: "Un peu compris",    court: "J3", jours: 3,    bg: "#9A5312", fg: "#FFE8CE", bord: "#E08A2E" },
  { v: 3, nom: "Moyennement",       court: "J5", jours: 5,    bg: "#8E7412", fg: "#FFF4D2", bord: "#EAC53F" },
  { v: 4, nom: "Bien compris",      court: "J7", jours: 7,    bg: "#1E7A5C", fg: "#DEF7EC", bord: "#35B48C" },
];
const nivC = (it) => Math.min(it.comp || 0, 4);
const MOIS_C = ["janv", "févr", "mars", "avr", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
const dCourte = (d) => { if (!d) return ""; const x = new Date(d + "T12:00:00"); return `${x.getDate()} ${MOIS_C[x.getMonth()]}`; };
const ecart = (d) => d ? Math.round((new Date(auj() + "T12:00:00") - new Date(d + "T12:00:00")) / 86400000) : null;

function echeance(it) {
  const n = nivC(it);
  if (!n || !it.dateComp) return null;
  const d = new Date(it.dateComp + "T12:00:00");
  d.setDate(d.getDate() + NIVEAUX_C[n].jours);
  return iso(d);
}
function retard(it) {
  const e = echeance(it);
  return e ? Math.round((new Date(auj() + "T12:00:00") - new Date(e + "T12:00:00")) / 86400000) : null;
}

  const n = nivC(item);
  const N = NIVEAUX_C[n];
  const c = colleges.find((x) => x.id === item.collegeId);
  const e = echeance(item);
  const r = retard(item);
  const pl = planifie(item.id);
  const sc = scores[item.id];

  return (
    <div className="ombre vue my-2" style={{ background: T.card, borderRadius: 20, padding: "14px 16px", border: `1px solid ${N.bord}` }}>
      <div className="flex items-start gap-3 mb-3">
        <span className="shrink-0 flex items-center justify-center"
          style={{ width: 44, height: 40, borderRadius: 12, background: N.bg, border: `1.5px solid ${N.bord}`,

          <span className="block text-sm" style={{ fontWeight: 700, lineHeight: 1.35 }}>{item.titre}</span>

            background: note || item.note ? T.accent : T.accentPale, color: note || item.note ? "#fff" : T.accent,
            fontSize: 17, fontWeight: 700 }}>
          {item.note && !note ? "✎" : "+"}
        </button>
        <button onClick={onFermer} className="text-sm px-1 shrink-0" style={{ color: T.ink2 }}>✕</button>
      </div>

      {note ? (
        <div className="mb-3">
          <p className="text-xs mb-2" style={{ color: T.ink2 }}>Ce que je n'ai pas compris, à revoir en priorité</p>
          <textarea autoFocus value={txt} onChange={(e2) => setTxt(e2.target.value)} rows={3}
            placeholder="Ex. revoir les consultations du deuxième trimestre, et le calendrier des sérologies."
            className="w-full p-3 text-sm mb-2" style={{ borderRadius: 14, border: `1px solid ${T.line}`, lineHeight: 1.6 }} />
          <div className="flex gap-2">
            <button onClick={() => { onNote(item.id, txt.trim()); setNote(false); }}
              className="px-4 py-2 text-xs doux" style={{ background: T.accent, color: "#fff", borderRadius: 999, fontWeight: 700 }}>
              Enregistrer
            </button>
            <button onClick={() => { setTxt(item.note || ""); setNote(false); }}
              className="px-3 py-2 text-xs" style={{ color: T.ink2 }}>Annuler</button>
          </div>
        </div>
      ) : item.note ? (
        <div className="mb-3 px-3 py-2.5" style={{ background: NIV[2].doux, borderRadius: 14 }}>
          <p className="text-xs mb-1" style={{ color: NIV[2].encre, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>
            À revoir en priorité
          </p>
          <p style={{ fontFamily: lecture, fontSize: 15, lineHeight: 1.6, color: NIV[2].encre }}>{item.note}</p>
        </div>
      ) : null}

      <div className="flex flex-wrap gap-2 text-xs mb-3">
        {item.dateComp && (
          <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.paper, color: T.ink2 }}>
            Vu le {dCourte(item.dateComp)} · il y a {ecart(item.dateComp)} j
          </span>
        )}
        {e && (
          <span className="px-3 py-1.5" style={{ borderRadius: 999,
            background: r >= 0 ? NIV[1].doux : T.paper, color: r >= 0 ? NIV[1].encre : T.ink2, fontWeight: r >= 0 ? 700 : 400 }}>
            {r >= 0 ? `À revoir — en retard de ${r} j` : `À revoir le ${dCourte(e)}`}

          <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 600 }}>

          </span>

          <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.paper, color: couleur(sc), fontWeight: 700 }}>
            {sc}% aux QCM
          </span>

          <button onClick={() => onPoser(item, 0)} className="px-3 py-2 text-xs doux"
            style={{ border: `1px solid ${T.line}`, color: T.ink2, borderRadius: 999 }}>Remettre à zéro</button>
        )}
      </div>
    </div>
  );
}

function Grille({ colleges, items, scores, resultats, cartes, qcms, taches = [], onComp, onNote, onOuvrir }) {
  const [filtre, setFiltre] = useState("tous");
  const [q, setQ] = useState("");
  const [panneau, setPanneau] = useState(true);
  const [sel, setSel] = useState(null);
  const [histo, setHisto] = useState([]);
  const [vue, setVue] = useState("damier");

  const visibles = colleges.filter((c) => filtre === "tous" || c.id === filtre);
  const lignes = items
    .filter((i) => visibles.some((c) => c.id === i.collegeId))
    .filter((i) => correspond(i, q))
    .sort((a, b) => a.numero - b.numero);

  /* avancement : un item compte pour sa part de compréhension */
  const avancement = (l) => l.length
    ? Math.round(l.reduce((s, i) => s + nivC(i) / 4, 0) / l.length * 100) : 0;
  const pctTotal = avancement(items);

  const poser = (i, v) => {
    setHisto((h) => [...h.slice(-19), { id: i.id, comp: i.comp || 0, date: i.dateComp || null, tours: i.tours || [] }]);
    onComp(i.id, v);
  };
  const annuler = () => {
    const d = histo[histo.length - 1];
    if (!d) return;
    onComp(d.id, d.comp, d.date, d.tours);
    setHisto((h) => h.slice(0, -1));
  };

  /* prochain créneau planifié pour un item */
  const planifie = (id) => {
    const t = taches.filter((x) => x.itemId === id && x.date >= auj()).sort((a, b) => a.date.localeCompare(b.date))[0];
    return t ? t.date : null;
  };

  const apercu = items.find((i) => i.id === sel);

  return (
    <div>
      <div className="flex items-start gap-3 mb-3">
        <button onClick={() => setPanneau(!panneau)} className="flex items-center justify-center doux shrink-0"
          style={{ width: 38, height: 38, borderRadius: 999, background: panneau ? T.accent : T.card,
            color: panneau ? "#fff" : T.accent, border: `1px solid ${panneau ? T.accent : T.line}`, fontSize: 15 }}>
          {panneau ? "«" : "»"}
        </button>
        <div className="flex-1">
          <h2 style={{ fontFamily: serif, fontSize: 24 }}>La grille</h2>
          <p className="text-xs mt-1" style={{ color: T.ink2 }}>
            Choisis la couleur selon ta compréhension : elle fixe la date de la prochaine révision.
          </p>
        </div>
        <div className="text-right shrink-0">
          <p style={{ fontFamily: serif, fontSize: 27, lineHeight: 1, color: T.accent }}>{pctTotal}%</p>
          <p className="text-xs" style={{ color: T.ink2 }}>total</p>
        </div>
      </div>

      {/* légende : couleur = compréhension = délai */}
      <div className="flex flex-wrap gap-2 mb-4">
        {NIVEAUX_C.slice(1).map((n) => {
          const nb = lignes.filter((i) => nivC(i) === n.v).length;
          return (
            <span key={n.v} className="flex items-center gap-2 px-3 py-1.5"
              style={{ borderRadius: 999, background: n.bg, border: `1px solid ${n.bord}` }}>
              <b style={{ color: n.fg, fontSize: 11 }}>{n.court}</b>
              <span className="text-xs" style={{ color: n.fg, opacity: 0.9 }}>{n.nom}</span>
              <b style={{ color: n.fg, fontSize: 11 }}>{nb}</b>
            </span>
          );
        })}
        <span className="flex items-center gap-2 px-3 py-1.5 text-xs"
          style={{ borderRadius: 999, background: NIVEAUX_C[0].bg, color: NIVEAUX_C[0].fg }}>
          Pas encore vu <b>{lignes.filter((i) => !nivC(i)).length}</b>
        </span>
        {(() => {
          const n = lignes.filter((i) => retard(i) !== null && retard(i) >= 0).length;
          return n ? (
            <span className="flex items-center gap-2 px-3 py-1.5 text-xs"
              style={{ borderRadius: 999, background: NIV[2].doux, color: NIV[2].encre, fontWeight: 700 }}>
              À revoir maintenant <b>{n}</b>

            <Chip key={c.id} actif={filtre === c.id} onClick={() => setFiltre(c.id)} p={pal(c.nom)}>

          );

              <div className="flex flex-wrap gap-1.5">

                  const n = nivC(i);

                  const r = retard(i);
                  const pl = planifie(i.id);
                  return (
                    <button key={i.id}
                      onClick={() => setSel(sel === i.id ? null : i.id)}
                      title={`${i.numero}. ${i.titre}`}
                      className="case flex flex-col items-center justify-center"
                      style={{
                        width: 62, height: 58, borderRadius: 14, background: N.bg,
                        border: `1.5px solid ${sel === i.id ? "#fff" : r >= 0 ? T.moyen : N.bord}`,
                        position: "relative", overflow: "hidden",
                        transform: sel === i.id ? "scale(1.06)" : "none",
                        transition: "transform 180ms cubic-bezier(0.22,1,0.36,1)",
                      }}>
                      <span style={{ fontSize: 16, fontWeight: 800, color: "#FFFFFF", lineHeight: 1.05 }}>{i.numero}</span>
                      {i.dateComp && (
                        <span style={{ fontSize: 8.5, color: "#FFFFFF", opacity: 0.72, lineHeight: 1.25 }}>{dCourte(i.dateComp)}</span>
                      )}
                      {(() => {
                        /* Nombre de passages : des points jusqu'à cinq, un compte au-delà. */
                        const t = (i.tours || []).length;
                        if (!t) return null;
                        if (t <= 5) return (
                          <span className="flex gap-0.5" style={{ marginTop: 2 }}>
                            {[...Array(t)].map((_, z) => (
                              <span key={z} style={{ width: 3.5, height: 3.5, borderRadius: 999,
                                background: "#FFFFFF", opacity: 0.88 }} />
                            ))}
                          </span>
                        );
                        return (
                          <span style={{ fontSize: 8.5, fontWeight: 800, color: "#FFFFFF",
                            opacity: 0.88, marginTop: 1, letterSpacing: "0.02em" }}>×{t}</span>
                        );
                      })()}
                      {pl && <span style={{ position: "absolute", top: 4, right: 4, width: 5, height: 5, borderRadius: 999, background: T.accent }} />}
                    </button>
                  );
                })}
                {sel && l.some((i) => i.id === sel) && (
                  <div style={{ width: "100%" }}>
                    <Panneau item={items.find((x) => x.id === sel)} colleges={colleges} scores={scores}
                      planifie={planifie} onPoser={poser} onNote={onNote} onOuvrir={onOuvrir} onFermer={() => setSel(null)} />
                  </div>
                )}
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full" style={{ borderCollapse: "collapse", fontSize: 12.5 }}>
                  <tbody>
                    {l.map((i) => {
                      const N = NIVEAUX_C[nivC(i)];
                      const pl = planifie(i.id);
                      const r = retard(i);
                      return (
                        <tr key={i.id} onClick={() => setSel(sel === i.id ? null : i.id)}
                          style={{ borderTop: `1px solid ${T.line}`, cursor: "pointer" }}>
                          <td style={{ width: 42, padding: "9px 4px", color: "#fff", fontWeight: 700 }}>{i.numero}</td>
                          <td style={{ padding: "9px 6px", lineHeight: 1.4 }}>{i.titre}</td>
                          <td style={{ width: 76, textAlign: "right", padding: "9px 4px", color: T.accent, fontSize: 11 }}>
                            {pl ? "◷ " + dCourte(pl) : ""}
                          </td>
                          <td style={{ width: 86, textAlign: "right", padding: "9px 6px" }}>
                            <span style={{ padding: "4px 9px", borderRadius: 999, background: N.bg,
                              border: `1px solid ${r >= 0 ? T.moyen : N.bord}`, color: N.fg, fontWeight: 700, fontSize: 11 }}>
                              {i.dateComp ? dCourte(i.dateComp) : "jamais"}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}

      <p className="text-xs mt-2" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Un point bleu en haut d'une case signale un créneau déjà posé dans ton planning.
        Un contour ambre signale une révision en retard.
      </p>

      </div>
      {panneau && (
        <div className="md:order-1 md:w-72 md:shrink-0 mt-6 md:mt-0 md:sticky" style={{ top: 70 }}>
          <Bilan items={filtre === "tous" ? items : items.filter((i) => i.collegeId === filtre)}
            colleges={filtre === "tous" ? colleges : colleges.filter((c) => c.id === filtre)}
            resultats={resultats} cartes={cartes} qcms={qcms} onOuvrir={onOuvrir} />
        </div>
      )}
      </div>
    </div>
  );
}

/* ================== collèges ================== */
function Anneau({ pct, couleur, taille = 46 }) {
  const r = (taille - 6) / 2, C = 2 * Math.PI * r;
  return (
    <svg width={taille} height={taille} style={{ flexShrink: 0 }}>
      <circle cx={taille / 2} cy={taille / 2} r={r} fill="none" stroke={couleur} strokeOpacity="0.18" strokeWidth="5" />
      <circle cx={taille / 2} cy={taille / 2} r={r} fill="none" stroke={couleur} strokeWidth="5" strokeLinecap="round"
        strokeDasharray={`${(pct / 100) * C} ${C}`} transform={`rotate(-90 ${taille / 2} ${taille / 2})`}
        style={{ transition: "stroke-dasharray 420ms ease" }} />
      <text x="50%" y="50%" textAnchor="middle" dy="0.35em"
        style={{ fontFamily: serif, fontSize: 12, fontWeight: 700, fill: couleur }}>{pct}</text>
    </svg>
  );
}

/* ================== assistant IA, dédié à un item ================== */
function Assistant({ item, college, cartes, qcms, depart, onAjoutCarte, onAjoutQcm }) {
  const [genre, setGenre] = useState(depart || "qcm");
  const [nb, setNb] = useState(5);
  const [etat, setEtat] = useState(null);
  const [erreur, setErreur] = useState(null);
  const [cle, setCle] = useState(litCle());
  const [reglages, setReglages] = useState(!litCle());
  const [manuel, setManuel] = useState(false);
  const [colle, setColle] = useState("");

  const dejaVus = genre === "qcm" || genre === "qroc"
    ? qcms.map((q) => q.enonce).slice(-25)
    : cartes.map((c) => c.recto).slice(-25);

  const consigneGenre = {
    qcm: `Rédige ${nb} QCM à cinq propositions A à E, plusieurs réponses possibles, du niveau des EDN.
Pour CHAQUE proposition, vraie comme fausse, une justification d'une à deux phrases dans "pourquoi".
Le champ "explication" donne le raisonnement d'ensemble : ce qu'il fallait reconnaître.
Format : [{"enonce":"...","props":[{"txt":"...","vrai":true,"pourquoi":"..."}],"explication":"..."}]`,
    qroc: `Rédige ${nb} questions à réponse rédigée courte, du type des EDN.
Donne la réponse attendue et la liste des mots-clés qui doivent y figurer.
Format : [{"type":"qroc","enonce":"...","reponse":"...","cles":["..."],"explication":"..."}]`,
    flash: `Rédige ${nb} flashcards recto-verso. Recto : une question courte et précise. Verso : une réponse exacte et brève. Une seule idée par carte.
Format : [{"recto":"...","verso":"..."}]`,
  }[genre];

  const message = `Item ${item.numero} — ${item.titre} (collège de ${college.nom}).

${consigneGenre}

Reste dans le périmètre de cet item.
${dejaVus.length ? "Ne reprends aucun de ces énoncés déjà présents :\n- " + dejaVus.join("\n- ") : ""}`;

  const integrer = (liste) => {
    let n = 0;
    (Array.isArray(liste) ? liste : []).forEach((x) => {
      if (x.recto && x.verso) { onAjoutCarte({ recto: x.recto, verso: x.verso }); n++; }
      else if (x.type === "qroc" && x.enonce && x.reponse) {
        onAjoutQcm({ type: "qroc", enonce: x.enonce, reponse: x.reponse, cles: x.cles || [], explication: x.explication || "" }); n++;
      } else if (x.enonce && Array.isArray(x.props)) {
        onAjoutQcm({ enonce: x.enonce, props: x.props, explication: x.explication || "" }); n++;
      }
    });
    return n;
  };

  const generer = async () => {
    setErreur(null); setEtat("Rédaction en cours…");
    try {
      const txt = await demanderIA(CONSIGNE, message, 4000);
      const n = integrer(extraireJson(txt));
      setEtat(n ? `${n} exercice(s) ajouté(s) à cet item.` : "Rien d'exploitable dans la réponse.");
      setTimeout(() => setEtat(null), 4000);
    } catch (e) {
      setEtat(null);
      if (String(e.message) === "PAS_DE_CLE") { setReglages(true); setErreur("Ajoute ta clé pour générer directement."); }
      else setErreur(String(e.message || e));
    }
  };

  return (
    <div>
      <div className="flex gap-2 mb-3 flex-wrap">

      {reglages && (
        <div className="mb-3" style={{ background: T.card, borderRadius: 18, padding: "14px 16px" }}>

            La génération directe demande ta clé d'API Anthropic. Elle reste dans ce navigateur, elle n'est

          </p>
          <input type="password" value={cle} onChange={(e) => { setCle(e.target.value); ecritCle(e.target.value); }}

      {manuel && (
        <div className="mt-3">
          <textarea readOnly value={message} rows={5} onFocus={(e) => e.target.select()}
            className="w-full p-3 text-xs mb-2"
            style={{ borderRadius: 14, border: `1px solid ${T.line}`, background: "#132436", color: T.ink2, lineHeight: 1.5 }} />
          <button onClick={() => navigator.clipboard.writeText(CONSIGNE + "\n\n" + message)}
            className="px-4 py-2 text-xs doux mb-3"
            style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600 }}>Copier</button>
          <textarea value={colle} onChange={(e) => setColle(e.target.value)} rows={3}
            placeholder="Colle ici la réponse JSON" className="w-full p-3 text-xs mb-2"
            style={{ borderRadius: 14, border: `1px solid ${T.line}` }} />
          <button onClick={() => {
            try { const n = integrer(extraireJson(colle)); setColle(""); setEtat(`${n} ajouté(s).`); setTimeout(() => setEtat(null), 3000); }
            catch { setErreur("JSON invalide."); }
          }} disabled={!colle.trim()} className="px-4 py-2 text-xs doux"
            style={{ background: colle.trim() ? T.ink : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>Ajouter</button>
        </div>
      )}

      <p className="text-xs mt-5" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Relis ce qui est produit avant de l'apprendre : une IA écrit ce qui ressemble à une bonne question,
        elle ne garantit pas la fidélité au référentiel.
      </p>
    </div>
  );
}

/* ================== flashcards ================== */
function Flashcards({ cartes, onAjouter, onSupprimer, onNoter, resume, onIA }) {
  const [mode, setMode] = useState("liste");
  const [voirResume, setVoirResume] = useState(false);
  const [recto, setRecto] = useState(""); const [verso, setVerso] = useState("");
  const [n, setN] = useState(0); const [face, setFace] = useState(false);

  if (mode === "reviser") {
    const c = cartes[n];
    if (!c) return null;
    return (
      <div>
        <div className="flex items-center gap-3 mb-4">
          <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
            <div className="doux h-1.5 rounded-full" style={{ width: (n / cartes.length) * 100 + "%", background: T.accent }} />
          </div>
          <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{cartes.length}</span>
        </div>
        <div onClick={() => setFace(!face)} className="mb-4"
          style={{ perspective: 1400, cursor: "pointer", minHeight: 220 }}>
          <div style={{
            position: "relative", minHeight: 220, transformStyle: "preserve-3d",
            transition: "transform 520ms cubic-bezier(0.22, 1, 0.36, 1)",
            transform: face ? "rotateY(180deg)" : "none",
          }}>
            {/* recto */}
            <div style={{
              position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden",
              background: T.accentPale, borderRadius: 24, padding: "26px 24px",
              display: "flex", flexDirection: "column", justifyContent: "center",
            }}>
              <p className="text-xs mb-3" style={{ color: T.accent, fontWeight: 800, letterSpacing: "0.1em" }}>QUESTION</p>
              <p style={{ fontFamily: lecture, fontSize: 19, lineHeight: 1.55, color: "#E2ECF6" }}>{c.recto}</p>
              <p className="text-xs mt-6" style={{ color: T.accent, fontWeight: 600 }}>Appuie pour retourner</p>
            </div>
            {/* verso */}
            <div style={{
              position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden",
              transform: "rotateY(180deg)", background: T.card, border: `1.5px solid ${T.line}`,
              borderRadius: 24, padding: "26px 24px", overflowY: "auto",
              display: "flex", flexDirection: "column", justifyContent: "center",
            }}>
              <p className="text-xs mb-3" style={{ color: T.ink2, fontWeight: 800, letterSpacing: "0.1em" }}>RÉPONSE</p>
              <p style={{ fontFamily: lecture, fontSize: 17.5, lineHeight: 1.7, color: "#D6E4F1" }}>{c.verso}</p>
              <p className="text-xs mt-6" style={{ color: T.ink2 }}>Appuie pour revoir la question</p>
            </div>
          </div>
        </div>

        {face && (
          <div className="flex gap-3 vue">
            <button onClick={() => {
              onNoter(0, "flash");
              if (n + 1 >= cartes.length) { setMode("liste"); setN(0); setFace(false); }
              else { setN(n + 1); setFace(false); }
            }} className="flex-1 py-3.5 doux"
              style={{ background: T.bas, color: "#0E1A29", borderRadius: 999, fontWeight: 800, fontSize: 15 }}>
              Faux
            </button>
            <button onClick={() => {
              onNoter(1, "flash");
              if (n + 1 >= cartes.length) { setMode("liste"); setN(0); setFace(false); }
              else { setN(n + 1); setFace(false); }
            }} className="flex-1 py-3.5 doux"
              style={{ background: T.haut, color: "#0E1A29", borderRadius: 999, fontWeight: 800, fontSize: 15 }}>
              Bon
            </button>
          </div>
        )}
        <button onClick={() => { setMode("liste"); setN(0); setFace(false); }} className="text-xs mt-5" style={{ color: T.ink2 }}>Quitter</button>
      </div>
    );
  }

  if (mode === "creer") return (
    <div>
      {resume && resume.trim() && (
        <div className="mb-3">
          <button onClick={() => setVoirResume(!voirResume)} className="text-xs" style={{ color: T.accent }}>
            {voirResume ? "Masquer le résumé" : "Afficher le résumé de l'item"}
          </button>
          {voirResume && (
            <div className="mt-2 p-3 rounded" style={{ background: T.paper, maxHeight: 220, overflow: "auto" }}>
              <ResumeLu texte={resume} />
            </div>
          )}
        </div>
      )}
      <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Recto — la question</label>
      <textarea value={recto} onChange={(e) => setRecto(e.target.value)} rows={2}
        className="w-full p-3 rounded text-sm mb-3" style={{ border: `1px solid ${T.line}` }} />
      <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Verso — la réponse</label>
      <textarea value={verso} onChange={(e) => setVerso(e.target.value)} rows={3}
        className="w-full p-3 rounded text-sm" style={{ border: `1px solid ${T.line}` }} />
      <div className="flex gap-2 mt-3">
        <button disabled={!recto.trim() || !verso.trim()}
          onClick={() => { onAjouter({ recto: recto.trim(), verso: verso.trim() }); setRecto(""); setVerso(""); setMode("liste"); }}
          className="px-4 py-2 rounded text-sm"
          style={{ background: recto.trim() && verso.trim() ? T.ink : T.line, color: T.card }}>Enregistrer</button>
        <button onClick={() => setMode("liste")} className="px-4 py-2 rounded text-sm" style={{ border: `1px solid ${T.line}` }}>Annuler</button>
      </div>
    </div>
  );

  return (
    <div>
      <div className="flex gap-2 mb-4">
        <button onClick={() => setMode("creer")} className="px-4 py-2.5 text-sm doux" style={{ background: T.accent, color: "#fff", borderRadius: 999, fontWeight: 600 }}>Nouvelle carte</button>
        {cartes.length > 0 && <button onClick={() => { setN(0); setFace(false); setMode("reviser"); }} className="px-4 py-2.5 text-sm doux" style={{ border: `1px solid ${T.line}`, borderRadius: 999, fontWeight: 600, color: T.ink }}>Réviser</button>}
        {onIA && <button onClick={() => onIA("flash")} className="px-4 py-2.5 text-sm doux"
          style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600 }}>Générer</button>}
      </div>
      {cartes.length === 0 ? (
        <p className="text-sm" style={{ color: T.ink2 }}>Aucune carte. Une bonne carte tient en une question courte et une réponse exacte.</p>
      ) : (
        <ul>{cartes.map((c) => (
          <li key={c.id} className="py-2 flex gap-3 text-sm" style={{ borderBottom: `1px solid ${T.line}` }}>
            <span className="flex-1">{c.recto}</span>
            <button onClick={() => onSupprimer(c.id)} className="text-xs px-1" style={{ color: T.bas }}>×</button>
          </li>
        ))}</ul>
      )}
    </div>
  );
}

/* ================== QCM ================== */
const LETTRES = ["A", "B", "C", "D", "E"];
function BanqueQcm({ qcms, onAjouter, onSupprimer, onNoter, onIA, onSeance, onErreurQcm }) {
  const [mode, setMode] = useState("liste");
  const [enonce, setEnonce] = useState("");
  const [props, setProps] = useState(LETTRES.map(() => ({ txt: "", vrai: false })));
  const [explication, setExplication] = useState("");
  const [type, setType] = useState("qcm");
  const [reponse, setReponse] = useState(""); const [cles, setCles] = useState("");
  const [n, setN] = useState(0); const [choix, setChoix] = useState([]); const [corrige, setCorrige] = useState(false);
  const [graine, setGraine] = useState(0);
  const [paquet, setPaquet] = useState([]);
  const [reglage, setReglage] = useState(false);
  const [menage, setMenage] = useState(false);
  const [coches, setCoches] = useState([]);
  const [journal, setJournal] = useState([]);
  const [bilan, setBilan] = useState(null);
  const [deplie, setDeplie] = useState(null);
  const [misesDeCote, setMisesDeCote] = useState([]);

  /* Chaque séance tire un paquet au hasard : ni le même ordre, ni les mêmes
     questions d'une fois sur l'autre. */
  const demarrer = (combien) => {
    const melange = [...qcms].sort(() => Math.random() - 0.5);
    setPaquet(combien ? melange.slice(0, combien) : melange);
    setGraine(Math.floor(Math.random() * 1e9));
    setN(0); setChoix([]); setCorrige(false); setReglage(false);
    setJournal([]); setBilan(null); setDeplie(null); setMisesDeCote([]); setMode("reviser");
  };
  const [saisie, setSaisie] = useState("");

  if (mode === "reviser") {
    const liste = paquet.length ? paquet : qcms;
    const q = liste[n]; if (!q) return null;
    if (q.type === "qroc") {
      return (
        <Qroc key={q.id || n} q={q} n={n} total={liste.length}
          onNoter={(v) => onNoter(v, "qroc")}
          onSuivant={() => { if (n + 1 >= liste.length) { setMode("liste"); setN(0); } else setN(n + 1); }}
          onQuitter={() => { setMode("liste"); setN(0); }} />
      );
    }
    const ordre = propsMelangees(q, n, graine);
    const juste = ordre.every((p, i) => p.vrai === choix.includes(i));

    /* fin de séance : note sur 20 et récapitulatif */
    if (bilan) {
      const note = noteSur20(bilan.points, bilan.detail.length);
      const parfaits = bilan.detail.filter((x) => x.disc === 0).length;
      return (
        <div>
          <div className="ombre mb-4 vue" style={{ background: T.card, borderRadius: 26, padding: "26px 22px", textAlign: "center" }}>
            <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.12em", color: T.ink2 }}>Note de la séance</p>
            <p style={{ fontFamily: serif, fontSize: 58, lineHeight: 1, color: couleur(note * 5) }}>
              {note}<span style={{ fontSize: 26, color: T.ink2 }}> / 20</span>
            </p>
            <p className="text-xs mt-3" style={{ color: T.ink2 }}>
              {bilan.detail.length} question(s) · {parfaits} sans discordance · barème EDN
            </p>
          </div>

          <p className="text-xs uppercase mb-1" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Détail</p>
          <p className="text-xs mb-3" style={{ color: T.ink2, lineHeight: 1.6 }}>
            Appuie sur une question pour la revoir en entier. Le drapeau la met de côté
            dans l'onglet Erreurs, avec sa correction.
          </p>

          {bilan.detail.map((x, k) => {
            const ouvert = deplie === k;
            const mise = misesDeCote.includes(k);
            return (
              <div key={k} className="mb-2" style={{ background: T.card, borderRadius: 14, overflow: "hidden",
                borderLeft: `4px solid ${x.disc === 0 ? T.haut : x.disc <= 2 ? T.moyen : T.bas}` }}>
                <div className="flex items-center gap-3" style={{ padding: "11px 14px" }}>
                  <button onClick={() => setDeplie(ouvert ? null : k)} className="flex-1 min-w-0 text-left flex items-center gap-3">
                    <span className="shrink-0 text-xs" style={{ width: 22, color: T.ink2, fontWeight: 700 }}>{k + 1}</span>
                    <span className="flex-1 min-w-0 text-xs" style={{ lineHeight: 1.4,
                      overflow: "hidden", textOverflow: "ellipsis", whiteSpace: ouvert ? "normal" : "nowrap" }}>
                      {x.enonce}
                    </span>
                  </button>
                  <span className="shrink-0 text-xs" style={{ color: T.ink2 }}>{x.disc} disc.</span>
                  <span className="shrink-0 text-xs" style={{ width: 30, textAlign: "right", fontWeight: 800,
                    color: x.pts === 1 ? T.haut : x.pts > 0 ? T.moyen : T.bas }}>{x.pts}</span>
                  <button onClick={() => {
                    if (mise) return;
                    setMisesDeCote((l) => [...l, k]);
                    if (onErreurQcm) onErreurQcm(x);
                  }} aria-label="Mettre de côté dans Erreurs"
                    className="shrink-0 flex items-center justify-center doux"
                    style={{ width: 30, height: 30, borderRadius: 999,
                      background: mise ? T.moyen : "transparent",
                      border: `1px solid ${mise ? T.moyen : T.line}`,
                      color: mise ? "#0E1A29" : T.ink2, fontSize: 14 }}>
                    {mise ? "✓" : "⚑"}
                  </button>
                </div>

                {ouvert && (
                  <div className="vue" style={{ background: T.paper, padding: "12px 14px" }}>
                    {(x.props || []).map((p, i) => (
                      <Proposition key={i} p={p} i={i} choisi={p.coche} corrige onClic={() => {}} />
                    ))}
                    {x.explication && (
                      <Correction juste={x.disc === 0} texte={x.explication} props={x.props}
                        choix={(x.props || []).map((p, i) => (p.coche ? i : -1)).filter((i) => i >= 0)} />
                    )}
                  </div>
                )}
              </div>
            );
          })}

          <div className="flex gap-2 mt-4">
            <button onClick={() => {
              const aFaire = bilan.detail.map((x, k) => k).filter((k) => !misesDeCote.includes(k) && bilan.detail[k].disc > 0);
              if (!aFaire.length || !onErreurQcm) return;
              aFaire.forEach((k) => onErreurQcm(bilan.detail[k]));
              setMisesDeCote((l) => [...l, ...aFaire]);
            }} className="flex-1 py-3.5 doux"
              style={{ background: T.moyen, color: "#0E1A29", borderRadius: 999, fontWeight: 700, fontSize: 13 }}>
              Mettre de côté toutes les ratées
            </button>
            <button onClick={() => { setMode("liste"); setBilan(null); setN(0); setDeplie(null); setMisesDeCote([]); }}
              className="flex-1 py-3.5 doux"
              style={{ background: T.accent, color: "#fff", borderRadius: 999, fontWeight: 700 }}>
              Terminer
            </button>
          </div>
          <p className="text-xs mt-3" style={{ color: T.ink2, lineHeight: 1.7 }}>
            Barème : aucune discordance 1 point, une discordance 0,5, deux discordances 0,2, au-delà 0.
          </p>
        </div>
      );
    }

    return (
      <div>
        <div className="flex items-center gap-3 mb-4">
          <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
            <div className="doux h-1.5 rounded-full" style={{ width: ((n + (corrige ? 1 : 0)) / liste.length) * 100 + "%", background: T.accent }} />
          </div>
          <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{liste.length}</span>
          <button onClick={() => { setMode("liste"); setN(0); setChoix([]); setCorrige(false); }}
            className="text-xs" style={{ color: T.ink2 }}>✕</button>
        </div>

        <p className="mb-5" style={{ fontSize: 16, lineHeight: 1.55, fontWeight: 500 }}>{q.enonce}</p>

        {ordre.map((p, i) => (
          <Proposition key={i} p={p} i={i} choisi={choix.includes(i)} corrige={corrige}
            onClic={() => setChoix((l) => l.includes(i) ? l.filter((x) => x !== i) : [...l, i])} />
        ))}

        {corrige && <Correction juste={juste} texte={q.explication} props={ordre} choix={choix} />}

        <div className="mt-5">
          {!corrige ? (
            <button onClick={() => {
              const d = discordances(ordre, choix);
              setJournal((l) => [...l, {
                exoId: q.id || null, enonce: q.enonce, disc: d, pts: pointsQcm(d),
                props: ordre.map((p, i) => ({ txt: p.txt, vrai: p.vrai, coche: choix.includes(i), pourquoi: p.pourquoi })),
                explication: q.explication || "",
              }]);
              setCorrige(true); onNoter(juste ? 1 : 0, "qcm");
            }} disabled={!choix.length}
              className="w-full py-3.5 text-sm doux"
              style={{ background: choix.length ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
              Valider
            </button>
          ) : (
            <button onClick={() => {
              if (n + 1 >= liste.length) {
                const pts = journal.reduce((a, x) => a + x.pts, 0);
                if (journal.length && onSeance) {
                  onSeance({ date: auj(), t: Date.now(), points: pts,
                    note: noteSur20(pts, journal.length), detail: journal });
                }
                setBilan({ points: pts, detail: journal });
              } else { setN(n + 1); setChoix([]); setCorrige(false); }
            }} className="w-full py-3.5 text-sm doux"
              style={{ background: T.ink, color: "#fff", borderRadius: 999, fontWeight: 600 }}>
              {n + 1 >= liste.length ? "Voir ma note" : "Question suivante"}
            </button>
          )}
        </div>
      </div>
    );
  }

  if (mode === "creer") {
    const ok = type === "qroc"
      ? enonce.trim() && reponse.trim()
      : enonce.trim() && props.some((p) => p.txt.trim() && p.vrai);
    return (
      <div>
        <div className="flex gap-2 mb-4">
          {[["qcm", "Choix multiples"], ["qroc", "Réponse à rédiger"]].map(([v, l]) => (
            <button key={v} onClick={() => setType(v)} className="px-4 py-2 text-xs doux"
              style={{
                borderRadius: 999, fontWeight: 600,
                background: type === v ? T.accent : T.accentPale, color: type === v ? "#fff" : T.accent,
              }}>{l}</button>
          ))}
        </div>
        <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Énoncé</label>
        <textarea value={enonce} onChange={(e) => setEnonce(e.target.value)} rows={2}
          className="w-full p-3 rounded text-sm mb-4" style={{ border: `1px solid ${T.line}` }} />
        {type === "qroc" && (
          <>
            <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Réponse attendue</label>
            <textarea value={reponse} onChange={(e) => setReponse(e.target.value)} rows={3}
              placeholder="La réponse complète, telle que tu voudrais l'écrire le jour J."
              className="w-full p-3 rounded text-sm mb-3" style={{ border: `1px solid ${T.line}` }} />
            <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Mots-clés, séparés par des virgules</label>
            <input value={cles} onChange={(e) => setCles(e.target.value)}
              placeholder="hCG, échographie endovaginale, vacuité utérine"
              className="w-full p-3 rounded text-sm mb-3" style={{ border: `1px solid ${T.line}` }} />
          </>
        )}
        {type === "qcm" && props.map((p, i) => (
          <div key={i} className="flex gap-2 items-center mb-2">
            <span style={{ fontFamily: mono, width: 16 }}>{LETTRES[i]}</span>
            <input value={p.txt} onChange={(e) => setProps((l) => l.map((x, j) => j === i ? { ...x, txt: e.target.value } : x))}

          const coche = coches.includes(q.id);

                    borderRadius: 5, border: `2px solid ${coche ? T.bas : T.line}`,

/* Les propositions sont réordonnées avant affichage : sans cela, les réponses
   vraies finissent groupées en A, B, C, D. Le mélange dépend de l'identifiant
   de la question et d'une graine de session, donc il change d'une session à
   l'autre mais reste stable pendant qu'on répond. */
function permuter(liste, graine) {
  const a = [...liste];
  let s = Math.abs(graine || 1) % 2147483647;
  if (s <= 0) s += 2147483646;
  const tirage = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(tirage() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function graineDe(txt) {
  let h = 7;
  String(txt || "").split("").forEach((c) => { h = (h * 31 + c.charCodeAt(0)) % 2147483647; });
  return h;
}
const propsMelangees = (q, n, graine) =>
  permuter(q.props || [], graineDe(q.id || q.enonce) + (n || 0) * 101 + (graine || 0));

/* Barème des EDN : aucune discordance vaut 1 point, une discordance 0,5,
   deux discordances 0,2, au-delà 0. Une discordance est une proposition
   cochée à tort ou oubliée à tort. */
const discordances = (props, choix) =>
  (props || []).reduce((n, p, i) => n + (p.vrai !== choix.includes(i) ? 1 : 0), 0);
const pointsQcm = (d) => (d === 0 ? 1 : d === 1 ? 0.5 : d === 2 ? 0.2 : 0);
const noteSur20 = (pts, n) => (n ? Math.round((pts / n) * 20 * 10) / 10 : null);

function Proposition({ p, i, choisi, corrige, onClic }) {
  /* quatre situations distinctes une fois corrigé */
  const oubli = corrige && p.vrai && !choisi;        // il fallait cocher, tu ne l'as pas fait
  const erreur = corrige && !p.vrai && choisi;       // tu as coché, il ne fallait pas
  const bonne = corrige && p.vrai && choisi;         // correctement cochée
  const rate = oubli || erreur;

  let bg = T.card, bd = T.line, pastilleBg = "#1E3149", pastilleC = T.ink2, marque = LETTRES[i];
  if (corrige) {
    if (bonne) { bg = NIV[3].doux; bd = T.haut; pastilleBg = T.haut; pastilleC = "#fff"; marque = "✓"; }
    else if (oubli) { bg = NIV[1].doux; bd = T.bas; pastilleBg = T.bas; pastilleC = "#fff"; marque = "!"; }
    else if (erreur) { bg = NIV[1].doux; bd = T.bas; pastilleBg = T.bas; pastilleC = "#fff"; marque = "✗"; }
    else { bg = T.card; bd = T.line; pastilleBg = "#1E3149"; pastilleC = T.ink2; marque = LETTRES[i]; }
  } else if (choisi) { bd = T.accent; bg = T.accentPale; pastilleBg = T.accent; pastilleC = "#fff"; }

  const etiquette = oubli ? "Il fallait la cocher" : erreur ? "Tu l'as cochée à tort"
    : bonne ? "Bien cochée" : corrige ? "Bien laissée de côté" : null;

  return (
    <div className="mb-2 doux" style={{
      background: bg, border: `${rate ? 2 : 1.5}px solid ${bd}`, borderRadius: 16,
      boxShadow: rate ? `0 0 0 3px ${T.bas}22` : "none",
    }}>
      <button disabled={corrige} onClick={onClic} className="w-full text-left flex gap-3 items-start"
        style={{ padding: "13px 15px" }}>
        <span className="shrink-0 flex items-center justify-center doux"
          style={{ width: 26, height: 26, borderRadius: 999, background: pastilleBg, color: pastilleC, fontSize: 13, fontWeight: 800 }}>
          {marque}
        </span>
        <span className="flex-1 min-w-0">
          <span className="block" style={{ fontSize: 14.5, lineHeight: 1.45 }}>{p.txt}</span>
          {corrige && (
            <span className="inline-block mt-1.5 px-2.5 py-1" style={{
              borderRadius: 999, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.04em",
              background: rate ? T.bas : bonne ? T.haut : "#1E3149",
              color: rate || bonne ? "#0E1A29" : T.ink2,
            }}>{etiquette}</span>
          )}
        </span>
      </button>
      {corrige && p.pourquoi && (
        <p style={{
          margin: "0 15px 13px 54px", fontFamily: lecture, fontSize: 14.5, lineHeight: 1.65,
          color: p.vrai ? NIV[3].encre : NIV[1].encre,
        }}>
          <b style={{ fontFamily: serif, fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase" }}>
            {p.vrai ? "Vraie — " : "Fausse — "}
          </b>
          {p.pourquoi}
        </p>
      )}
    </div>
  );
}

function Correction({ juste, texte, props: pr, choix }) {
  const oublis = (pr || []).map((p, i) => p.vrai && !(choix || []).includes(i) ? LETTRES[i] : null).filter(Boolean);
  const erreurs = (pr || []).map((p, i) => !p.vrai && (choix || []).includes(i) ? LETTRES[i] : null).filter(Boolean);
  if (!texte && !oublis.length && !erreurs.length) return null;
  return (
    <div className="mt-4" style={{ background: T.card, borderRadius: 20, padding: "16px 18px", border: `1px solid ${juste ? T.haut : T.bas}` }}>
      <p style={{ fontWeight: 700, fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase",
        color: juste ? NIV[3].encre : NIV[1].encre, marginBottom: 8 }}>
        {juste ? "Bonne réponse — le raisonnement" : "Le raisonnement attendu"}
      </p>

      {!juste && (oublis.length > 0 || erreurs.length > 0) && (
        <div className="flex flex-wrap gap-2 mb-3">
          {oublis.length > 0 && (
            <span className="px-3 py-1.5 text-xs" style={{ borderRadius: 999, background: NIV[1].doux, color: NIV[1].encre, fontWeight: 700 }}>
              Oubliée{oublis.length > 1 ? "s" : ""} : {oublis.join(", ")}
            </span>
          )}
          {erreurs.length > 0 && (
            <span className="px-3 py-1.5 text-xs" style={{ borderRadius: 999, background: NIV[1].doux, color: NIV[1].encre, fontWeight: 700 }}>
              Cochée{erreurs.length > 1 ? "s" : ""} à tort : {erreurs.join(", ")}
            </span>
          )}
        </div>
      )}

      {texte && <p style={{ fontFamily: lecture, fontSize: 16, lineHeight: 1.75, color: "#D6E4F1" }}>{texte}</p>}
    </div>
  );
}

/* ================== question à réponse rédigée ================== */

        <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>

        </div>
        <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{total}</span>
        <button onClick={onQuitter} className="text-xs" style={{ color: T.ink2 }}>✕</button>

      <p className="mb-1" style={{ fontSize: 16, lineHeight: 1.55, fontWeight: 500 }}>{q.enonce}</p>
      <p className="text-xs mb-4" style={{ color: T.ink2 }}>Question à rédiger</p>

      <textarea value={saisie} onChange={(e) => setSaisie(e.target.value)} rows={6} disabled={montre}

        className="w-full p-3 text-sm mb-3"
        style={{ borderRadius: 16, border: `1.5px solid ${montre ? T.line : T.accent}`, lineHeight: 1.6 }} />

      {!montre ? (
        <button onClick={() => setMontre(true)} disabled={!saisie.trim()}
          className="w-full py-3.5 text-sm doux"
          style={{ background: saisie.trim() ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
          Voir la réponse attendue
        </button>
      ) : (
        <>
          {cles.length > 0 && (
            <div className="mb-3">
              <p className="text-xs mb-2" style={{ color: T.ink2 }}>
                Mots-clés retrouvés dans ta réponse : {trouves.length} sur {cles.length}
              </p>

                {cles.map((k) => {
                  const ok = trouves.includes(k);
                  return (
                    <span key={k} className="text-xs px-3 py-1.5"
                      style={{ borderRadius: 999, fontWeight: 600,
                        background: ok ? NIV[3].doux : NIV[1].doux, color: ok ? NIV[3].encre : NIV[1].encre }}>
                      {k}
                    </span>
                  );
                })}
              </div>
            </div>
          )}

          <div style={{ background: T.accentPale, borderRadius: 18, padding: "14px 16px" }}>
            <p className="text-xs mb-2" style={{ color: T.accent, fontWeight: 700 }}>Réponse attendue</p>
            <p style={{ fontFamily: lecture, fontSize: 16, lineHeight: 1.7, color: "#D6E4F1" }}>{q.reponse}</p>
            {q.explication && (
              <p className="mt-3 pt-3" style={{ borderTop: `1px solid ${T.line}`, fontFamily: lecture, fontSize: 15, lineHeight: 1.7, color: "#D6E4F1" }}>
                {q.explication}
              </p>
            )}
          </div>

          <p className="text-xs mt-4 mb-2" style={{ color: T.ink2 }}>
            Corrige-toi honnêtement : une réponse à moitié juste ne rapporte pas la moitié des points le jour J.
          </p>
          <div className="flex gap-3">
            {[["Manqué", 0, 1], ["Partiel", 0.5, 2], ["Réussi", 1, 3]].map(([l, v, k]) => (
              <button key={l} onClick={() => { onNoter(v); onSuivant(); }}
                className="flex-1 py-3 text-sm doux"
                style={{ background: NIV[k].c, color: NIV[k].txt, borderRadius: 999, fontWeight: 600 }}>{l}</button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ================== progression d'un item ================== */
function Progression({ resultats, seances = [], onOuvrirSeance }) {
  const moy = seances.length
    ? Math.round((seances.reduce((a, x) => a + x.note, 0) / seances.length) * 10) / 10 : null;
  const taux = resultats.length
    ? Math.round((resultats.reduce((a, r) => a + r.valeur, 0) / resultats.length) * 100) : null;

  const cum = [];
  let s2 = 0;
  resultats.forEach((r, i) => { s2 += r.valeur; cum.push(Math.round((s2 / (i + 1)) * 100)); });
  const L = 300, H = 90;
  const pts = cum.length > 1
    ? cum.map((v, i) => `${(i / (cum.length - 1)) * L},${H - (v / 100) * H}`).join(" ") : "";

  return (
    <div>
      <div className="flex flex-wrap gap-2.5 mb-5">
        <div style={{ background: T.card, borderRadius: 20, padding: "14px 16px", flex: "1 1 140px" }}>
          <p className="text-xs uppercase" style={{ letterSpacing: "0.09em", color: T.ink2 }}>Réussite</p>
          <p style={{ fontFamily: serif, fontSize: 30, lineHeight: 1.15, color: couleur(taux) }}>
            {taux === null ? "—" : taux + " %"}
          </p>
          <p className="text-xs" style={{ color: T.ink2 }}>{resultats.length} réponse(s)</p>
        </div>
        <div style={{ background: T.card, borderRadius: 20, padding: "14px 16px", flex: "1 1 140px" }}>
          <p className="text-xs uppercase" style={{ letterSpacing: "0.09em", color: T.ink2 }}>Note moyenne</p>
          <p style={{ fontFamily: serif, fontSize: 30, lineHeight: 1.15, color: couleur(moy === null ? null : moy * 5) }}>
            {moy === null ? "—" : moy}<span style={{ fontSize: 16, color: T.ink2 }}>{moy === null ? "" : " / 20"}</span>
          </p>
          <p className="text-xs" style={{ color: T.ink2 }}>{seances.length} séance(s)</p>
        </div>
      </div>

      {pts && (
        <>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
            Réussite cumulée
          </p>
          <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="90" preserveAspectRatio="none" className="mb-5">
            <line x1="0" y1={H * 0.2} x2={L} y2={H * 0.2} stroke={T.line} strokeDasharray="3 3" />
            <polyline points={pts} fill="none" stroke={T.accent} strokeWidth="2" strokeLinejoin="round" />
          </svg>
        </>
      )}

      <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
        Mes séances
      </p>
      {seances.length === 0 ? (
        <p className="text-sm" style={{ color: T.ink2, lineHeight: 1.7 }}>
          Aucune séance notée pour l'instant. Lance « Se tester » sur les QCM :
          chaque séance donnera une note sur 20 selon le barème des EDN, et tu pourras
          revenir ici revoir les questions ratées.
        </p>
      ) : (
        [...seances].sort((a, b) => b.t - a.t).map((x) => {
          const rates = (x.detail || []).filter((q) => q.disc > 0).length;
          return (
            <button key={x.id} onClick={() => onOuvrirSeance && onOuvrirSeance(x)}
              className="w-full text-left mb-2 flex items-center gap-3 doux"
              style={{ background: T.card, borderRadius: 16, padding: "13px 15px",
                borderLeft: `4px solid ${couleur(x.note * 5)}` }}>
              <span className="shrink-0" style={{ fontFamily: serif, fontSize: 21, fontWeight: 700,
                color: couleur(x.note * 5), width: 62 }}>
                {x.note}<span style={{ fontSize: 12, color: T.ink2 }}>/20</span>
              </span>
              <span className="flex-1 min-w-0">
                <span className="block text-sm">{dCourte(x.date)}</span>
                <span className="block text-xs mt-0.5" style={{ color: T.ink2 }}>
                  {(x.detail || []).length} question(s) · {rates} avec discordance
                </span>
              </span>
              <span style={{ color: T.accent, fontSize: 17 }}>›</span>
            </button>
          );
        })
      )}
    </div>
  );
}

/* revue d'une séance passée : on revoit chaque question et ses discordances */
function RevueSeance({ seance, onFermer, onErreurQcm, dejaMises = [] }) {
  const [filtre, setFiltre] = useState("rates");
  const [mises, setMises] = useState([]);
  const detail = seance.detail || [];
  const liste = filtre === "rates" ? detail.filter((q) => q.disc > 0) : detail;

  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        <button onClick={onFermer} className="flex items-center justify-center doux shrink-0"
          style={{ width: 34, height: 34, borderRadius: 999, border: `1px solid ${T.line}`, color: T.accent }}>←</button>
        <span className="flex-1">
          <span className="block text-sm" style={{ fontWeight: 600 }}>Séance du {dCourte(seance.date)}</span>
          <span className="block text-xs" style={{ color: T.ink2 }}>{detail.length} question(s)</span>
        </span>
        <span style={{ fontFamily: serif, fontSize: 24, fontWeight: 700, color: couleur(seance.note * 5) }}>
          {seance.note}<span style={{ fontSize: 13, color: T.ink2 }}>/20</span>
        </span>
      </div>

      <div className="flex gap-2 mb-4">
        {[["rates", `Avec discordance (${detail.filter((q) => q.disc > 0).length})`],
          ["tout", `Toutes (${detail.length})`]].map(([v, l]) => (
          <button key={v} onClick={() => setFiltre(v)} className="px-4 py-2 text-xs doux"
            style={{ borderRadius: 999, fontWeight: 600,
              background: filtre === v ? T.accent : T.accentPale, color: filtre === v ? "#fff" : T.accent }}>{l}</button>
        ))}
      </div>

      {liste.length === 0 ? (
        <p className="text-sm py-4" style={{ color: T.ink2 }}>Aucune discordance sur cette séance.</p>
      ) : liste.map((q, k) => (
        <div key={k} className="mb-4" style={{ background: T.card, borderRadius: 20, padding: "16px 18px" }}>
          <div className="flex items-start gap-3 mb-3">
            <span className="flex-1" style={{ fontSize: 15, lineHeight: 1.5, fontWeight: 500 }}>{q.enonce}</span>
            <span className="shrink-0 text-xs px-2.5 py-1" style={{ borderRadius: 999, fontWeight: 800,
              background: q.disc === 0 ? T.haut : q.disc <= 2 ? T.moyen : T.bas, color: "#0E1A29" }}>
              {q.pts} pt
            </span>
            {onErreurQcm && (() => {
              const mise = mises.includes(q.enonce) || dejaMises.includes(q.enonce);
              return (
                <button onClick={() => { if (mise) return; setMises((l) => [...l, q.enonce]); onErreurQcm(q); }}
                  aria-label="Mettre de côté dans Erreurs"
                  className="shrink-0 flex items-center justify-center doux"
                  style={{ width: 30, height: 30, borderRadius: 999,
                    background: mise ? T.moyen : "transparent",
                    border: `1px solid ${mise ? T.moyen : T.line}`,
                    color: mise ? "#0E1A29" : T.ink2, fontSize: 14 }}>
                  {mise ? "✓" : "⚑"}
                </button>
              );
            })()}
          </div>
          {(q.props || []).map((p, i) => (
            <Proposition key={i} p={p} i={i} choisi={p.coche} corrige onClic={() => {}} />
          ))}
          {q.explication && <Correction juste={q.disc === 0} texte={q.explication}
            props={q.props} choix={(q.props || []).map((p, i) => (p.coche ? i : -1)).filter((i) => i >= 0)} />}
        </div>
      ))}
    </div>
  );
}

/* Met les erreurs en texte lisible, pour l'application Notes ou n'importe quel
   autre carnet. Le partage natif d'iOS propose Notes parmi les destinations. */
function erreursEnTexte(liste, items, titre) {
  const par = {};
  liste.forEach((e) => {
    const it = items.find((i) => i.id === e.itemId);
    const cle = it ? `Item ${it.numero} — ${it.titre}` : "Sans item rattaché";
    (par[cle] = par[cle] || []).push(e);
  });
  let t = (titre || "MES ERREURS") + " — EDN Go\n" + dCourte(auj()) + "\n";
  Object.keys(par).sort().forEach((cle) => {
    t += "\n\n═══ " + cle + " ═══\n";
    par[cle].forEach((e) => {
      if (e.qcm) {
        t += "\n▸ " + e.qcm.enonce + "\n";
        (e.qcm.props || []).forEach((p) => {
          const marque = p.vrai && p.coche ? "  ✓ " : p.vrai && !p.coche ? "  ! " : !p.vrai && p.coche ? "  ✗ " : "    ";
          t += marque + p.txt + "\n";
        });
        t += "  (✓ juste · ! oubliée · ✗ cochée à tort)\n";
        if (e.qcm.explication) t += "  → " + e.qcm.explication + "\n";
      } else {
        t += "\n▸ " + e.texte + "\n";
      }
    });
  });
  return t;
}

}
function Session({ paquet, onNoter, onFin, items }) {
  const [depart] = useState(Date.now());
  const [n, setN] = useState(0); const [face, setFace] = useState(false);
  const [choix, setChoix] = useState([]); const [corrige, setCorrige] = useState(false);
  const [score, setScore] = useState(0);
  const e = paquet[n];
  if (!e) return null;
  const it = items.find((i) => i.id === e.itemId);

  const suivant = (bon) => {
    onNoter(e.itemId, bon ? 1 : 0, e.genre, e.id);
    if (bon) setScore((s) => s + 1);
    if (n + 1 >= paquet.length) return onFin();
    setN(n + 1); setFace(false); setChoix([]); setCorrige(false);
  };

  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
          <div className="doux h-1.5 rounded-full" style={{ width: (n / paquet.length) * 100 + "%", background: T.accent }} />
        </div>
        <Chrono depart={depart} />
        <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{paquet.length} · {score}</span>
        <button onClick={onFin} className="text-xs" style={{ color: T.ink2 }}>✕</button>
      </div>
      <p className="text-xs mb-3" style={{ color: T.ink2 }}>{it ? `Item ${it.numero} — ${it.titre}` : ""}</p>

      {e.genre === "qcm" && e.type === "qroc" ? (
        <Qroc key={e.id || n} q={e} n={n} total={paquet.length}
          onNoter={(v) => { onNoter(e.itemId, v, "qroc", e.id); if (v >= 1) setScore((s) => s + 1); }}
          onSuivant={() => { if (n + 1 >= paquet.length) return onFin(); setN(n + 1); setFace(false); setChoix([]); setCorrige(false); }}
          onQuitter={onFin} />
      ) : e.genre === "carte" ? (
        <>
          <div onClick={() => setFace(true)} className="p-5 rounded mb-4 text-sm"
            style={{ background: T.card, border: `1px solid ${T.line}`, minHeight: 120, lineHeight: 1.7, cursor: "pointer" }}>
            <p>{e.recto}</p>
            {face ? <p className="mt-4 pt-4" style={{ borderTop: `1px solid ${T.line}` }}>{e.verso}</p>
              : <p className="text-xs mt-4" style={{ color: T.ink2 }}>Appuie pour retourner</p>}
          </div>
          {face && (
            <div className="flex gap-2">
              <button onClick={() => suivant(false)} className="flex-1 py-3 rounded text-sm" style={{ background: T.bas, color: "#fff" }}>Pas su</button>
              <button onClick={() => suivant(true)} className="flex-1 py-3 rounded text-sm" style={{ background: T.haut, color: "#fff" }}>Su</button>
            </div>
          )}
        </>
      ) : (
        <>
          <p className="text-sm mb-4">{e.enonce}</p>
          {propsMelangees(e, n, depart).map((p, i) => (
            <Proposition key={i} p={p} i={i} choisi={choix.includes(i)} corrige={corrige}
              onClic={() => setChoix((l) => l.includes(i) ? l.filter((x) => x !== i) : [...l, i])} />
          ))}
          {corrige && (
            <Correction juste={propsMelangees(e, n, depart).every((p, i) => p.vrai === choix.includes(i))} texte={e.explication} props={propsMelangees(e, n, depart)} choix={choix} />
          )}
          <div className="mt-4">
            {!corrige ? (
              <button onClick={() => setCorrige(true)} className="px-4 py-3 rounded text-sm" style={{ background: T.ink, color: T.card }}>Valider</button>
            ) : (
              <button onClick={() => suivant(propsMelangees(e, n, depart).every((p, i) => p.vrai === choix.includes(i)))}
                className="px-4 py-3 rounded text-sm" style={{ background: T.ink, color: T.card }}>Suivant</button>
            )}
          </div>
        </>
      )}
    </div>
  );
}

const conteneur = document.getElementById("root");
conteneur.dataset.ok = "1";
conteneur.dataset.monte = "0";
const racine = ReactDOM.createRoot(conteneur);
if (ReactDOM.flushSync) ReactDOM.flushSync(() => racine.render(<Garde><App /></Garde>));
else racine.render(<Garde><App /></Garde>);
setTimeout(function () { conteneur.dataset.monte = "1"; }, 0);
</script>

<script>
(function () {
  function montrer(titre, detail, ligne) {
    var r = document.getElementById("root");
    if (!r) return;
    r.innerHTML = '<div id="ecran"><div style="max-width:640px;text-align:left">'
      + '<p style="color:#E4685D"><b>' + titre + '</b></p>'
      + '<p style="font-size:13px;margin-top:10px;white-space:pre-wrap">' + String(detail).replace(/</g, "&lt;") + '</p>'
      + (ligne ? '<p style="font-size:12px;margin-top:10px;color:#8CA3BB">Ligne ' + ligne + ' du script.</p>' : '')
      + '</div></div>';
  }

  function demarrer() {
    var src = document.getElementById("source-jsx").textContent;
    var code;
    try {
      code = Babel.transform(src, { presets: ["react"] }).code;
    } catch (e) {
      return montrer("Erreur de syntaxe dans le code.", e.message, e.loc ? e.loc.line : null);
    }
    try {
      window.__demarrage = true;
      (0, eval)(code);
    } catch (e) {
      var msg = (e && (e.name ? e.name + " : " : "") + (e.message || "")) || String(e);
      return montrer("EDN Go n'a pas pu demarrer.", msg + "\n\n" + ((e && e.stack) || ""), null);
    }
  }

  /* Babel, React et Tailwind viennent d'internet : on attend qu'ils soient la */
  window.addEventListener("error", function (ev) {
    var r = document.getElementById("root");
    if (r && r.dataset.monte !== "1") {
      var d = ev.error ? ((ev.error.name || "") + " : " + (ev.error.message || "")) : (ev.message || "");
      montrer("EDN Go n'a pas pu demarrer.", d + "\n\n" + ((ev.error && ev.error.stack) || ""));
    }
  });

  var essais = 0;
  (function attendre() {
    if (window.Babel && window.React && window.ReactDOM) return demarrer();
    if (++essais > 150) {
      return montrer("Les composants de la page n'ont pas pu etre telecharges.",
        "Verifie ta connexion internet, puis recharge la page.\n\n"
        + "Manquant : " + [!window.React && "React", !window.ReactDOM && "ReactDOM", !window.Babel && "Babel"]
          .filter(Boolean).join(", "));
    }
    setTimeout(attendre, 100);
  })();
})();
</script>
