        );
      })}

      <p className="text-xs mt-4" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Le temps est compté entre deux réponses, plafonné à cinq minutes par question
        pour ne pas compter les pauses.
      </p>
    </div>
  );
}

/* ================== Exercice ================== */
function Exercice({ items, colleges, cartes, qcms, resultats, onLancer, onRattrapage }) {
  const [mode, setMode] = useState("faibles");
  const [cible, setCible] = useState("");
  const [longueur, setLongueur] = useState(20);

  const exos = (id) => [
    ...cartes.filter((c) => c.itemId === id).map((c) => ({ ...c, genre: "carte" })),
    ...qcms.filter((c) => c.itemId === id).map((c) => ({ ...c, genre: "qcm" })),
  ];
  const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;

  const scores = {};
  items.forEach((i) => (scores[i.id] = taux(resultats.filter((r) => r.itemId === i.id))));

  const construire = () => {
    let base = items.filter((i) => exos(i.id).length);
    if (mode === "college" && cible) base = base.filter((i) => i.collegeId === cible);
    if (mode === "faibles") base = base.sort((a, b) => (scores[a.id] ?? -1) - (scores[b.id] ?? -1)).slice(0, 10);
    if (mode === "jamais") base = base.filter((i) => scores[i.id] === null);
    let paquet = base.flatMap((i) => exos(i.id));
    if (mode === "qroc") paquet = paquet.filter((e) => e.type === "qroc");
    if (mode === "flash") paquet = paquet.filter((e) => e.genre === "carte");
    return paquet.sort(() => Math.random() - 0.5).slice(0, longueur);
  };

  const dispo = construire().length;

  const parCollege = colleges.map((c) => {
    const ids = items.filter((i) => i.collegeId === c.id).map((i) => i.id);
    const l = resultats.filter((r) => ids.includes(r.itemId));
    const dispos = items.filter((i) => i.collegeId === c.id && exos(i.id).length).length;
    return { c, n: l.length, taux: taux(l), testes: new Set(l.map((r) => r.itemId)).size, total: ids.length, dispos };
  }).filter((x) => x.dispos > 0);

  const faibles = items.map((i) => ({ i, n: resultats.filter((r) => r.itemId === i.id).length, t: scores[i.id] }))
    .filter((x) => x.n >= 3 && x.t < 70).sort((a, b) => a.t - b.t).slice(0, 6);

  const MODES = [
    ["faibles", "Mes points faibles"],
    ["college", "Un collège"],
    ["jamais", "Jamais testés"],
    ["qroc", "Questions rédigées"],
    ["flash", "Flashcards seules"],
    ["tout", "Tout le programme"],
  ];

  return (
    <div>
      <button onClick={onRattrapage} className="w-full text-left p-4 mb-4 doux"
        style={{ background: "linear-gradient(135deg, #7C3F9E 0%, #2C86C6 100%)", borderRadius: 22, border: "none" }}>
        <div className="flex items-center gap-2 mb-1">
          <span style={{ fontSize: 16 }}>❋</span>
          <span style={{ fontFamily: serif, fontSize: 18, fontWeight: 700, color: "#fff" }}>Le Rattrapage</span>
        </div>
        <div className="text-xs" style={{ color: "#E4EEFA", lineHeight: 1.6 }}>
          Trente questions transversales sur ce que tu rates le plus · mardi et vendredi
        </div>
      </button>

      <div className="ombre mb-5" style={{ background: T.card, borderRadius: 24, padding: "22px 22px 24px" }}>
        <p className="text-xs uppercase mb-1" style={{ letterSpacing: "0.12em", color: T.accent }}>Séance d'entraînement</p>
        <h2 className="mb-4" style={{ fontFamily: serif, fontSize: 26 }}>Au travail</h2>

        <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Sur quoi</p>
        <div className="flex flex-wrap gap-2 mb-4">
          {MODES.map(([v, l]) => (
            <button key={v} onClick={() => setMode(v)} className="px-4 py-2 text-xs doux"
              style={{
                borderRadius: 999, fontWeight: 600,
                background: mode === v ? T.accent : "transparent", color: mode === v ? "#fff" : T.ink2,
                border: `1px solid ${mode === v ? T.accent : T.line}`,
              }}>{l}</button>
          ))}
        </div>

        {mode === "college" && (
          <select value={cible} onChange={(e) => setCible(e.target.value)}
            className="w-full px-3 py-2.5 text-sm mb-4" style={{ borderRadius: 14, border: `1px solid ${T.line}` }}>
            <option value="">Choisis un collège…</option>
            {parCollege.map(({ c, dispos }) => (
              <option key={c.id} value={c.id}>{c.nom} — {dispos} item(s) prêts</option>
            ))}
          </select>
        )}

        <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Combien de questions</p>
        <div className="flex gap-2 mb-5">
          {[10, 20, 40, 80].map((k) => (
            <button key={k} onClick={() => setLongueur(k)} className="flex-1 py-2.5 text-sm doux"
              style={{
                borderRadius: 999, fontWeight: 600,
                background: longueur === k ? T.accentPale : "transparent", color: longueur === k ? T.accent : T.ink2,
                border: `1px solid ${longueur === k ? T.accent : T.line}`,
              }}>{k}</button>
          ))}
        </div>

        <button onClick={() => onLancer(construire())} disabled={!dispo}
          className="w-full py-4 doux" style={{
            background: dispo ? T.accent : "#24384F", color: "#fff", borderRadius: 999,
            fontWeight: 700, fontSize: 16,
          }}>
          {dispo ? `Commencer — ${Math.min(dispo, longueur)} questions` : "Aucun exercice disponible"}
        </button>
        <p className="text-xs mt-3 text-center" style={{ color: T.ink2 }}>
          Pas de notification, pas d'onglet : la barre du haut disparaît pendant la séance.
        </p>
      </div>

      {faibles.length > 0 && (
        <>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
            Ce qui te coûte le plus de points
          </p>
          <div className="mb-5">
            {faibles.map(({ i, n, t }) => {
              const c = colleges.find((x) => x.id === i.collegeId);
              return (
                <div key={i.id} className="flex items-center gap-3 py-2.5" style={{ borderBottom: `1px solid ${T.line}` }}>
                  <span className="shrink-0" style={{ width: 42, fontSize: 13, fontWeight: 700, color: couleur(t) }}>{t}%</span>
                  <span className="flex-1 min-w-0 text-xs" style={{ lineHeight: 1.4 }}>
                    <span style={{ color: T.ink2 }}>{i.numero}. </span>{i.titre}
                    <span className="block mt-0.5" style={{ color: pal(c ? c.nom : "").fg }}>{c ? c.nom : ""}</span>
                  </span>
                  <span className="text-xs shrink-0" style={{ color: T.ink2 }}>{n} essais</span>
                </div>
              );
            })}
          </div>
        </>
      )}

      <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Niveau par collège</p>
      {parCollege.length === 0 ? (
        <p className="text-sm" style={{ color: T.ink2 }}>Aucun collège ne contient encore d'exercice.</p>
      ) : parCollege.sort((a, b) => (a.taux ?? 101) - (b.taux ?? 101)).map(({ c, n, taux: t, testes, total }) => {
        const p = pal(c.nom);
        return (
          <div key={c.id} className="mb-3">
            <div className="flex justify-between items-baseline text-xs mb-1">
              <span style={{ color: p.fg, fontWeight: 600 }}>{c.nom}</span>
              <span style={{ color: T.ink2 }}>
                {t === null ? "jamais testé" : `${t} % sur ${n} réponses`} · {testes}/{total} items
              </span>
            </div>
            <div className="h-2 rounded-full" style={{ background: "#1E3149" }}>
              <div className="doux h-2 rounded-full" style={{ width: (t || 0) + "%", background: couleur(t) }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ================== My AI ================== */
function MyAI({ items, colleges, resultats }) {
  const [cle, setCle] = useState("");
  const [reglages, setReglages] = useState(false);
  const [messages, setMessages] = useState([]);
  const [saisie, setSaisie] = useState("");
  const [attente, setAttente] = useState(false);
  const [erreur, setErreur] = useState(null);
  const bas = useRef(null);

  useEffect(() => { setCle(litCle()); }, []);
  useEffect(() => { if (bas.current) bas.current.scrollIntoView({ behavior: "smooth" }); }, [messages, attente]);

  const enregistrerCle = (v) => { setCle(v); ecritCle(v); };

  const contexte = () => {
    const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;
    const faibles = items.map((i) => ({ i, n: resultats.filter((r) => r.itemId === i.id).length, t: taux(resultats.filter((r) => r.itemId === i.id)) }))
      .filter((x) => x.n >= 3 && x.t < 70).sort((a, b) => a.t - b.t).slice(0, 8)
      .map((x) => `${x.i.numero} ${x.i.titre} (${x.t} %)`);
    return `Tu es un enseignant de médecine française qui prépare un étudiant de DFASM aux EDN.
Réponds en français, de façon structurée et concise, au niveau attendu aux EDN.
Appuie-toi sur les référentiels des Collèges nationaux et les recommandations françaises en vigueur.
N'invente jamais un chiffre, un seuil ou une posologie : si tu n'es pas certain, dis-le explicitement.
${faibles.length ? "Items sur lesquels l'étudiant est en difficulté : " + faibles.join(" ; ") + "." : ""}`;
  };

  const envoyer = async () => {
    const texte = saisie.trim();
    if (!texte || attente) return;
    const suite = [...messages, { role: "user", content: texte }];
    setMessages(suite); setSaisie(""); setAttente(true); setErreur(null);
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": cle,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          system: contexte(),
          messages: suite.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message || "Réponse refusée");
      const txt = (d.content || []).filter((x) => x.type === "text").map((x) => x.text).join("\n");
      setMessages([...suite, { role: "assistant", content: txt || "(réponse vide)" }]);
    } catch (e) {
      setErreur(String(e.message || e));
      setMessages(suite);
    }
    setAttente(false);
  };

  if (!cle || reglages) {
    return (
      <div>
        <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>My AI</h2>
        <p className="text-xs mb-5" style={{ color: T.ink2, lineHeight: 1.7 }}>
          Pour qu'une IA réponde directement ici, il faut ta propre clé d'API Anthropic.
          Elle est enregistrée uniquement dans le stockage de ce navigateur : elle n'est pas dans le fichier
          du site, personne d'autre ne peut la lire, et je ne la vois pas.
        </p>
        <input value={cle} onChange={(e) => enregistrerCle(e.target.value)} type="password"
          placeholder="sk-ant-..." className="w-full px-3 py-2.5 text-sm mb-3"
          style={{ borderRadius: 14, border: `1px solid ${T.line}` }} />
        <div className="flex gap-2 mb-6">
          <button onClick={() => setReglages(false)} disabled={!cle}
            className="px-4 py-2.5 text-sm doux"
            style={{ background: cle ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
            Ouvrir la conversation
          </button>
          {cle && (
            <button onClick={() => { enregistrerCle(""); setMessages([]); }} className="px-4 py-2.5 text-sm"
              style={{ color: T.bas }}>Effacer la clé</button>
          )}
        </div>
        <div style={{ background: T.card, borderRadius: 20, padding: "18px 20px" }}>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Ce qu'il faut savoir</p>
          <p className="text-sm" style={{ color: T.ink2, lineHeight: 1.8 }}>
            Une clé s'obtient sur console.anthropic.com, avec un crédit prépayé.
            Chaque question coûte une fraction de centime, mais ce n'est pas gratuit.
            Sans clé, tu gardes l'onglet IA de chaque item, qui prépare le prompt à copier — même résultat,
            un aller-retour de plus.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        <h2 style={{ fontFamily: serif, fontSize: 24, flex: 1 }}>My AI</h2>
        {messages.length > 0 && (
          <button onClick={() => setMessages([])} className="text-xs px-3 py-1.5"
            style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>Effacer</button>
        )}
        <button onClick={() => setReglages(true)} className="text-xs px-3 py-1.5"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>Clé</button>
      </div>

      {messages.length === 0 && (
        <div className="mb-4" style={{ background: T.card, borderRadius: 20, padding: "18px 20px" }}>
          <p className="text-sm mb-3" style={{ color: T.ink2, lineHeight: 1.7 }}>
            Pose une question sur un item, demande un cas clinique, fais-toi expliquer un mécanisme.
            Tes items les plus faibles sont transmis en contexte.
          </p>
          {["Explique-moi la conduite devant une hémorragie du post-partum",
            "Fais-moi un cas clinique sur l'item 344",
            "Quelle différence entre PAG et RCIU ?"].map((q) => (
            <button key={q} onClick={() => setSaisie(q)} className="block text-left text-xs mb-2 px-3 py-2 doux"
              style={{ borderRadius: 12, background: T.accentPale, color: T.accent }}>{q}</button>
          ))}
        </div>
      )}

      <div className="mb-4">
        {messages.map((m, i) => (
          <div key={i} className="mb-3" style={{
            background: m.role === "user" ? T.accentPale : T.card,
            borderRadius: 18, padding: "14px 16px",
            marginLeft: m.role === "user" ? 40 : 0, marginRight: m.role === "user" ? 0 : 40,
          }}>
            {m.role === "assistant"
              ? <ResumeLu texte={m.content} />
              : <p className="text-sm" style={{ lineHeight: 1.6 }}>{m.content}</p>}
          </div>
        ))}
        {attente && <p className="text-sm mb-3" style={{ color: T.ink2 }}>Rédaction en cours…</p>}
        {erreur && (
          <p className="text-sm mb-3" style={{ background: NIV[1].doux, color: NIV[1].encre, borderRadius: 14, padding: "12px 14px" }}>
            {erreur}
          </p>
        )}
        <div ref={bas} />
      </div>

      <div className="flex gap-2 sticky bottom-3">
        <textarea value={saisie} onChange={(e) => setSaisie(e.target.value)} rows={2}
          onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) envoyer(); }}
          placeholder="Ta question…" className="flex-1 px-3 py-2.5 text-sm"
          style={{ borderRadius: 18, border: `1px solid ${T.line}`, lineHeight: 1.5 }} />
        <button onClick={envoyer} disabled={!saisie.trim() || attente}
          className="px-5 doux" style={{
            background: saisie.trim() && !attente ? T.accent : "#24384F", color: "#fff",
            borderRadius: 999, fontWeight: 700,
          }}>Envoyer</button>
      </div>
    </div>
  );
}

/* ================== résultats détaillés ================== */
function Resultats({ items, colleges, resultats, annales, cartes = [], qcms = [], seances = [] }) {
  const [revue, setRevue] = useState(null);
  const [periode, setPeriode] = useState(30);
  const [colFiltre, setColFiltre] = useState("tous");
  const [tri, setTri] = useState("faibles");
  const [ouvert, setOuvert] = useState(null);

  const depuis_ = new Date(Date.now() - periode * 86400000).toISOString().slice(0, 10);
  const R = resultats.filter((r) => r.date >= depuis_);
  const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;
  const global = taux(R);

  const parType = ["qcm", "qroc", "flash", "annale", "dossier"].map((t) => ({
    t, nom: { qcm: "QCM", qroc: "Questions rédigées", flash: "Flashcards", annale: "Annales", dossier: "Dossiers" }[t],
    l: R.filter((r) => r.type === t),
  })).filter((x) => x.l.length);

  const jours = [...new Set(R.map((r) => r.date))].sort();
  const serie = (() => {
    let n = 0;
    for (let k = 0; k < 400; k++) {
      const d = new Date(Date.now() - k * 86400000).toISOString().slice(0, 10);
      if (resultats.some((r) => r.date === d)) n++;
      else if (k > 0) break;
    }
    return n;
  })();

  /* tableau par item : le cœur de cet onglet */
  const lignes = items
    .filter((i) => colFiltre === "tous" || i.collegeId === colFiltre)
    .map((i) => {
      const h = resultats.filter((r) => r.itemId === i.id);
      const hp = R.filter((r) => r.itemId === i.id);
      const nbExos = cartes.filter((x) => x.itemId === i.id).length + qcms.filter((x) => x.itemId === i.id).length;
      return { i, n: h.length, nP: hp.length, t: taux(h), tP: taux(hp), nbExos,
        rates: h.filter((r) => r.valeur < 1).length,
        dernier: h.length ? h[h.length - 1].date : null };
    })
    .filter((x) => x.nbExos > 0 || x.n > 0);

  const triees = [...lignes].sort((a, b) => {
    if (tri === "faibles") return (a.t ?? 101) - (b.t ?? 101);
    if (tri === "solides") return (b.t ?? -1) - (a.t ?? -1);
    if (tri === "volume") return b.n - a.n;
    return a.i.numero - b.i.numero;
  });

  const testes = lignes.filter((x) => x.n > 0);
  const acquis = lignes.filter((x) => x.t !== null && x.t >= 80).length;
  const fragiles = lignes.filter((x) => x.t !== null && x.t < 50).length;

  const L = 300, H = 70;
  const serieJours = [];
  for (let k = periode - 1; k >= 0; k--) {
    const d = new Date(Date.now() - k * 86400000).toISOString().slice(0, 10);
    const l = resultats.filter((r) => r.date === d);
    serieJours.push(l.length ? taux(l) : null);
  }
  const pts = serieJours.map((v, i) => v === null ? null : `${(i / (serieJours.length - 1)) * L},${H - (v / 100) * H}`)
    .filter(Boolean).join(" ");

  return (
    <div>
      {revue && <RevueSeance seance={revue} onFermer={() => setRevue(null)} />}
      {revue ? null : (<>
      <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>Résultats</h2>
      <p className="text-xs mb-4" style={{ color: T.ink2 }}>Tout est calculé sur tes réponses, rien n'est déclaratif.</p>

      <div className="flex gap-2 mb-4 flex-wrap">
        {[7, 30, 90, 3650].map((p) => (
          <button key={p} onClick={() => setPeriode(p)} className="px-4 py-2 text-xs doux"
            style={{ borderRadius: 999, fontWeight: 600,
              background: periode === p ? T.accent : "transparent", color: periode === p ? "#fff" : T.ink2,
              border: `1px solid ${periode === p ? T.accent : T.line}` }}>
            {p === 3650 ? "Tout" : p + " j"}
          </button>
        ))}
      </div>

      {/* vue d'ensemble */}
      <div className="ombre mb-4" style={{ background: T.card, borderRadius: 24, padding: "20px 22px" }}>
        <div className="flex flex-wrap items-end gap-6 mb-4">
          <div>
            <p className="text-xs uppercase" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Réussite</p>
            <p style={{ fontFamily: serif, fontSize: 38, lineHeight: 1.05, color: couleur(global) }}>
              {global === null ? "—" : global + " %"}
            </p>
          </div>
          <div className="text-xs" style={{ color: T.ink2, lineHeight: 1.9 }}>
            <div><b style={{ color: T.ink }}>{R.length}</b> réponses · <b style={{ color: T.ink }}>{jours.length}</b> jours</div>
            <div><b style={{ color: T.ink }}>{serie}</b> jours d'affilée</div>
          </div>
          <div className="text-xs" style={{ color: T.ink2, lineHeight: 1.9 }}>
            <div><b style={{ color: T.haut }}>{acquis}</b> item(s) au-dessus de 80 %</div>
            <div><b style={{ color: T.bas }}>{fragiles}</b> item(s) sous 50 %</div>
          </div>
        </div>
        {pts && (
          <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="76" preserveAspectRatio="none">
            <line x1="0" y1={H * 0.2} x2={L} y2={H * 0.2} stroke={T.line} strokeDasharray="3 3" />
            <polyline points={pts} fill="none" stroke={T.accent} strokeWidth="2" strokeLinejoin="round" />
          </svg>
        )}
      </div>

      {parType.length > 0 && (
        <>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Par type d'exercice</p>
          <div className="mb-5">
            {parType.map((x) => (
              <div key={x.t} className="flex items-center gap-3 mb-2">
                <span className="text-xs" style={{ width: 130 }}>{x.nom}</span>
                <div className="flex-1 h-2 rounded-full" style={{ background: "#1E3149" }}>
                  <div className="doux h-2 rounded-full" style={{ width: taux(x.l) + "%", background: couleur(taux(x.l)) }} />
                </div>
                <span className="text-xs" style={{ width: 70, textAlign: "right", color: T.ink2 }}>
                  {taux(x.l)} % · {x.l.length}
                </span>
              </div>
            ))}
          </div>
        </>
      )}

      {/* détail item par item */}
      <div className="flex items-baseline justify-between mb-2">
        <p className="text-xs uppercase" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Détail par item</p>
        <span className="text-xs" style={{ color: T.ink2 }}>{testes.length}/{lignes.length} testés</span>
      </div>

      <div className="flex flex-wrap gap-1 mb-2">
        <Chip actif={colFiltre === "tous"} onClick={() => setColFiltre("tous")} p={{ fg: T.ink, bg: T.card }}>
          Toutes
        </Chip>
        {colleges.map((c) => {
          const n = items.filter((i) => i.collegeId === c.id)
            .filter((i) => cartes.some((x) => x.itemId === i.id) || qcms.some((x) => x.itemId === i.id)).length;
          return n ? (
            <Chip key={c.id} actif={colFiltre === c.id} onClick={() => setColFiltre(c.id)} p={pal(c.nom)}>
              {c.nom} {n}
            </Chip>
          ) : null;
        })}
      </div>

      <div className="flex gap-2 mb-3">
        {[["faibles", "Les plus faibles"], ["solides", "Les plus solides"], ["volume", "Les plus travaillés"], ["numero", "Par numéro"]].map(([v, l]) => (
          <button key={v} onClick={() => setTri(v)} className="px-3 py-1.5 text-xs doux"
            style={{ borderRadius: 999, fontWeight: 600,
              background: tri === v ? T.accentPale : "transparent", color: tri === v ? T.accent : T.ink2,
              border: `1px solid ${tri === v ? "transparent" : T.line}` }}>{l}</button>
        ))}
      </div>

      {triees.length === 0 ? (
        <p className="text-sm py-6" style={{ color: T.ink2 }}>
          Aucun item ne contient encore d'exercice. Ouvre un item et génère des QCM dans l'onglet IA.
        </p>
      ) : (
        <div className="ombre" style={{ background: T.card, borderRadius: 22, overflow: "hidden" }}>
          {triees.map((x) => {
            const c = colleges.find((y) => y.id === x.i.collegeId);
            const on = ouvert === x.i.id;
            return (
              <div key={x.i.id} style={{ borderBottom: `1px solid ${T.line}` }}>
                <button onClick={() => setOuvert(on ? null : x.i.id)} className="w-full text-left flex items-center gap-3 doux"
                  style={{ padding: "12px 15px" }}>
                  <span className="shrink-0 rounded-full" style={{ width: 9, height: 9, background: couleur(x.t) }} />
                  <span className="flex-1 min-w-0">
                    <span className="block text-sm" style={{ lineHeight: 1.35 }}>
                      <span style={{ color: T.ink2 }}>{x.i.numero}. </span>{x.i.titre}
                    </span>
                    <span className="block text-xs mt-0.5" style={{ color: pal(c ? c.nom : "").fg }}>{c ? c.nom : ""}</span>
                  </span>
                  <span className="shrink-0 text-xs" style={{ color: T.ink2, width: 62, textAlign: "right" }}>
                    {x.n} rép.
                  </span>
                  <span className="shrink-0" style={{ width: 52, textAlign: "right", color: couleur(x.t), fontWeight: 800 }}>
                    {x.t === null ? "—" : x.t + "%"}
                  </span>
                </button>

                {on && (
                  <div className="vue" style={{ background: T.paper, padding: "13px 15px" }}>
                    <div className="flex flex-wrap gap-2 text-xs mb-3">
                      <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.card, color: T.ink2 }}>
                        {x.nbExos} exercice(s) disponibles
                      </span>
                      <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.card, color: T.ink2 }}>
                        {x.rates} échec(s)
                      </span>
                      {x.dernier && (
                        <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.card, color: T.ink2 }}>
                          Dernier test le {dCourte(x.dernier)}
                        </span>
                      )}
                      {x.tP !== null && (
                        <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.card, color: couleur(x.tP), fontWeight: 700 }}>
                          {x.tP}% sur la période
                        </span>
                      )}
                    </div>
                    <div className="h-2 rounded-full mb-2" style={{ background: "#1E3149" }}>
                      <div className="doux h-2 rounded-full" style={{ width: (x.t || 0) + "%", background: couleur(x.t) }} />
                    </div>
                    <p className="text-xs" style={{ color: T.ink2, lineHeight: 1.6 }}>
                      {x.n === 0 ? "Jamais testé — lance une séance sur cet item."
                        : x.t >= 80 ? "Solide. Espace les révisions."
                        : x.t >= 50 ? "En cours d'acquisition. Retravaille les propositions ratées."
                        : "Fragile. Relis le résumé avant de refaire les QCM."}
                    </p>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {seances.length > 0 && (
        <>
          <p className="text-xs uppercase mb-2 mt-6" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
            Mes séances notées — appuie pour revoir tes erreurs
          </p>
          {[...seances].sort((a, b) => b.t - a.t).slice(0, 30).map((x) => {
            const it = items.find((i) => i.id === x.itemId);
            const rates = (x.detail || []).filter((q) => q.disc > 0).length;
            return (
              <button key={x.id} onClick={() => setRevue(x)}
                className="w-full text-left mb-2 flex items-center gap-3 doux"
                style={{ background: T.card, borderRadius: 16, padding: "13px 15px",
                  borderLeft: `4px solid ${couleur(x.note * 5)}` }}>
                <span className="shrink-0" style={{ fontFamily: serif, fontSize: 21, fontWeight: 700,
                  color: couleur(x.note * 5), width: 62 }}>
                  {x.note}<span style={{ fontSize: 12, color: T.ink2 }}>/20</span>
                </span>
                <span className="flex-1 min-w-0">
                  <span className="block text-sm truncate">
                    {it ? `${it.numero}. ${it.titre}` : "Item supprimé"}
                  </span>
                  <span className="block text-xs mt-0.5" style={{ color: T.ink2 }}>
                    {dCourte(x.date)} · {(x.detail || []).length} question(s) · {rates} avec discordance
                  </span>
                </span>
                <span style={{ color: T.accent, fontSize: 17 }}>›</span>
              </button>
            );
          })}
        </>
      )}

      <p className="text-xs mt-4" style={{ color: T.ink2 }}>
        {annales.length > 0 ? `${annales.length} annale(s) saisie(s).` : ""}
      </p>
      </>)}
    </div>
  );
}

class Garde extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ padding: 24, color: "#E2ECF6", lineHeight: 1.7 }}>
        <p style={{ color: "#E4685D", fontWeight: 700, marginBottom: 8 }}>Cet écran n'a pas pu s'afficher.</p>
        <p style={{ fontSize: 13, marginBottom: 12 }}>
          {String((this.state.err && this.state.err.message) || this.state.err)}
        </p>
        <button onClick={() => this.setState({ err: null })}
          style={{ background: "#2C86C6", color: "#fff", borderRadius: 999, padding: "10px 18px", fontWeight: 600 }}>
          Revenir
        </button>
        <p style={{ fontSize: 12, color: "#8CA3BB", marginTop: 14 }}>
          Tes données sont intactes. Envoie ce message si le problème revient.
        </p>
      </div>
    );
  }
}

/* ================== application ================== */
function App() {
  const depart = useRef(graine());
  const [colleges, setColleges] = useState(depart.current.colleges);
  const [items, setItems] = useState(depart.current.items);
  const [cartes, setCartes] = useState([]);
  const [qcms, setQcms] = useState([]);
  const [annales, setAnnales] = useState([]);
  const [resultats, setResultats] = useState([]);
  const [erreurs, setErreurs] = useState([]);
  const [cours, setCours] = useState(COURS_INIT);
  const [fiches, setFiches] = useState([]);
  const [taches, setTaches] = useState([]);
  const [dossiers, setDossiers] = useState([]);
  const [seances, setSeances] = useState([]);
  const [echec, setEchec] = useState(false);
  const [poids, setPoids] = useState(0);
  const [place, setPlace] = useState(null);
  const [dossierActif, setDossierActif] = useState(null);
  const [pret, setPret] = useState(false);
  const [alerte, setAlerte] = useState(null);

  const [vue, setVue] = useState("accueil"); // accueil | grille | colleges | erreurs
  const [collegeId, setCollegeId] = useState(null);
  const [itemId, setItemId] = useState(null);
  const [session, setSession] = useState(null);
  const [q, setQ] = useState("");
  const [menu, setMenu] = useState(false);
  const premier = useRef(true);

  useEffect(() => { placeDisponible().then((p) => p && setPlace(p)); }, []);

  useEffect(() => {
    (async () => {
      try {
        const d = JSON.parse((await window.storage.get(KEY)).value);
        if (d.colleges?.length) setColleges(d.colleges);
        if (d.items?.length) setItems(d.items);
        setCartes(d.cartes || []); setQcms(d.qcms || []);
        setAnnales(d.annales || []); setResultats(d.resultats || []);
        setErreurs(d.erreurs || []);
        if (d.cours?.length) setCours(d.cours);
        /* les fiches sont désormais dans la grande réserve ; on reprend celles
           restées dans l'ancien emplacement, puis on les y déplace */
        let f = [];
        try { f = (await prendreLourd("fiches")) || []; } catch (x) {}
        const anciennes = d.fiches || [];
        if (anciennes.length && !f.length) { f = anciennes; try { await poserLourd("fiches", f); } catch (x) {} }
        setFiches(f);
        setTaches(d.taches || []);
        setDossiers(d.dossiers || []);
        setSeances(d.seances || []);
      } catch {
        try { /* reprise de l'ancienne version */
          const v = JSON.parse((await window.storage.get(KEY_ANCIEN)).value);
          if (v.colleges?.length) setColleges(v.colleges);
          if (v.items?.length) setItems(v.items.map((i) => ({
            id: i.id, collegeId: i.collegeId, numero: i.numero, titre: i.titre,
            resume: [i.resume, i.fiche].filter(Boolean).join("\n\n"), tours: [], niveau: 0,
          })));
          if (v.qcms) setQcms(v.qcms);
        } catch { /* première ouverture */ }
      }
      setPret(true);
    })();
  }, []);

  /* Aligne les données sauvegardées sur le catalogue officiel : renomme les
     anciens collèges, réaffecte chaque item à son collège, fusionne les
     doublons de numéro en conservant les QCM, fiches et résultats liés. */
  useEffect(() => {
    if (!pret) return;

    /* collège officiel de chaque numéro d'item */
    const collegeDe = {};
    Object.entries(CATALOGUE).forEach(([nom, liste]) =>
      liste.forEach(([numero]) => (collegeDe[numero] = nom)));
    const titreDe = {};
    Object.values(CATALOGUE).forEach((liste) =>
      liste.forEach(([numero, titre]) => (titreDe[numero] = titre)));

    /* un collège par nom officiel, en réutilisant ceux qui existent déjà */
    const parNom = {};
    colleges.forEach((c) => { if (!parNom[c.nom]) parNom[c.nom] = c; });
    const cols = [];
    Object.keys(CATALOGUE).forEach((nom) => {
      cols.push(parNom[nom] || { id: uid(), nom, resume: "" });
    });
    const idDe = {};
    cols.forEach((c) => (idDe[c.nom] = c.id));

    /* un seul item par numéro : on garde celui qui porte des données */
    const poids = (i) => (i.comp || 0) * 100 + (i.tours || []).length * 10
      + (i.resume ? 5 : 0) + (i.note ? 3 : 0);
    const gardes = {};
    const remplace = {};
    [...items].sort((a, b) => poids(b) - poids(a)).forEach((i) => {
      if (gardes[i.numero]) { remplace[i.id] = gardes[i.numero].id; return; }
      gardes[i.numero] = i;
    });

    const nouveauxItems = Object.keys(collegeDe).map((n) => {
      const num = Number(n);
      const ancien = gardes[num];
      return ancien
        ? { ...ancien, numero: num, titre: titreDe[num], collegeId: idDe[collegeDe[num]] }
        : { id: uid(), collegeId: idDe[collegeDe[num]], numero: num, titre: titreDe[num],
            resume: "", tours: [], comp: 0 };
    }).sort((a, b) => a.numero - b.numero);

    /* les contenus suivent l'item conservé */
    const suit = (l) => l.map((x) => (x.itemId && remplace[x.itemId] ? { ...x, itemId: remplace[x.itemId] } : x));

    const colsSupprimes = colleges.length - cols.length;
    const itemsFusionnes = Object.keys(remplace).length;
    const itemsAjoutes = nouveauxItems.length - Object.keys(gardes).length + itemsFusionnes;

    if (itemsFusionnes) {
      setQcms(suit); setCartes(suit); setAnnales(suit);
      setResultats(suit); setErreurs(suit); setTaches(suit); setFiches(suit);
    }
    if (colsSupprimes !== 0 || cols.some((c, k) => c !== colleges[k])) setColleges(cols);
    setItems(nouveauxItems);

    const msg = [];
    if (itemsAjoutes > 0) msg.push(`${itemsAjoutes} item(s) ajouté(s)`);
    if (itemsFusionnes) msg.push(`${itemsFusionnes} doublon(s) fusionné(s)`);
    if (colsSupprimes > 0) msg.push(`${colsSupprimes} collège(s) en double supprimé(s)`);
    if (msg.length) setAlerte("Programme mis à jour : " + msg.join(", ") + ". Tes QCM et fiches ont suivi.");
  }, [pret]);

  useEffect(() => {
    if (!pret) return;
    if (premier.current) { premier.current = false; return; }
    const t = setTimeout(async () => {
      /* Les cartes au stylet partent dans IndexedDB, qui dispose de centaines de
         mégaoctets. Le reste, léger, reste dans le stockage simple. */
      let fichesOk = true;
      try { await poserLourd("fiches", fiches); } catch (e) { fichesOk = false; }

      const donnees = JSON.stringify({ colleges, items, cartes, qcms, annales, resultats,
        erreurs, cours, taches, dossiers, seances, fiches: [] });
      setPoids(donnees.length);
      try {
        await window.storage.set(KEY, donnees);
        setEchec(!fichesOk);
        placeDisponible().then((p) => p && setPlace(p));
      } catch (e) {
        /* Une sauvegarde qui échoue en silence fait perdre du travail : on le dit,
           et on garde une copie de secours pour l'export. */
        setEchec(true);
        try { window.__edngoSecours = donnees; } catch (x) {}
        setAlerte("ENREGISTREMENT IMPOSSIBLE — le stockage est plein. Exporte tes données "
          + "immédiatement depuis l'accueil, puis allège tes cartes au stylet.");
      }
    }, 500);
    return () => clearTimeout(t);
  }, [colleges, items, cartes, qcms, annales, resultats, erreurs, cours, fiches, taches, dossiers, seances, pret]);

  /* mesure du temps passé entre deux réponses, plafonné pour ignorer les pauses */
  const horlogeRep = useRef(Date.now());
  const noter = (itemId, valeur, type, exoId) => {
    const ms = Math.min(Date.now() - horlogeRep.current, 300000);
    horlogeRep.current = Date.now();
    setResultats((l) => [...l, { id: uid(), itemId, valeur, type, exoId: exoId || null,
      date: auj(), t: Date.now(), ms }]);
  };

  /* Marquer sa compréhension compte un passage sur l'item. Le quatrième
     paramètre sert au retour en arrière : il restaure la liste d'origine. */
  const definirComp = (id, v, date, tours) =>
    setItems((l) => l.map((i) => {
      if (i.id !== id) return i;
      const base = { ...i, comp: v, dateComp: v === 0 ? null : (date !== undefined ? date : auj()) };
      if (tours !== undefined) return { ...base, tours };
      if (date === undefined && v > 0) return { ...base, tours: [...(i.tours || []), auj()] };
      return base;
    }));

  const definirNiveau = (id, v) =>
    v === -1
      ? setItems((l) => l.map((i) => i.id === id ? { ...i, tours: (i.tours || []).slice(0, -1) } : i))
      : setItems((l) => l.map((i) => i.id === id ? { ...i, niveau: v, dateNiveau: auj() } : i));

  /* cocher une tâche liée à un item compte automatiquement un passage */
  const majTaches = (nouvelles) => {
    const avant = {};
    taches.forEach((t) => (avant[t.id] = !!t.fait));
    nouvelles.forEach((t) => {
      if (t.type === "item" && t.itemId && t.fait && avant[t.id] === false) {
        setItems((l) => l.map((i) => i.id === t.itemId
          ? { ...i, tours: [...(i.tours || []), auj()], dateComp: auj(), comp: i.comp || 3 } : i));
      }
    });
    setTaches(nouvelles);
  };

  const marquerTour = (id) =>
    setItems((l) => l.map((i) => i.id === id ? { ...i, tours: [...(i.tours || []), auj()] } : i));
  const annulerTour = (id) =>
    setItems((l) => l.map((i) => i.id === id ? { ...i, tours: (i.tours || []).slice(0, -1) } : i));

  const item = items.find((i) => i.id === itemId) || null;
  const college = colleges.find((c) => c.id === collegeId) || null;

  const scores = useMemo(() => {
    const m = {};
    items.forEach((i) => (m[i.id] = scoreItem(i.id, resultats)));
    return m;
  }, [items, resultats]);

  const testes = items.filter((i) => scores[i.id] !== null);
  const solides = testes.filter((i) => scores[i.id] >= 80);

  const resultats7 = useMemo(() => {
    const jours = [];
    for (let d = 13; d >= 0; d--) {
      const date = new Date(Date.now() - d * 86400000).toISOString().slice(0, 10);
      const r = resultats.filter((x) => x.date === date);
      jours.push({ date, n: r.length, taux: r.length ? Math.round(r.reduce((s, x) => s + x.valeur, 0) / r.length * 100) : null });
    }
    return jours;
  }, [resultats]);

  const recherche = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return null;
    return items.filter((i) => correspond(i, s)).slice(0, 50);
  }, [q, items]);

  const exos = (id) => [
    ...cartes.filter((c) => c.itemId === id).map((c) => ({ ...c, genre: "carte" })),
    ...qcms.filter((c) => c.itemId === id).map((c) => ({ ...c, genre: "qcm" })),
  ];

  const lancerSessionCollege = (cid) => {
    const paquet = items.filter((i) => i.collegeId === cid)
      .flatMap((i) => exos(i.id)).sort(() => Math.random() - 0.5).slice(0, 20);
    if (!paquet.length) return setAlerte("Aucun QCM ni flashcard sur ce collège pour l'instant.");
    setSession(paquet);
  };

  const tousExos = useMemo(() => [
    ...cartes.map((c) => ({ ...c, genre: "carte" })),
    ...qcms.map((c) => ({ ...c, genre: "qcm" })),
  ], [cartes, qcms]);

  const revision = useMemo(() => aReviser(tousExos, resultats), [tousExos, resultats]);

  const rattrapage = useMemo(() => {
    const p = construireRattrapage(items, colleges, cartes, qcms, resultats, 30);
    const cols = new Set(p.map((e) => items.find((i) => i.id === e.itemId)?.collegeId).filter(Boolean));
    return { dispo: rattrapageDu() && p.length >= 5, n: p.length, cols: cols.size, fait: dernierRattrapage() === auj() };
  }, [items, colleges, cartes, qcms, resultats]);

  const lancerRattrapage = () => {
    const p = construireRattrapage(items, colleges, cartes, qcms, resultats, 30);
    if (p.length < 5) return setAlerte("Pas encore assez d'exercices pour bâtir un rattrapage.");
    noterRattrapage();
    setSession(p);
  };

  const lancerRevision = () => {
    const p = [...revision.du, ...revision.neufs.slice(0, Math.max(0, 20 - revision.du.length))].slice(0, 20);
    if (!p.length) return setAlerte("Rien à réviser aujourd'hui. Reviens demain, ou lance une séance libre.");
    setSession(p);
  };

  const lancerSessionFaible = () => {
    const cibles = items
      .filter((i) => exos(i.id).length)
      .sort((a, b) => (scores[a.id] ?? -1) - (scores[b.id] ?? -1))
      .slice(0, 8);
    const paquet = cibles.flatMap((i) => exos(i.id)).sort(() => Math.random() - 0.5).slice(0, 20);
    if (!paquet.length) return setAlerte("Écris d'abord quelques flashcards ou QCM sur un item.");
    setSession(paquet);
  };

  const exporter = () => {
    const b = new Blob([JSON.stringify({ colleges, items, cartes, qcms, annales, resultats,
      erreurs, cours, fiches, taches, dossiers, seances }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = `edn-go-${VERSION}-${auj()}.json`; a.click();
    URL.revokeObjectURL(a.href);
  };
  const importer = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        /* sauvegarde complète : elle contient des items ou des collèges */
        if (!Array.isArray(d) && (Array.isArray(d.items) || Array.isArray(d.colleges))) {
          if (d.colleges?.length) setColleges(d.colleges);
          if (d.items?.length) setItems(d.items);
          setCartes(d.cartes || []); setQcms(d.qcms || []);
          setAnnales(d.annales || []); setResultats(d.resultats || []);
          setErreurs(d.erreurs || []);
          if (d.cours?.length) setCours(d.cours);
          if (d.fiches) setFiches(d.fiches);
          if (d.taches) setTaches(d.taches);
          if (d.dossiers) setDossiers(d.dossiers);
          if (d.seances) setSeances(d.seances);
          setAlerte(`Sauvegarde restaurée : ${(d.items || []).length} items, ${(d.qcms || []).length} QCM, `
            + `${(d.cartes || []).length} flashcards, ${(d.fiches || []).length} fiche(s). Les PDF ne sont pas dans l'export.`);
          return;
        }
        const lot = Array.isArray(d) ? { resumes: d } : (d.resumes || d.flashcards || d.qcms) ? d : null;
        if (lot) {
          const parNum = {};
          items.forEach((i) => (parNum[i.numero] = i.id));
          let nr = 0, nf = 0, nq = 0, doublons = 0;
          const orphelins = new Set();

          if (lot.resumes) setItems((l) => l.map((i) => {
            const t = lot.resumes.find((x) => Number(x.numero) === i.numero);
            if (t && t.resume) { nr++; return { ...i, resume: t.resume }; }
            return i;
          }));

          if (lot.flashcards) {
            const nv = [];
            lot.flashcards.forEach((c) => {
              const id = parNum[Number(c.numero)];
              if (!id) return orphelins.add(c.numero);
              const existe = cartes.some((x) => x.itemId === id && x.recto === c.recto)
                || nv.some((x) => x.itemId === id && x.recto === c.recto);
              if (existe) { doublons++; return; }
              nv.push({ id: uid(), itemId: id, recto: c.recto, verso: c.verso }); nf++;
            });
            if (nv.length) setCartes((l) => [...l, ...nv]);
          }

          if (lot.qcms) {
            const nv = [];
            lot.qcms.forEach((c) => {
              const id = parNum[Number(c.numero)];
              if (!id) return orphelins.add(c.numero);
              const existe = qcms.some((x) => x.itemId === id && x.enonce === c.enonce)
                || nv.some((x) => x.itemId === id && x.enonce === c.enonce);
              if (existe) { doublons++; return; }
              nv.push(c.type === "qroc"
                ? { id: uid(), itemId: id, type: "qroc", enonce: c.enonce, reponse: c.reponse, cles: c.cles || [], explication: c.explication || "" }
                : { id: uid(), itemId: id, enonce: c.enonce, props: c.props, explication: c.explication || "" });
              nq++;
            });
            if (nv.length) setQcms((l) => [...l, ...nv]);
          }

          let msg = `Importé : ${nr} résumé(s), ${nf} flashcard(s), ${nq} QCM.`;
          if (doublons) msg += ` ${doublons} doublon(s) ignoré(s).`;
          if (orphelins.size) msg += ` Items introuvables : ${[...orphelins].join(", ")}.`;
          setAlerte(msg);
          return;
        }
        setAlerte("Fichier non reconnu : ni sauvegarde, ni lot de contenu.");
      } catch { setAlerte("Fichier illisible."); }
    };
    r.readAsText(f); e.target.value = "";
  };

  if (!pret) return <div className="flex items-center justify-center h-screen" style={{ color: T.ink2 }}>Ouverture…</div>;

  const retour = () => {
    if (session) return setSession(null);
    if (item) setItemId(null);
    else if (college) setCollegeId(null);
    else if (vue !== "accueil") setVue("accueil");
  };

  return (
    <div className="min-h-screen w-full doux" style={{
      background: T.paper, color: T.ink, "--acc": T.accent,
    }}>
      <style>{`
        *:focus-visible { outline: 2px solid ${T.accent}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        button { touch-action: manipulation; }
        textarea, input { font-family: inherit; }
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2E4863; border-radius: 99px; border: 2px solid ${T.paper}; }
        ::-webkit-scrollbar-thumb:hover { background: #3E5C7C; }
        * { scrollbar-width: thin; scrollbar-color: #2E4863 transparent; }
        .doux { transition: background 180ms ease, color 180ms ease, width 340ms ease, box-shadow 180ms ease, transform 180ms cubic-bezier(0.22,1,0.36,1); }
        @keyframes entree { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .vue { animation: entree 240ms cubic-bezier(0.22, 1, 0.36, 1); }
        /* changement d'onglet : le contenu monte doucement, sans clignotement */
        @keyframes onglet { from { opacity: 0; transform: translateY(14px) scale(0.995); } to { opacity: 1; transform: none; } }
        .onglet { animation: onglet 300ms cubic-bezier(0.22, 1, 0.36, 1); }
        /* les cartes se soulèvent légèrement au toucher */
        .doux:active { transform: scale(0.975); }
        .case { transition: transform 180ms cubic-bezier(0.22,1,0.36,1), background 180ms ease, border-color 180ms ease; }
        .case:active { transform: scale(0.93); }
        /* les listes apparaissent en cascade très courte */
        @keyframes cascade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .ombre { transition: box-shadow 200ms ease, transform 200ms cubic-bezier(0.22,1,0.36,1); }
        @media (prefers-reduced-motion: reduce) {
          .onglet, .vue { animation: none; }
          .doux:active, .case:active { transform: none; }
        }
        @keyframes voletSort { from { transform: rotateX(0deg); } to { transform: rotateX(-90deg); } }
        @keyframes voletEntre { from { transform: rotateX(90deg); } to { transform: rotateX(0deg); } }
        button, .doux { -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.97); }
        .relief { transition: transform 180ms cubic-bezier(0.22,1,0.36,1), box-shadow 180ms ease, background 180ms ease, filter 180ms ease; }
        @media (hover: hover) {
          .relief:hover { transform: scale(1.055); box-shadow: 0 8px 22px rgba(0,0,0,0.34); filter: brightness(1.14); z-index: 3; }
          .releve:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.32); filter: brightness(1.08); }
        }
        .relief:active, .releve:active { transform: scale(0.97); }
        * { -webkit-overflow-scrolling: touch; }
        h2, h3, h4 { font-weight: 600; letter-spacing: -0.015em; }
        .carte { border-radius: 22px; }
        .ombre { box-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.22); }
      `}</style>

      <header className="sticky top-0 z-30 doux" style={{
        background: T.paper, borderBottom: `1px solid ${T.line}` }}>
      <div className="px-4 pt-3 pb-2 flex items-center gap-3">
        {(session || college || item || vue !== "accueil") ? (
          <button onClick={retour} aria-label="Revenir en arrière"
            className="flex items-center justify-center doux shrink-0"
            style={{ width: 38, height: 38, borderRadius: 999, background: T.card, border: `1px solid ${T.line}`, color: T.accent, fontSize: 19 }}>
            ←
          </button>
        ) : (
          <span style={{ fontFamily: serif, fontSize: 19, fontWeight: 700, letterSpacing: "-0.01em" }}>
            EDN <span style={{ color: T.accent }}>Go</span>
            <span style={{ fontSize: 11, fontWeight: 600, color: T.ink2, marginLeft: 7 }}>{VERSION}</span>
          </span>
        )}
        {!session && (
          <button onClick={() => setMenu(!menu)} className="flex items-center gap-2 px-4 py-2 doux"
            style={{ borderRadius: 999, background: menu ? T.accent : T.card, border: `1px solid ${menu ? T.accent : T.line}` }}>
            <span style={{ fontSize: 14, color: menu ? "#0E1A29" : T.accent }}>
              {(ONGLETS.find(([v]) => v === vue) || ["", "", "☰"])[2]}
            </span>
            <span className="text-sm" style={{ fontWeight: 600, color: menu ? "#0E1A29" : T.ink }}>
              {(ONGLETS.find(([v]) => v === vue) || ["", "Menu"])[1]}
            </span>
            <span style={{ fontSize: 9, color: menu ? "#0E1A29" : T.ink2 }}>{menu ? "▲" : "▼"}</span>
          </button>
        )}
        <div className="flex-1" />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Item ou n°…"
          className="px-3 py-2 text-sm w-28 sm:w-52"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, background: T.card }} />
      </div>

      </header>

      {menu && !session && (
        <div onClick={() => setMenu(false)}
          style={{ position: "fixed", inset: 0, zIndex: 40, background: "rgba(6,13,22,0.74)", backdropFilter: "blur(7px)" }}>
          <div onClick={(e) => e.stopPropagation()} className="vue"
            style={{ maxWidth: 580, margin: "76px auto 0", padding: "0 16px" }}>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              {ONGLETS.map(([v, l, ic, sous, acc]) => {
                const on = vue === v && !college && !item;
                return (
                  <button key={v} onClick={() => { setVue(v); setCollegeId(null); setItemId(null); setQ(""); setMenu(false); }}
                    className="text-left releve"
                    style={{
                      background: on ? acc : melange(acc, "#17293E", 0.13),
                      borderRadius: 20, padding: "16px 17px",
                      border: `1px solid ${on ? acc : melange(acc, "#24384F", 0.3)}`,
                    }}>
                    <span style={{ fontSize: 20, display: "block", marginBottom: 5, color: on ? "#0E1A29" : acc }}>{ic}</span>
                    <span className="block text-sm" style={{ fontWeight: 700, color: on ? "#0E1A29" : T.ink }}>{l}</span>
                    <span className="block text-xs mt-0.5" style={{ color: on ? "rgba(14,26,41,0.72)" : T.ink2 }}>{sous}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {alerte && (
        <button onClick={() => setAlerte(null)} className="w-full px-4 py-2 text-sm text-left"
          style={{ background: "#33261A", color: T.ink }}>{alerte} ✕</button>
      )}

      {echec && (
        <div style={{ position: "sticky", top: 0, zIndex: 45, background: T.bas, padding: "10px 16px" }}>
          <p className="text-xs" style={{ color: "#0E1A29", fontWeight: 700, lineHeight: 1.5 }}>
            Tes modifications ne sont plus enregistrées : le stockage du navigateur est plein.
            Exporte tes données depuis l'accueil, puis supprime quelques cartes au stylet.
          </p>
        </div>
      )}

      <div className="flex">
      {!session && !dossierActif && (
        <nav className="hidden lg:flex flex-col gap-1 shrink-0 py-5 px-2 sticky"
          style={{ width: 92, top: 64, height: "calc(100vh - 64px)", borderRight: `1px solid ${T.line}`, overflowY: "auto" }}>
          {ONGLETS.map(([v, l, ic, sous, acc]) => {
            const on = vue === v && !college && !item;
            return (
              <button key={v} onClick={() => { setVue(v); setCollegeId(null); setItemId(null); setQ(""); setMenu(false); }}
                title={l} className="relief flex flex-col items-center justify-center gap-1.5"
                style={{
                  padding: "13px 3px", borderRadius: 18,
                  background: on ? acc : melange(acc, "#17293E", 0.10),
                  color: on ? "#0E1A29" : melange(acc, "#B9CBDD", 0.55),
                  border: `1px solid ${on ? acc : "transparent"}`,
                }}>
                <span style={{ fontSize: 21 }}>{ic}</span>
                <span style={{ fontSize: 10.5, fontWeight: on ? 800 : 600, lineHeight: 1.15, textAlign: "center" }}>{l}</span>
              </button>
            );
          })}
        </nav>
      )}

      <main key={`${vue}-${collegeId || ""}-${itemId || ""}-${session ? "s" : ""}`} className={"onglet py-5 flex-1 min-w-0 mx-auto " + (vue === "grille" && !college && !item && !session ? "px-2 w-full" : "px-4 max-w-3xl")}>
        {dossierActif ? (
          <SessionDossier dossier={dossierActif} onNoter={(v) => noter(null, v, "dossier")}
            onFin={() => setDossierActif(null)} />
        ) : session ? (
          <Session paquet={session} onNoter={noter} onFin={() => setSession(null)} items={items} />
        ) : recherche ? (
          <ListeItems items={recherche} scores={scores} colleges={colleges}
            onOuvrir={(id) => { const it = items.find((x) => x.id === id); setCollegeId(it.collegeId); setItemId(id); setQ(""); }} />
        ) : item ? (
          <VueItem
            item={item} college={college} score={scores[item.id]}
            cartes={cartes.filter((c) => c.itemId === item.id)}
            qcms={qcms.filter((c) => c.itemId === item.id)}
            annales={annales.filter((a) => a.itemId === item.id)}
            resultats={resultats.filter((r) => r.itemId === item.id)}
            seances={seances.filter((x) => x.itemId === item.id)}
            onSeance={(x) => setSeances((l) => [...l, { ...x, id: uid(), itemId: item.id }])}
            dejaMises={erreurs.filter((e) => e.qcm).map((e) => e.qcm.enonce)}
            onErreurQcm={(q) => setErreurs((l) => [...l, {
              id: uid(), texte: q.enonce, itemId: item.id, date: auj(), qcm: q,
            }])}
            onResume={(v) => setItems((l) => l.map((i) => i.id === item.id ? { ...i, resume: v } : i))}
            onAjoutCarte={(c) => setCartes((l) => [...l, { ...c, id: uid(), itemId: item.id }])}
            onSupprCarte={(id) => setCartes((l) => l.filter((x) => x.id !== id))}
            onAjoutQcm={(c) => setQcms((l) => [...l, { ...c, id: uid(), itemId: item.id }])}
            onSupprQcm={(id) => setQcms((l) => l.filter((x) => x.id !== id))}
            onAjoutAnnale={(a) => { setAnnales((l) => [...l, { ...a, id: uid(), itemId: item.id }]); noter(item.id, a.note / 100, "annale"); }}
            onSupprAnnale={(id) => setAnnales((l) => l.filter((x) => x.id !== id))}
            onNoter={(v, t) => noter(item.id, v, t)}
            onSession={(p) => setSession(p)}
            onTour={() => marquerTour(item.id)}
            onAnnulerTour={() => annulerTour(item.id)}
            onNiveau={(v) => definirNiveau(item.id, v)}
            fiches={fiches} onFiches={setFiches}
          />
        ) : college ? (
          <VueCollege college={college} items={items.filter((i) => i.collegeId === college.id)}
            scores={scores} cartes={cartes} qcms={qcms}
            onResume={(v) => setColleges((l) => l.map((c) => c.id === college.id ? { ...c, resume: v } : c))}
            onOuvrir={setItemId} />
        ) : vue === "grille" ? (
          <Grille colleges={colleges} items={items} scores={scores} resultats={resultats} cartes={cartes} qcms={qcms}
            taches={taches} onComp={definirComp}
            onNote={(id, txt) => setItems((l) => l.map((i) => i.id === id ? { ...i, note: txt } : i))}
            onOuvrir={(id) => { const it = items.find((x) => x.id === id); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : vue === "colleges" ? (
          <VueColleges colleges={colleges} items={items} scores={scores} onOuvrir={setCollegeId} />
        ) : vue === "cours" ? (
          <Cours cours={cours} onMaj={setCours} />
        ) : vue === "todo" ? (
          <Planning taches={taches} onMaj={majTaches} items={items} colleges={colleges}
            onComprendre={(id, v) => definirComp(id, v)}
            onNote={(id, v) => setItems((l) => l.map((i) => i.id === id ? { ...i, note: v } : i))}
            onOuvrirItem={(id) => { const it = items.find((x) => x.id === id); setVue("colleges"); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : vue === "exercice" ? (
          <Exercice items={items} colleges={colleges} cartes={cartes} qcms={qcms} resultats={resultats}
            onRattrapage={lancerRattrapage}
            onLancer={(p) => p.length ? setSession(p) : setAlerte("Aucun exercice ne correspond à ce choix.")} />
        ) : vue === "ai" ? (
          <MyAI items={items} colleges={colleges} resultats={resultats} />
        ) : vue === "horloge" ? (
          <Horloge />
        ) : vue === "stats" ? (
          <Stats items={items} colleges={colleges} resultats={resultats} cartes={cartes} qcms={qcms} />
        ) : vue === "dossiers" ? (
          <Dossiers dossiers={dossiers} onMaj={setDossiers} items={items} colleges={colleges}
            onLancer={(d) => setDossierActif(d)} />
        ) : vue === "cards" ? (
          <MyCards fiches={fiches} onMaj={setFiches} items={items} colleges={colleges}
            onOuvrirItem={(id) => { const it = items.find((x) => x.id === id); setVue("colleges"); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : vue === "resultats" ? (
          <Resultats items={items} colleges={colleges} resultats={resultats} annales={annales}
            cartes={cartes} qcms={qcms} seances={seances} />
        ) : vue === "erreurs" ? (
          <Erreurs erreurs={erreurs} items={items} colleges={colleges}
            onModifier={(id, texte) => setErreurs((l) => l.map((e) => e.id === id ? { ...e, texte } : e))}
            onBasculer={(id, genre) => setErreurs((l) => l.map((e) => e.id === id ? { ...e, genre } : e))}
            onAjouter={(texte, itemId, genre) => setErreurs((l) => [{ id: uid(), texte, itemId, genre: genre || "erreur", date: auj() }, ...l])}
            onSupprimer={(id) => setErreurs((l) => l.filter((x) => x.id !== id))}
            onOuvrir={(id) => { const it = items.find((x) => x.id === id); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : (
          <Accueil items={items} colleges={colleges} cartes={cartes} qcms={qcms}
            taches={taches} onTaches={majTaches} onPlanning={() => setVue("todo")}
            onOuvrirItem={(id) => { const it = items.find((x) => x.id === id); setVue("colleges"); setCollegeId(it.collegeId); setItemId(id); }}
            testes={testes} solides={solides} jours={resultats7}
            nbExos={cartes.length + qcms.length} nbAnnales={annales.length}
            onSession={lancerSessionFaible} onSessionCollege={lancerSessionCollege}
            revision={revision} onRevision={lancerRevision}
            rattrapage={rattrapage} onRattrapage={lancerRattrapage} place={place} poidsAffiche={echec}
            onLancerPaquet={(p) => setSession(p)}
            onGrille={() => setVue("grille")} onExporter={exporter} onImporter={importer} />
        )}
      </main>
      </div>

    </div>
  );
}

/* ================== accueil ================== */
/* sélecteur : QCM ou flashcards, sur les items qu'on choisit */
function Selecteur({ items, colleges, cartes, qcms, onLancer, onFermer }) {
  const [genre, setGenre] = useState("qcm");
  const [choisis, setChoisis] = useState([]);
  const [col, setCol] = useState("tous");
  const [q, setQ] = useState("");

  const source = genre === "flash" ? cartes : qcms;
  const nb = (id) => source.filter((x) => x.itemId === id).length;

  /* items correspondant à la recherche et au collège choisi */
  const filtres = items
    .filter((i) => col === "tous" || i.collegeId === col)
    .filter((i) => correspond(i, q))
    .sort((a, b) => a.numero - b.numero);

  const dispo = filtres.filter((i) => nb(i.id) > 0);
  /* ceux qui correspondent mais n'ont pas encore d'exercice : affichés en grisé
     pour éviter la liste vide inexplicable */
  const vides = q.trim() ? filtres.filter((i) => nb(i.id) === 0).slice(0, 8) : [];

  const total = choisis.reduce((s, id) => s + nb(id), 0);
  const basculer = (id) => setChoisis((l) => l.includes(id) ? l.filter((x) => x !== id) : [...l, id]);

  const lancer = () => {
    const ids = choisis.length ? choisis : dispo.map((i) => i.id);
    const paquet = source.filter((x) => ids.includes(x.itemId))
      .map((x) => ({ ...x, genre: genre === "flash" ? "carte" : "qcm" }))
      .sort(() => Math.random() - 0.5);
    if (paquet.length) onLancer(paquet);
  };

  return (
    <div className="ombre mb-4 vue" style={{ background: T.card, borderRadius: 24, padding: "18px 20px" }}>
      <div className="flex items-center gap-2 mb-4">
        {[["qcm", "QCM"], ["flash", "Flashcards"]].map(([v, l]) => (
          <button key={v} onClick={() => { setGenre(v); setChoisis([]); }} className="flex-1 py-3 doux"
            style={{ borderRadius: 999, fontWeight: 700, fontSize: 15,
              background: genre === v ? T.accent : T.accentPale, color: genre === v ? "#fff" : T.accent }}>
            {l}
            <span className="block text-xs" style={{ opacity: 0.8, fontWeight: 500 }}>
              {(v === "flash" ? cartes : qcms).length} disponibles
            </span>
          </button>
        ))}
        <button onClick={onFermer} className="text-sm px-2 shrink-0" style={{ color: T.ink2 }}>✕</button>
      </div>

      <div className="flex flex-wrap gap-1 mb-2">
        <Chip actif={col === "tous"} onClick={() => setCol("tous")} p={{ fg: T.ink, bg: T.paper }}>Toutes</Chip>
        {colleges.map((c) => {
          const k = items.filter((i) => i.collegeId === c.id && source.some((x) => x.itemId === i.id)).length;
          return k ? (
            <Chip key={c.id} actif={col === c.id} onClick={() => setCol(c.id)} p={pal(c.nom)}>{c.nom} {k}</Chip>
          ) : null;
        })}
      </div>

      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Chercher un item…"
        className="w-full px-3 py-2 text-sm mb-2" style={{ borderRadius: 999, border: `1px solid ${T.line}` }} />

      <div className="flex items-center gap-2 mb-2">
        <button onClick={() => setChoisis(dispo.map((i) => i.id))} className="text-xs px-3 py-1.5 doux"
          style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 600 }}>Tout cocher</button>
        <button onClick={() => setChoisis([])} className="text-xs px-3 py-1.5 doux"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>Tout décocher</button>
        <span className="flex-1" />
        <span className="text-xs" style={{ color: T.ink2 }}>
          {choisis.length ? `${choisis.length} item(s) · ${total} questions` : `${dispo.length} item(s) disponibles`}
        </span>
      </div>

      {dispo.length === 0 && vides.length === 0 ? (
        <p className="text-sm py-4" style={{ color: T.ink2, lineHeight: 1.6 }}>
          {q.trim()
            ? `Aucun item ne correspond à « ${q.trim()} »${col === "tous" ? "" : " dans ce collège"}.`
            : `Aucun ${genre === "flash" ? "jeu de flashcards" : "QCM"} pour l'instant. Ouvre un item et génère-en dans l'onglet IA.`}
        </p>
      ) : (
        <div style={{ maxHeight: 260, overflowY: "auto", borderRadius: 14, background: T.paper, padding: 6 }}>
          {dispo.map((i) => {
            const c = colleges.find((x) => x.id === i.collegeId);
            const on = choisis.includes(i.id);
            return (
              <button key={i.id} onClick={() => basculer(i.id)} className="w-full text-left flex items-center gap-3 doux"
                style={{ padding: "9px 10px", borderRadius: 12, background: on ? T.accentPale : "transparent" }}>
                <span className="shrink-0 flex items-center justify-center"
                  style={{ width: 22, height: 22, borderRadius: 7,
                    border: `2px solid ${on ? T.accent : "#3A5573"}`, background: on ? T.accent : "transparent",
                    color: "#fff", fontSize: 12, fontWeight: 800 }}>{on ? "✓" : ""}</span>
                <span className="flex-1 min-w-0 text-xs" style={{ lineHeight: 1.35 }}>
                  <span style={{ color: T.ink2 }}>{i.numero}. </span>{i.titre}
                  {c && <span className="block mt-0.5" style={{ color: pal(c.nom).fg }}>{c.nom}</span>}
                </span>
                <span className="shrink-0 text-xs" style={{ color: T.ink2 }}>{nb(i.id)}</span>
              </button>
            );
          })}

          {vides.length > 0 && (
            <>
              <p className="text-xs px-2 pt-3 pb-1" style={{ color: T.ink2 }}>
                Sans {genre === "flash" ? "flashcard" : "QCM"} pour l'instant
              </p>
              {vides.map((i) => {
                const c = colleges.find((x) => x.id === i.collegeId);
                return (
                  <div key={i.id} className="flex items-center gap-3" style={{ padding: "9px 10px", opacity: 0.45 }}>
                    <span className="shrink-0" style={{ width: 22, height: 22, borderRadius: 7, border: `2px solid #2E4763` }} />
                    <span className="flex-1 min-w-0 text-xs" style={{ lineHeight: 1.35 }}>
                      <span style={{ color: T.ink2 }}>{i.numero}. </span>{i.titre}
                      {c && <span className="block mt-0.5" style={{ color: pal(c.nom).fg }}>{c.nom}</span>}
                    </span>
                    <span className="shrink-0 text-xs" style={{ color: T.ink2 }}>0</span>
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}

      <button onClick={lancer} disabled={!dispo.length} className="w-full py-3.5 mt-3 doux"
        style={{ background: dispo.length ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 700 }}>
        {choisis.length ? `Commencer — ${total} question(s)` : `Commencer avec tout (${dispo.reduce((s, i) => s + nb(i.id), 0)})`}
      </button>
    </div>
  );
}
