/* ================== QCM ================== */
const LETTRES = ["A", "B", "C", "D", "E"];
function BanqueQcm({ qcms, onAjouter, onSupprimer, onNoter, onIA }) {
  const [mode, setMode] = useState("liste");
  const [enonce, setEnonce] = useState("");
  const [props, setProps] = useState(LETTRES.map(() => ({ txt: "", vrai: false })));
  const [explication, setExplication] = useState("");
  const [type, setType] = useState("qcm");
  const [reponse, setReponse] = useState(""); const [cles, setCles] = useState("");
  const [n, setN] = useState(0); const [choix, setChoix] = useState([]); const [corrige, setCorrige] = useState(false);
  const [saisie, setSaisie] = useState("");

  if (mode === "reviser") {
    const q = qcms[n]; if (!q) return null;
    if (q.type === "qroc") {
      return (
        <Qroc q={q} n={n} total={qcms.length}
          onNoter={(v) => onNoter(v, "qroc")}
          onSuivant={() => { if (n + 1 >= qcms.length) { setMode("liste"); setN(0); } else setN(n + 1); }}
          onQuitter={() => { setMode("liste"); setN(0); }} />
      );
    }
    const juste = (q.props || []).every((p, i) => p.vrai === choix.includes(i));
    return (
      <div>
        <div className="flex items-center gap-3 mb-4">
          <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
            <div className="doux h-1.5 rounded-full" style={{ width: ((n + (corrige ? 1 : 0)) / qcms.length) * 100 + "%", background: T.accent }} />
          </div>
          <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{qcms.length}</span>
          <button onClick={() => { setMode("liste"); setN(0); setChoix([]); setCorrige(false); }}
            className="text-xs" style={{ color: T.ink2 }}>✕</button>
        </div>

        <p className="mb-5" style={{ fontSize: 16, lineHeight: 1.55, fontWeight: 500 }}>{q.enonce}</p>

        {(q.props || []).map((p, i) => (
          <Proposition key={i} p={p} i={i} choisi={choix.includes(i)} corrige={corrige}
            onClic={() => setChoix((l) => l.includes(i) ? l.filter((x) => x !== i) : [...l, i])} />
        ))}

        {corrige && <Correction juste={juste} texte={q.explication} />}

        <div className="mt-5">
          {!corrige ? (
            <button onClick={() => { setCorrige(true); onNoter(juste ? 1 : 0, "qcm"); }} disabled={!choix.length}
              className="w-full py-3.5 text-sm doux"
              style={{ background: choix.length ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
              Valider
            </button>
          ) : (
            <button onClick={() => { if (n + 1 >= qcms.length) { setMode("liste"); setN(0); } else setN(n + 1); setChoix([]); setCorrige(false); }}
              className="w-full py-3.5 text-sm doux" style={{ background: T.ink, color: "#fff", borderRadius: 999, fontWeight: 600 }}>
              {n + 1 >= qcms.length ? "Terminer" : "Question suivante"}
            </button>
          )}
        </div>
      </div>
    );
  }

  if (mode === "creer") {
    const ok = type === "qroc"
      ? enonce.trim() && reponse.trim()
      : enonce.trim() && props.some((p) => p.txt.trim() && p.vrai);
    return (
      <div>
        <div className="flex gap-2 mb-4">
          {[["qcm", "Choix multiples"], ["qroc", "Réponse à rédiger"]].map(([v, l]) => (
            <button key={v} onClick={() => setType(v)} className="px-4 py-2 text-xs doux"
              style={{
                borderRadius: 999, fontWeight: 600,
                background: type === v ? T.accent : T.accentPale, color: type === v ? "#fff" : T.accent,
              }}>{l}</button>
          ))}
        </div>
        <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Énoncé</label>
        <textarea value={enonce} onChange={(e) => setEnonce(e.target.value)} rows={2}
          className="w-full p-3 rounded text-sm mb-4" style={{ border: `1px solid ${T.line}` }} />
        {type === "qroc" && (
          <>
            <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Réponse attendue</label>
            <textarea value={reponse} onChange={(e) => setReponse(e.target.value)} rows={3}
              placeholder="La réponse complète, telle que tu voudrais l'écrire le jour J."
              className="w-full p-3 rounded text-sm mb-3" style={{ border: `1px solid ${T.line}` }} />
            <label className="block text-xs uppercase mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Mots-clés, séparés par des virgules</label>
            <input value={cles} onChange={(e) => setCles(e.target.value)}
              placeholder="hCG, échographie endovaginale, vacuité utérine"
              className="w-full p-3 rounded text-sm mb-3" style={{ border: `1px solid ${T.line}` }} />
          </>
        )}
        {type === "qcm" && props.map((p, i) => (
          <div key={i} className="flex gap-2 items-center mb-2">
            <span style={{ fontFamily: mono, width: 16 }}>{LETTRES[i]}</span>
            <input value={p.txt} onChange={(e) => setProps((l) => l.map((x, j) => j === i ? { ...x, txt: e.target.value } : x))}
              placeholder="Proposition" className="px-2 py-2 rounded flex-1 text-sm" style={{ border: `1px solid ${T.line}` }} />
            <button onClick={() => setProps((l) => l.map((x, j) => j === i ? { ...x, vrai: !x.vrai } : x))}
              className="px-3 py-2 rounded text-xs"
              style={{ background: p.vrai ? T.haut : "transparent", color: p.vrai ? "#fff" : T.ink2, border: `1px solid ${p.vrai ? T.haut : T.line}` }}>vraie</button>
          </div>
        ))}
        <label className="block text-xs uppercase mt-4 mb-1" style={{ letterSpacing: "0.08em", color: T.ink2 }}>Correction</label>
        <textarea value={explication} onChange={(e) => setExplication(e.target.value)} rows={3}
          placeholder="Pourquoi les fausses sont fausses." className="w-full p-3 rounded text-sm" style={{ border: `1px solid ${T.line}` }} />
        <div className="flex gap-2 mt-4">
          <button disabled={!ok} onClick={() => {
            onAjouter(type === "qroc"
              ? { type: "qroc", enonce: enonce.trim(), reponse: reponse.trim(),
                  cles: cles.split(",").map((x) => x.trim()).filter(Boolean), explication }
              : { enonce: enonce.trim(), props: props.filter((p) => p.txt.trim()), explication });
            setEnonce(""); setProps(LETTRES.map(() => ({ txt: "", vrai: false })));
            setReponse(""); setCles(""); setExplication(""); setMode("liste");
          }} className="px-4 py-2 rounded text-sm" style={{ background: ok ? T.ink : T.line, color: T.card }}>Enregistrer</button>
          <button onClick={() => setMode("liste")} className="px-4 py-2 rounded text-sm" style={{ border: `1px solid ${T.line}` }}>Annuler</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex gap-2 mb-4">
        <button onClick={() => setMode("creer")} className="px-4 py-2.5 text-sm doux" style={{ background: T.accent, color: "#fff", borderRadius: 999, fontWeight: 600 }}>Nouveau QCM</button>
        {qcms.length > 0 && <button onClick={() => setMode("reviser")} className="px-4 py-2.5 text-sm doux" style={{ border: `1px solid ${T.line}`, borderRadius: 999, fontWeight: 600, color: T.ink }}>Se tester</button>}
        {onIA && <button onClick={() => onIA("qcm")} className="px-4 py-2.5 text-sm doux"
          style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600 }}>Générer</button>}
      </div>
      {qcms.length === 0 ? (
        <p className="text-sm" style={{ color: T.ink2 }}>Aucun QCM. Le bon moment pour en écrire un : juste après avoir raté la question.</p>
      ) : (
        <ul>{qcms.map((q) => (
          <li key={q.id} className="py-2 flex gap-3 text-sm" style={{ borderBottom: `1px solid ${T.line}` }}>
            <span className="flex-1">{q.enonce}</span>
            <span className="text-xs shrink-0" style={{ color: T.ink2 }}>
              {q.type === "qroc" ? "rédigée" : (q.props || []).length + " prop."}
            </span>
            <button onClick={() => onSupprimer(q.id)} className="text-xs px-1" style={{ color: T.bas }}>×</button>
          </li>
        ))}</ul>
      )}
    </div>
  );
}

function Proposition({ p, i, choisi, corrige, onClic }) {
  let bg = T.card, bd = T.line, pastilleBg = "#1E3149", pastilleC = T.ink2, marque = LETTRES[i];
  if (corrige) {
    if (p.vrai) { bg = NIV[3].doux; bd = T.haut; pastilleBg = T.haut; pastilleC = "#fff"; marque = "✓"; }
    else { bd = choisi ? T.bas : T.line; bg = choisi ? NIV[1].doux : T.card;
           pastilleBg = choisi ? T.bas : "#1E3149"; pastilleC = choisi ? "#fff" : T.ink2; marque = choisi ? "✗" : LETTRES[i]; }
  } else if (choisi) { bd = T.accent; bg = T.accentPale; pastilleBg = T.accent; pastilleC = "#fff"; }

  return (
    <div className="mb-2 doux" style={{ background: bg, border: `1.5px solid ${bd}`, borderRadius: 16 }}>
      <button disabled={corrige} onClick={onClic} className="w-full text-left flex gap-3 items-start"
        style={{ padding: "13px 15px" }}>
        <span className="shrink-0 flex items-center justify-center doux"
          style={{ width: 26, height: 26, borderRadius: 999, background: pastilleBg, color: pastilleC, fontSize: 13, fontWeight: 700 }}>
          {marque}
        </span>
        <span style={{ fontSize: 14.5, lineHeight: 1.45, paddingTop: 3 }}>{p.txt}</span>
      </button>
      {corrige && p.pourquoi && (
        <p style={{
          margin: "0 15px 13px 54px", fontFamily: lecture, fontSize: 14.5, lineHeight: 1.65,
          color: p.vrai ? NIV[3].encre : NIV[1].encre,
        }}>
          <b style={{ fontFamily: serif, fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase" }}>
            {p.vrai ? "Vraie — " : "Fausse — "}
          </b>
          {p.pourquoi}
        </p>
      )}
    </div>
  );
}

function Correction({ juste, texte }) {
  if (!texte) return null;
  return (
    <div className="mt-4" style={{ background: T.card, borderRadius: 20, padding: "16px 18px", border: `1px solid ${juste ? T.haut : T.bas}` }}>
      <p style={{ fontWeight: 700, fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase",
        color: juste ? NIV[3].encre : NIV[1].encre, marginBottom: 8 }}>
        {juste ? "Bonne réponse — le raisonnement" : "Le raisonnement attendu"}
      </p>
      <p style={{ fontFamily: lecture, fontSize: 16, lineHeight: 1.75, color: "#D6E4F1" }}>{texte}</p>
    </div>
  );
}

/* ================== question à réponse rédigée ================== */
function Qroc({ q, n, total, onNoter, onSuivant, onQuitter }) {
  const [saisie, setSaisie] = useState("");
  const [montre, setMontre] = useState(false);

  const cles = q.cles || [];
  const trouves = cles.filter((k) => saisie.toLowerCase().includes(k.toLowerCase()));

  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
          <div className="doux h-1.5 rounded-full" style={{ width: ((n + (montre ? 1 : 0)) / total) * 100 + "%", background: T.accent }} />
        </div>
        <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{total}</span>
        <button onClick={onQuitter} className="text-xs" style={{ color: T.ink2 }}>✕</button>
      </div>

      <p className="mb-1" style={{ fontSize: 16, lineHeight: 1.55, fontWeight: 500 }}>{q.enonce}</p>
      <p className="text-xs mb-4" style={{ color: T.ink2 }}>Question à rédiger</p>

      <textarea value={saisie} onChange={(e) => setSaisie(e.target.value)} rows={6} disabled={montre}
        placeholder="Rédige ta réponse, comme le jour de l'épreuve."
        className="w-full p-3 text-sm mb-3"
        style={{ borderRadius: 16, border: `1.5px solid ${montre ? T.line : T.accent}`, lineHeight: 1.6 }} />

      {!montre ? (
        <button onClick={() => setMontre(true)} disabled={!saisie.trim()}
          className="w-full py-3.5 text-sm doux"
          style={{ background: saisie.trim() ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
          Voir la réponse attendue
        </button>
      ) : (
        <>
          {cles.length > 0 && (
            <div className="mb-3">
              <p className="text-xs mb-2" style={{ color: T.ink2 }}>
                Mots-clés retrouvés dans ta réponse : {trouves.length} sur {cles.length}
              </p>
              <div className="flex flex-wrap gap-2">
                {cles.map((k) => {
                  const ok = trouves.includes(k);
                  return (
                    <span key={k} className="text-xs px-3 py-1.5"
                      style={{ borderRadius: 999, fontWeight: 600,
                        background: ok ? NIV[3].doux : NIV[1].doux, color: ok ? NIV[3].encre : NIV[1].encre }}>
                      {k}
                    </span>
                  );
                })}
              </div>
            </div>
          )}

          <div style={{ background: T.accentPale, borderRadius: 18, padding: "14px 16px" }}>
            <p className="text-xs mb-2" style={{ color: T.accent, fontWeight: 700 }}>Réponse attendue</p>
            <p style={{ fontFamily: lecture, fontSize: 16, lineHeight: 1.7, color: "#D6E4F1" }}>{q.reponse}</p>
            {q.explication && (
              <p className="mt-3 pt-3" style={{ borderTop: `1px solid ${T.line}`, fontFamily: lecture, fontSize: 15, lineHeight: 1.7, color: "#D6E4F1" }}>
                {q.explication}
              </p>
            )}
          </div>

          <p className="text-xs mt-4 mb-2" style={{ color: T.ink2 }}>
            Corrige-toi honnêtement : une réponse à moitié juste ne rapporte pas la moitié des points le jour J.
          </p>
          <div className="flex gap-3">
            {[["Manqué", 0, 1], ["Partiel", 0.5, 2], ["Réussi", 1, 3]].map(([l, v, k]) => (
              <button key={l} onClick={() => { onNoter(v); onSuivant(); }}
                className="flex-1 py-3 text-sm doux"
                style={{ background: NIV[k].c, color: NIV[k].txt, borderRadius: 999, fontWeight: 600 }}>{l}</button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ================== annales ================== */
function Annales({ annales, onAjouter, onSupprimer }) {
  const [source, setSource] = useState(""); const [note, setNote] = useState(""); const [remarque, setRemarque] = useState("");
  const ok = source.trim() && note !== "" && Number(note) >= 0 && Number(note) <= 100;
  return (
    <div>
      <p className="text-xs mb-3" style={{ color: T.ink2 }}>
        Note ici chaque dossier ou QI d'annale travaillé sur cet item. Le score entre dans le calcul de ta couleur.
      </p>
      <div className="flex flex-wrap gap-2 mb-4">
        <input value={source} onChange={(e) => setSource(e.target.value)} placeholder="Source (ex. EDN 2025, DP2)"
          className="px-3 py-2 rounded text-sm flex-1 min-w-40" style={{ border: `1px solid ${T.line}` }} />
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="/100" inputMode="numeric"
          className="px-3 py-2 rounded text-sm w-20" style={{ border: `1px solid ${T.line}`, fontFamily: mono }} />
        <button disabled={!ok} onClick={() => { onAjouter({ source: source.trim(), note: Number(note), remarque: remarque.trim(), date: auj() }); setSource(""); setNote(""); setRemarque(""); }}
          className="px-4 py-2 rounded text-sm" style={{ background: ok ? T.ink : T.line, color: T.card }}>Ajouter</button>
      </div>
      <input value={remarque} onChange={(e) => setRemarque(e.target.value)} placeholder="Ce qui m'a fait perdre des points"
        className="px-3 py-2 rounded text-sm w-full mb-4" style={{ border: `1px solid ${T.line}` }} />
      {annales.length === 0 ? (
        <p className="text-sm" style={{ color: T.ink2 }}>Aucune annale saisie pour cet item.</p>
      ) : (
        <ul>{annales.map((a) => (
          <li key={a.id} className="py-2 flex gap-3 text-sm items-start" style={{ borderBottom: `1px solid ${T.line}` }}>
            <span className="flex-1">
              {a.source}
              {a.remarque && <span className="block text-xs mt-1" style={{ color: T.ink2 }}>{a.remarque}</span>}
            </span>
            <span style={{ fontFamily: mono, color: couleur(a.note) }}>{a.note}</span>
            <button onClick={() => onSupprimer(a.id)} className="text-xs px-1" style={{ color: T.bas }}>×</button>
          </li>
        ))}</ul>
      )}
    </div>
  );
}

/* ================== progression d'un item ================== */
function Progression({ resultats }) {
  if (resultats.length < 2) return (
    <p className="text-sm" style={{ color: T.ink2 }}>
      La courbe démarre après deux tentatives. Fais quelques flashcards ou QCM sur cet item.
    </p>
  );
  const cum = [];
  let s = 0;
  resultats.forEach((r, i) => { s += r.valeur; cum.push(Math.round((s / (i + 1)) * 100)); });
  const L = 300, H = 80;
  const pts = cum.map((v, i) => `${(i / (cum.length - 1)) * L},${H - (v / 100) * H}`).join(" ");
  return (
    <div>
      <p className="text-xs mb-2" style={{ color: T.ink2 }}>
        Taux de réussite cumulé sur {resultats.length} tentatives
      </p>
      <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="90" preserveAspectRatio="none">
        <line x1="0" y1={H - 0.8 * H} x2={L} y2={H - 0.8 * H} stroke={T.line} strokeDasharray="3 3" />
        <polyline points={pts} fill="none" stroke={T.accent} strokeWidth="2" />
      </svg>
      <p className="text-sm mt-3">Actuellement : <span style={{ fontFamily: mono, color: couleur(cum[cum.length - 1]) }}>{cum[cum.length - 1]} %</span></p>
    </div>
  );
}

/* ================== mes erreurs ================== */
function Erreurs({ erreurs, items, onAjouter, onSupprimer, onOuvrir }) {
  const [texte, setTexte] = useState(""); const [lien, setLien] = useState("");
  return (
    <div>
      <h2 className="text-2xl mb-1" style={{ fontFamily: serif }}>Mes erreurs</h2>
      <p className="text-xs mb-4" style={{ color: T.ink2 }}>
        Ton brouillon. Tout ce que tu rates, en vrac, sans avoir à choisir un item. Tu pourras le rattacher plus tard.
      </p>
      <textarea value={texte} onChange={(e) => setTexte(e.target.value)} rows={3}
        placeholder="Ce que j'ai raté, et pourquoi." className="w-full p-3 rounded text-sm mb-2"
        style={{ border: `1px solid ${T.line}`, background: T.card }} />
      <div className="flex flex-wrap gap-2 mb-6">
        <select value={lien} onChange={(e) => setLien(e.target.value)} className="px-2 py-2 rounded text-sm flex-1 min-w-40"
          style={{ border: `1px solid ${T.line}`, background: T.card }}>
          <option value="">Rattacher à un item (facultatif)</option>
          {[...items].sort((a, b) => a.numero - b.numero).map((i) => (
            <option key={i.id} value={i.id}>{i.numero}. {i.titre.slice(0, 60)}</option>
          ))}
        </select>
        <button disabled={!texte.trim()} onClick={() => { onAjouter(texte.trim(), lien || null); setTexte(""); setLien(""); }}
          className="px-4 py-2 rounded text-sm" style={{ background: texte.trim() ? T.ink : T.line, color: T.card }}>Noter</button>
      </div>

      {erreurs.length === 0 ? (
        <p className="text-sm" style={{ color: T.ink2 }}>Rien encore. Cette page se remplit toute seule au fil des annales.</p>
      ) : (
        <ul>{erreurs.map((e) => {
          const it = items.find((i) => i.id === e.itemId);
          return (
            <li key={e.id} className="py-3 flex gap-3" style={{ borderBottom: `1px solid ${T.line}` }}>
              <span className="flex-1">
                <span className="text-sm" style={{ lineHeight: 1.6 }}>{e.texte}</span>
                <span className="block text-xs mt-1" style={{ color: T.ink2 }}>
                  {e.date}
                  {it && <> · <button onClick={() => onOuvrir(it.id)} style={{ color: T.accent }}>item {it.numero}</button></>}
                </span>
              </span>
              <button onClick={() => onSupprimer(e.id)} className="text-xs px-1" style={{ color: T.bas }}>×</button>
            </li>
          );
        })}</ul>
      )}
    </div>
  );
}

/* ================== session mixte ================== */
function Session({ paquet, onNoter, onFin, items }) {
  const [depart] = useState(Date.now());
  const [n, setN] = useState(0); const [face, setFace] = useState(false);
  const [choix, setChoix] = useState([]); const [corrige, setCorrige] = useState(false);
  const [score, setScore] = useState(0);
  const e = paquet[n];
  if (!e) return null;
  const it = items.find((i) => i.id === e.itemId);

  const suivant = (bon) => {
    onNoter(e.itemId, bon ? 1 : 0, e.genre, e.id);
    if (bon) setScore((s) => s + 1);
    if (n + 1 >= paquet.length) return onFin();
    setN(n + 1); setFace(false); setChoix([]); setCorrige(false);
  };

  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
          <div className="doux h-1.5 rounded-full" style={{ width: (n / paquet.length) * 100 + "%", background: T.accent }} />
        </div>
        <Chrono depart={depart} />
        <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{paquet.length} · {score}</span>
        <button onClick={onFin} className="text-xs" style={{ color: T.ink2 }}>✕</button>
      </div>
      <p className="text-xs mb-3" style={{ color: T.ink2 }}>{it ? `Item ${it.numero} — ${it.titre}` : ""}</p>

      {e.genre === "qcm" && e.type === "qroc" ? (
        <Qroc q={e} n={n} total={paquet.length}
          onNoter={(v) => { onNoter(e.itemId, v, "qroc", e.id); if (v >= 1) setScore((s) => s + 1); }}
          onSuivant={() => { if (n + 1 >= paquet.length) return onFin(); setN(n + 1); setFace(false); setChoix([]); setCorrige(false); }}
          onQuitter={onFin} />
      ) : e.genre === "carte" ? (
        <>
          <div onClick={() => setFace(true)} className="p-5 rounded mb-4 text-sm"
            style={{ background: T.card, border: `1px solid ${T.line}`, minHeight: 120, lineHeight: 1.7, cursor: "pointer" }}>
            <p>{e.recto}</p>
            {face ? <p className="mt-4 pt-4" style={{ borderTop: `1px solid ${T.line}` }}>{e.verso}</p>
              : <p className="text-xs mt-4" style={{ color: T.ink2 }}>Appuie pour retourner</p>}
          </div>
          {face && (
            <div className="flex gap-2">
              <button onClick={() => suivant(false)} className="flex-1 py-3 rounded text-sm" style={{ background: T.bas, color: "#fff" }}>Pas su</button>
              <button onClick={() => suivant(true)} className="flex-1 py-3 rounded text-sm" style={{ background: T.haut, color: "#fff" }}>Su</button>
            </div>
          )}
        </>
      ) : (
        <>
          <p className="text-sm mb-4">{e.enonce}</p>
          {(e.props || []).map((p, i) => (
            <Proposition key={i} p={p} i={i} choisi={choix.includes(i)} corrige={corrige}
              onClic={() => setChoix((l) => l.includes(i) ? l.filter((x) => x !== i) : [...l, i])} />
          ))}
          {corrige && (
            <Correction juste={(e.props || []).every((p, i) => p.vrai === choix.includes(i))} texte={e.explication} />
          )}
          <div className="mt-4">
            {!corrige ? (
              <button onClick={() => setCorrige(true)} className="px-4 py-3 rounded text-sm" style={{ background: T.ink, color: T.card }}>Valider</button>
            ) : (
              <button onClick={() => suivant((e.props || []).every((p, i) => p.vrai === choix.includes(i)))}
                className="px-4 py-3 rounded text-sm" style={{ background: T.ink, color: T.card }}>Suivant</button>
            )}
          </div>
        </>
      )}
    </div>
  );
}

const conteneur = document.getElementById("root");
conteneur.dataset.ok = "1";
ReactDOM.createRoot(conteneur).render(<Garde><App /></Garde>);
</script>
