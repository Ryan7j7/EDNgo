/* ================== My AI ================== */
function MyAI({ items, colleges, resultats }) {
  const [cle, setCle] = useState("");
  const [reglages, setReglages] = useState(false);
  const [messages, setMessages] = useState([]);
  const [saisie, setSaisie] = useState("");
  const [attente, setAttente] = useState(false);
  const [erreur, setErreur] = useState(null);
  const bas = useRef(null);

  useEffect(() => { setCle(litCle()); }, []);
  useEffect(() => { if (bas.current) bas.current.scrollIntoView({ behavior: "smooth" }); }, [messages, attente]);

  const enregistrerCle = (v) => { setCle(v); ecritCle(v); };

  const contexte = () => {
    const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;
    const faibles = items.map((i) => ({ i, n: resultats.filter((r) => r.itemId === i.id).length, t: taux(resultats.filter((r) => r.itemId === i.id)) }))
      .filter((x) => x.n >= 3 && x.t < 70).sort((a, b) => a.t - b.t).slice(0, 8)
      .map((x) => `${x.i.numero} ${x.i.titre} (${x.t} %)`);
    return `Tu es un enseignant de médecine française qui prépare un étudiant de DFASM aux EDN.
Réponds en français, de façon structurée et concise, au niveau attendu aux EDN.
Appuie-toi sur les référentiels des Collèges nationaux et les recommandations françaises en vigueur.
N'invente jamais un chiffre, un seuil ou une posologie : si tu n'es pas certain, dis-le explicitement.
${faibles.length ? "Items sur lesquels l'étudiant est en difficulté : " + faibles.join(" ; ") + "." : ""}`;
  };

  const envoyer = async () => {
    const texte = saisie.trim();
    if (!texte || attente) return;
    const suite = [...messages, { role: "user", content: texte }];
    setMessages(suite); setSaisie(""); setAttente(true); setErreur(null);
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": cle,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          system: contexte(),
          messages: suite.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message || "Réponse refusée");
      const txt = (d.content || []).filter((x) => x.type === "text").map((x) => x.text).join("\n");
      setMessages([...suite, { role: "assistant", content: txt || "(réponse vide)" }]);
    } catch (e) {
      setErreur(String(e.message || e));
      setMessages(suite);
    }
    setAttente(false);
  };

  if (!cle || reglages) {
    return (
      <div>
        <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>My AI</h2>
        <p className="text-xs mb-5" style={{ color: T.ink2, lineHeight: 1.7 }}>
          Pour qu'une IA réponde directement ici, il faut ta propre clé d'API Anthropic.
          Elle est enregistrée uniquement dans le stockage de ce navigateur : elle n'est pas dans le fichier
          du site, personne d'autre ne peut la lire, et je ne la vois pas.
        </p>
        <input value={cle} onChange={(e) => enregistrerCle(e.target.value)} type="password"
          placeholder="sk-ant-..." className="w-full px-3 py-2.5 text-sm mb-3"
          style={{ borderRadius: 14, border: `1px solid ${T.line}` }} />
        <div className="flex gap-2 mb-6">
          <button onClick={() => setReglages(false)} disabled={!cle}
            className="px-4 py-2.5 text-sm doux"
            style={{ background: cle ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
            Ouvrir la conversation
          </button>
          {cle && (
            <button onClick={() => { enregistrerCle(""); setMessages([]); }} className="px-4 py-2.5 text-sm"
              style={{ color: T.bas }}>Effacer la clé</button>
          )}
        </div>
        <div style={{ background: T.card, borderRadius: 20, padding: "18px 20px" }}>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Ce qu'il faut savoir</p>
          <p className="text-sm" style={{ color: T.ink2, lineHeight: 1.8 }}>
            Une clé s'obtient sur console.anthropic.com, avec un crédit prépayé.
            Chaque question coûte une fraction de centime, mais ce n'est pas gratuit.
            Sans clé, tu gardes l'onglet IA de chaque item, qui prépare le prompt à copier — même résultat,
            un aller-retour de plus.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        <h2 style={{ fontFamily: serif, fontSize: 24, flex: 1 }}>My AI</h2>
        {messages.length > 0 && (
          <button onClick={() => setMessages([])} className="text-xs px-3 py-1.5"
            style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>Effacer</button>
        )}
        <button onClick={() => setReglages(true)} className="text-xs px-3 py-1.5"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>Clé</button>
      </div>

      {messages.length === 0 && (
        <div className="mb-4" style={{ background: T.card, borderRadius: 20, padding: "18px 20px" }}>
          <p className="text-sm mb-3" style={{ color: T.ink2, lineHeight: 1.7 }}>
            Pose une question sur un item, demande un cas clinique, fais-toi expliquer un mécanisme.
            Tes items les plus faibles sont transmis en contexte.
          </p>
          {["Explique-moi la conduite devant une hémorragie du post-partum",
            "Fais-moi un cas clinique sur l'item 344",
            "Quelle différence entre PAG et RCIU ?"].map((q) => (
            <button key={q} onClick={() => setSaisie(q)} className="block text-left text-xs mb-2 px-3 py-2 doux"
              style={{ borderRadius: 12, background: T.accentPale, color: T.accent }}>{q}</button>
          ))}
        </div>
      )}

      <div className="mb-4">
        {messages.map((m, i) => (
          <div key={i} className="mb-3" style={{
            background: m.role === "user" ? T.accentPale : T.card,
            borderRadius: 18, padding: "14px 16px",
            marginLeft: m.role === "user" ? 40 : 0, marginRight: m.role === "user" ? 0 : 40,
          }}>
            {m.role === "assistant"
              ? <ResumeLu texte={m.content} />
              : <p className="text-sm" style={{ lineHeight: 1.6 }}>{m.content}</p>}
          </div>
        ))}
        {attente && <p className="text-sm mb-3" style={{ color: T.ink2 }}>Rédaction en cours…</p>}
        {erreur && (
          <p className="text-sm mb-3" style={{ background: NIV[1].doux, color: NIV[1].encre, borderRadius: 14, padding: "12px 14px" }}>
            {erreur}
          </p>
        )}
        <div ref={bas} />
      </div>

      <div className="flex gap-2 sticky bottom-3">
        <textarea value={saisie} onChange={(e) => setSaisie(e.target.value)} rows={2}
          onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) envoyer(); }}
          placeholder="Ta question…" className="flex-1 px-3 py-2.5 text-sm"
          style={{ borderRadius: 18, border: `1px solid ${T.line}`, lineHeight: 1.5 }} />
        <button onClick={envoyer} disabled={!saisie.trim() || attente}
          className="px-5 doux" style={{
            background: saisie.trim() && !attente ? T.accent : "#24384F", color: "#fff",
            borderRadius: 999, fontWeight: 700,
          }}>Envoyer</button>
      </div>
    </div>
  );
}

/* ================== résultats détaillés ================== */
function Resultats({ items, colleges, resultats, annales }) {
  const [periode, setPeriode] = useState(30);
  const depuis = new Date(Date.now() - periode * 86400000).toISOString().slice(0, 10);
  const R = resultats.filter((r) => r.date >= depuis);

  const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;
  const global = taux(R);

  const parType = ["qcm", "qroc", "flash", "annale"].map((t) => ({
    t, nom: { qcm: "QCM", qroc: "Questions rédigées", flash: "Flashcards", annale: "Annales" }[t],
    l: R.filter((r) => r.type === t),
  })).filter((x) => x.l.length);

  const jours = [...new Set(R.map((r) => r.date))].sort();
  const serie = (() => {
    let n = 0;
    for (let k = 0; k < 400; k++) {
      const d = new Date(Date.now() - k * 86400000).toISOString().slice(0, 10);
      if (resultats.some((r) => r.date === d)) n++;
      else if (k > 0) break;
    }
    return n;
  })();

  const parCollege = colleges.map((c) => {
    const ids = items.filter((i) => i.collegeId === c.id).map((i) => i.id);
    const l = R.filter((r) => ids.includes(r.itemId));
    return { c, l, taux: taux(l), testes: new Set(l.map((r) => r.itemId)).size, total: ids.length };
  }).filter((x) => x.l.length).sort((a, b) => a.taux - b.taux);

  const parItem = items.map((i) => {
    const l = resultats.filter((r) => r.itemId === i.id);
    return { i, n: l.length, taux: taux(l) };
  }).filter((x) => x.n >= 3);
  const noires = [...parItem].sort((a, b) => a.taux - b.taux).slice(0, 8);
  const acquis = [...parItem].filter((x) => x.taux >= 80).length;

  const L = 300, H = 70;
  const serieJours = [];
  for (let k = periode - 1; k >= 0; k--) {
    const d = new Date(Date.now() - k * 86400000).toISOString().slice(0, 10);
    const l = resultats.filter((r) => r.date === d);
    serieJours.push(l.length ? taux(l) : null);
  }
  const pts = serieJours.map((v, i) => v === null ? null : `${(i / (serieJours.length - 1)) * L},${H - (v / 100) * H}`)
    .filter(Boolean).join(" ");

  return (
    <div>
      <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>Résultats</h2>
      <p className="text-xs mb-4" style={{ color: T.ink2 }}>Tout est calculé sur tes réponses, rien n'est déclaratif.</p>

      <div className="flex gap-2 mb-5">
        {[7, 30, 90, 3650].map((p) => (
          <button key={p} onClick={() => setPeriode(p)} className="px-4 py-2 text-xs doux"
            style={{
              borderRadius: 999, fontWeight: 600,
              background: periode === p ? T.accent : "transparent", color: periode === p ? "#fff" : T.ink2,
              border: `1px solid ${periode === p ? T.accent : T.line}`,
            }}>
            {p === 3650 ? "Tout" : p + " j"}
          </button>
        ))}
      </div>

      {R.length === 0 ? (
        <p className="text-sm py-8" style={{ color: T.ink2 }}>
          Aucune réponse sur cette période. Lance une session depuis l'accueil et reviens ici.
        </p>
      ) : (
        <>
          <div className="ombre mb-4" style={{ background: T.card, borderRadius: 24, padding: "20px 22px" }}>
            <div className="flex items-end gap-6 mb-4">
              <div>
                <p className="text-xs uppercase" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Réussite globale</p>
                <p style={{ fontFamily: serif, fontSize: 38, lineHeight: 1.05, color: couleur(global) }}>{global} %</p>
              </div>
              <div className="text-xs" style={{ color: T.ink2, lineHeight: 1.9 }}>
                <div><b style={{ color: T.ink }}>{R.length}</b> réponses</div>
                <div><b style={{ color: T.ink }}>{jours.length}</b> jours travaillés</div>
                <div><b style={{ color: T.ink }}>{serie}</b> jours d'affilée</div>
              </div>
            </div>
            {pts && (
              <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="76" preserveAspectRatio="none">
                <line x1="0" y1={H * 0.2} x2={L} y2={H * 0.2} stroke={T.line} strokeDasharray="3 3" />
                <polyline points={pts} fill="none" stroke={T.accent} strokeWidth="2" strokeLinejoin="round" />
              </svg>
            )}
          </div>

          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Par type d'exercice</p>
          <div className="mb-5">
            {parType.map((x) => (
              <div key={x.t} className="flex items-center gap-3 mb-2">
                <span className="text-xs" style={{ width: 130 }}>{x.nom}</span>
                <div className="flex-1 h-2 rounded-full" style={{ background: "#1E3149" }}>
                  <div className="doux h-2 rounded-full" style={{ width: taux(x.l) + "%", background: couleur(taux(x.l)) }} />
                </div>
                <span className="text-xs" style={{ width: 68, textAlign: "right", color: T.ink2 }}>
                  {taux(x.l)} % · {x.l.length}
                </span>
              </div>
            ))}
          </div>

          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Par collège, du plus faible au plus solide</p>
          <div className="mb-5">
            {parCollege.map(({ c, l, taux: t, testes, total }) => {
              const p = pal(c.nom);
              return (
                <div key={c.id} className="flex items-center gap-3 mb-2">
                  <span className="text-xs" style={{ width: 110, color: p.fg, fontWeight: 600 }}>{c.nom}</span>
                  <div className="flex-1 h-2 rounded-full" style={{ background: "#1E3149" }}>
                    <div className="doux h-2 rounded-full" style={{ width: t + "%", background: couleur(t) }} />
                  </div>
                  <span className="text-xs" style={{ width: 92, textAlign: "right", color: T.ink2 }}>
                    {t} % · {testes}/{total}
                  </span>
                </div>
              );
            })}
          </div>

          {noires.length > 0 && (
            <>
              <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
                Tes bêtes noires — au moins trois tentatives
              </p>
              <div className="mb-5">
                {noires.map(({ i, n, taux: t }) => (
                  <div key={i.id} className="flex items-center gap-3 py-2" style={{ borderBottom: `1px solid ${T.line}` }}>
                    <span className="shrink-0 rounded-full" style={{ width: 9, height: 9, background: couleur(t) }} />
                    <span className="flex-1 text-xs" style={{ lineHeight: 1.4 }}>
                      <span style={{ color: T.ink2 }}>{i.numero}. </span>{i.titre}
                    </span>
                    <span className="text-xs shrink-0" style={{ color: couleur(t), fontWeight: 700 }}>{t} %</span>
                    <span className="text-xs shrink-0" style={{ color: T.ink2 }}>{n} essais</span>
                  </div>
                ))}
              </div>
            </>
          )}

          <p className="text-xs" style={{ color: T.ink2, lineHeight: 1.8 }}>
            {acquis} item(s) au-dessus de 80 % avec au moins trois tentatives.
            {annales.length > 0 && ` ${annales.length} annale(s) saisie(s).`}
          </p>
        </>
      )}
    </div>
  );
}

class Garde extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ padding: 24, color: "#E2ECF6", fontFamily: "inherit", lineHeight: 1.7 }}>
        <p style={{ color: "#E4685D", fontWeight: 700, marginBottom: 8 }}>Cet écran n'a pas pu s'afficher.</p>
        <p style={{ fontSize: 13, marginBottom: 12 }}>{String(this.state.err && this.state.err.message || this.state.err)}</p>
        <button onClick={() => this.setState({ err: null })}
          style={{ background: "#2C86C6", color: "#fff", borderRadius: 999, padding: "10px 18px", fontWeight: 600 }}>
          Revenir
        </button>
        <p style={{ fontSize: 12, color: "#8CA3BB", marginTop: 14 }}>
          Tes données sont intactes. Envoie ce message si le problème revient.
        </p>
      </div>
    );
  }
}

  const [erreurs, setErreurs] = useState([]);
  const [cours, setCours] = useState(COURS_INIT);
  const [fiches, setFiches] = useState([]);
  const [taches, setTaches] = useState([]);
  const [dossiers, setDossiers] = useState([]);
  const [dossierActif, setDossierActif] = useState(null);
  const [pret, setPret] = useState(false);
  const [alerte, setAlerte] = useState(null);

  const [vue, setVue] = useState("accueil"); // accueil | grille | colleges | erreurs

  const [itemId, setItemId] = useState(null);
  const [session, setSession] = useState(null);
  const [q, setQ] = useState("");

    (async () => {

        if (d.colleges?.length) setColleges(d.colleges);
        if (d.items?.length) setItems(d.items);

        setFiches(d.fiches || []);
        setTaches(d.taches || []);

          const v = JSON.parse((await window.storage.get(KEY_ANCIEN)).value);
          if (v.colleges?.length) setColleges(v.colleges);
          if (v.items?.length) setItems(v.items.map((i) => ({
            id: i.id, collegeId: i.collegeId, numero: i.numero, titre: i.titre,
            resume: [i.resume, i.fiche].filter(Boolean).join("\n\n"), tours: [], niveau: 0,
          })));
          if (v.qcms) setQcms(v.qcms);
        } catch { /* première ouverture */ }
      }
      setPret(true);
    })();
  }, []);

  /* complète le catalogue si des items officiels manquent dans les données sauvegardées */
  useEffect(() => {
    if (!pret) return;
    const parNom = {}; colleges.forEach((c) => (parNom[c.nom] = c));
    const colsAjoutes = [];
    Object.keys(CATALOGUE).forEach((nom) => {
      if (!parNom[nom]) { const c = { id: uid(), nom, resume: "" }; colsAjoutes.push(c); parNom[nom] = c; }
    });
    const itemsAjoutes = [];
    Object.entries(CATALOGUE).forEach(([nom, liste]) => {
      const cid = parNom[nom].id;
      liste.forEach(([numero, titre]) => {
        if (!items.some((i) => i.collegeId === cid && i.numero === numero)) {
          itemsAjoutes.push({ id: uid(), collegeId: cid, numero, titre, resume: "", tours: [], niveau: 0 });
        }
      });
    });
    if (colsAjoutes.length) setColleges((l) => [...l, ...colsAjoutes]);
    if (itemsAjoutes.length) {
      setItems((l) => [...l, ...itemsAjoutes]);
      setAlerte(`${itemsAjoutes.length} item(s) manquant(s) ajouté(s) au programme.`);
    }
  }, [pret]);

  useEffect(() => {
    if (!pret) return;
    if (premier.current) { premier.current = false; return; }
    const t = setTimeout(async () => {
      try {
        await window.storage.set(KEY, JSON.stringify({ colleges, items, cartes, qcms, annales, resultats, erreurs, cours, fiches, taches, dossiers }));
        setAlerte(null);
      } catch { setAlerte("Sauvegarde impossible. Exporte tes données."); }
    }, 500);
    return () => clearTimeout(t);
  }, [colleges, items, cartes, qcms, annales, resultats, erreurs, cours, fiches, taches, dossiers, pret]);

  const noter = (itemId, valeur, type, exoId) =>
    setResultats((l) => [...l, { id: uid(), itemId, valeur, type, exoId: exoId || null, date: auj(), t: Date.now() }]);

  const definirComp = (id, v, date) =>
    setItems((l) => l.map((i) => i.id === id
      ? { ...i, comp: v, dateComp: v === 0 ? null : (date !== undefined ? date : auj()) } : i));

  const definirNiveau = (id, v) =>
    v === -1
      ? setItems((l) => l.map((i) => i.id === id ? { ...i, tours: (i.tours || []).slice(0, -1) } : i))
      : setItems((l) => l.map((i) => i.id === id ? { ...i, niveau: v, dateNiveau: auj() } : i));

  /* cocher une tâche liée à un item compte automatiquement un passage */
  const majTaches = (nouvelles) => {
    const avant = {};
    taches.forEach((t) => (avant[t.id] = !!t.fait));
    nouvelles.forEach((t) => {
      if (t.type === "item" && t.itemId && t.fait && avant[t.id] === false) {
        setItems((l) => l.map((i) => i.id === t.itemId
          ? { ...i, tours: [...(i.tours || []), auj()], dateComp: auj(), comp: i.comp || 3 } : i));
      }
    });
    setTaches(nouvelles);
  };

  const marquerTour = (id) =>
    setItems((l) => l.map((i) => i.id === id ? { ...i, tours: [...(i.tours || []), auj()] } : i));
  const annulerTour = (id) =>
    setItems((l) => l.map((i) => i.id === id ? { ...i, tours: (i.tours || []).slice(0, -1) } : i));

  const item = items.find((i) => i.id === itemId) || null;
  const college = colleges.find((c) => c.id === collegeId) || null;

  const scores = useMemo(() => {
    const m = {};
    items.forEach((i) => (m[i.id] = scoreItem(i.id, resultats)));
    return m;
  }, [items, resultats]);

  const testes = items.filter((i) => scores[i.id] !== null);
  const solides = testes.filter((i) => scores[i.id] >= 80);

  const resultats7 = useMemo(() => {
    const jours = [];
    for (let d = 13; d >= 0; d--) {
      const date = new Date(Date.now() - d * 86400000).toISOString().slice(0, 10);
      const r = resultats.filter((x) => x.date === date);
      jours.push({ date, n: r.length, taux: r.length ? Math.round(r.reduce((s, x) => s + x.valeur, 0) / r.length * 100) : null });
    }
    return jours;
  }, [resultats]);

  const recherche = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return null;
    return items.filter((i) => i.titre.toLowerCase().includes(s) || String(i.numero).startsWith(s)).slice(0, 50);
  }, [q, items]);

  const exos = (id) => [
    ...cartes.filter((c) => c.itemId === id).map((c) => ({ ...c, genre: "carte" })),
    ...qcms.filter((c) => c.itemId === id).map((c) => ({ ...c, genre: "qcm" })),
  ];

  const lancerSessionCollege = (cid) => {
    const paquet = items.filter((i) => i.collegeId === cid)
      .flatMap((i) => exos(i.id)).sort(() => Math.random() - 0.5).slice(0, 20);
    if (!paquet.length) return setAlerte("Aucun QCM ni flashcard sur ce collège pour l'instant.");
    setSession(paquet);
  };

  const tousExos = useMemo(() => [
    ...cartes.map((c) => ({ ...c, genre: "carte" })),
    ...qcms.map((c) => ({ ...c, genre: "qcm" })),
  ], [cartes, qcms]);

  const revision = useMemo(() => aReviser(tousExos, resultats), [tousExos, resultats]);

  const rattrapage = useMemo(() => {
    const p = construireRattrapage(items, colleges, cartes, qcms, resultats, 30);
    const cols = new Set(p.map((e) => items.find((i) => i.id === e.itemId)?.collegeId).filter(Boolean));
    return { dispo: rattrapageDu() && p.length >= 5, n: p.length, cols: cols.size, fait: dernierRattrapage() === auj() };
  }, [items, colleges, cartes, qcms, resultats]);

  const lancerRattrapage = () => {
    const p = construireRattrapage(items, colleges, cartes, qcms, resultats, 30);
    if (p.length < 5) return setAlerte("Pas encore assez d'exercices pour bâtir un rattrapage.");
    noterRattrapage();
    setSession(p);
  };

  const lancerRevision = () => {
    const p = [...revision.du, ...revision.neufs.slice(0, Math.max(0, 20 - revision.du.length))].slice(0, 20);
    if (!p.length) return setAlerte("Rien à réviser aujourd'hui. Reviens demain, ou lance une séance libre.");
    setSession(p);
  };

  const lancerSessionFaible = () => {
    const cibles = items
      .filter((i) => exos(i.id).length)
      .sort((a, b) => (scores[a.id] ?? -1) - (scores[b.id] ?? -1))
      .slice(0, 8);
    const paquet = cibles.flatMap((i) => exos(i.id)).sort(() => Math.random() - 0.5).slice(0, 20);
    if (!paquet.length) return setAlerte("Écris d'abord quelques flashcards ou QCM sur un item.");
    setSession(paquet);
  };

  const exporter = () => {
    const b = new Blob([JSON.stringify({ colleges, items, cartes, qcms, annales, resultats, erreurs, cours, fiches, taches, dossiers }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = `edn-go-${VERSION}-${auj()}.json`; a.click();
    URL.revokeObjectURL(a.href);
  };
  const importer = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        /* sauvegarde complète : elle contient des items ou des collèges */
        if (!Array.isArray(d) && (Array.isArray(d.items) || Array.isArray(d.colleges))) {
          if (d.colleges?.length) setColleges(d.colleges);
          if (d.items?.length) setItems(d.items);
          setCartes(d.cartes || []); setQcms(d.qcms || []);
          setAnnales(d.annales || []); setResultats(d.resultats || []);
          setErreurs(d.erreurs || []);
          if (d.cours?.length) setCours(d.cours);
          if (d.fiches) setFiches(d.fiches);
          if (d.taches) setTaches(d.taches);
          if (d.dossiers) setDossiers(d.dossiers);
          setAlerte(`Sauvegarde restaurée : ${(d.items || []).length} items, ${(d.qcms || []).length} QCM, `
            + `${(d.cartes || []).length} flashcards, ${(d.fiches || []).length} fiche(s). Les PDF ne sont pas dans l'export.`);
          return;
        }
        const lot = Array.isArray(d) ? { resumes: d } : (d.resumes || d.flashcards || d.qcms) ? d : null;
        if (lot) {
          const parNum = {};
          items.forEach((i) => (parNum[i.numero] = i.id));
          let nr = 0, nf = 0, nq = 0, doublons = 0;
          const orphelins = new Set();

          if (lot.resumes) setItems((l) => l.map((i) => {
            const t = lot.resumes.find((x) => Number(x.numero) === i.numero);
            if (t && t.resume) { nr++; return { ...i, resume: t.resume }; }
            return i;
          }));

          if (lot.flashcards) {
            const nv = [];
            lot.flashcards.forEach((c) => {
              const id = parNum[Number(c.numero)];
              if (!id) return orphelins.add(c.numero);
              const existe = cartes.some((x) => x.itemId === id && x.recto === c.recto)
                || nv.some((x) => x.itemId === id && x.recto === c.recto);
              if (existe) { doublons++; return; }
              nv.push({ id: uid(), itemId: id, recto: c.recto, verso: c.verso }); nf++;
            });
            if (nv.length) setCartes((l) => [...l, ...nv]);
          }

          if (lot.qcms) {
            const nv = [];
            lot.qcms.forEach((c) => {
              const id = parNum[Number(c.numero)];
              if (!id) return orphelins.add(c.numero);
              const existe = qcms.some((x) => x.itemId === id && x.enonce === c.enonce)
                || nv.some((x) => x.itemId === id && x.enonce === c.enonce);
              if (existe) { doublons++; return; }
              nv.push(c.type === "qroc"
                ? { id: uid(), itemId: id, type: "qroc", enonce: c.enonce, reponse: c.reponse, cles: c.cles || [], explication: c.explication || "" }
                : { id: uid(), itemId: id, enonce: c.enonce, props: c.props, explication: c.explication || "" });
              nq++;
            });
            if (nv.length) setQcms((l) => [...l, ...nv]);
          }

          let msg = `Importé : ${nr} résumé(s), ${nf} flashcard(s), ${nq} QCM.`;
          if (doublons) msg += ` ${doublons} doublon(s) ignoré(s).`;
          if (orphelins.size) msg += ` Items introuvables : ${[...orphelins].join(", ")}.`;
          setAlerte(msg);
          return;
        }
        setAlerte("Fichier non reconnu : ni sauvegarde, ni lot de contenu.");
      } catch { setAlerte("Fichier illisible."); }
    };
    r.readAsText(f); e.target.value = "";
  };

  if (!pret) return <div className="flex items-center justify-center h-screen" style={{ color: T.ink2 }}>Ouverture…</div>;

  const retour = () => {
    if (session) return setSession(null);
    if (item) setItemId(null);
    else if (college) setCollegeId(null);
    else if (vue !== "accueil") setVue("accueil");
  };

  return (
    <div className="min-h-screen w-full doux" style={{
      background: T.paper, color: T.ink, "--acc": T.accent,
    }}>
      <style>{`
        *:focus-visible { outline: 2px solid ${T.accent}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        button { touch-action: manipulation; }
        textarea, input { font-family: inherit; }
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2E4863; border-radius: 99px; border: 2px solid ${T.paper}; }
        ::-webkit-scrollbar-thumb:hover { background: #3E5C7C; }
        * { scrollbar-width: thin; scrollbar-color: #2E4863 transparent; }
        .doux { transition: background 180ms ease, color 180ms ease, width 340ms ease, box-shadow 180ms ease; }
        @keyframes entree { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .vue { animation: entree 240ms cubic-bezier(0.22, 1, 0.36, 1); }
        button, .doux { -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.97); }
        .relief { transition: transform 180ms cubic-bezier(0.22,1,0.36,1), box-shadow 180ms ease, background 180ms ease, filter 180ms ease; }
        @media (hover: hover) {
          .relief:hover { transform: scale(1.055); box-shadow: 0 8px 22px rgba(0,0,0,0.34); filter: brightness(1.14); z-index: 3; }
          .releve:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.32); filter: brightness(1.08); }
        }
        .relief:active, .releve:active { transform: scale(0.97); }
        * { -webkit-overflow-scrolling: touch; }
        h2, h3, h4 { font-weight: 600; letter-spacing: -0.015em; }
        .carte { border-radius: 22px; }
        .ombre { box-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.22); }
      `}</style>

      <header className="sticky top-0 z-30 doux" style={{
        background: T.paper, borderBottom: `1px solid ${T.line}` }}>
      <div className="px-4 pt-3 pb-2 flex items-center gap-3">
        {(session || college || item || vue !== "accueil") ? (
          <button onClick={retour} aria-label="Revenir en arrière"
            className="flex items-center justify-center doux shrink-0"
            style={{ width: 38, height: 38, borderRadius: 999, background: T.card, border: `1px solid ${T.line}`, color: T.accent, fontSize: 19 }}>
            ←
          </button>
        ) : (
          <span style={{ fontFamily: serif, fontSize: 19, fontWeight: 700, letterSpacing: "-0.01em" }}>
            EDN <span style={{ color: T.accent }}>Go</span>
            <span style={{ fontSize: 11, fontWeight: 600, color: T.ink2, marginLeft: 7 }}>{VERSION}</span>
          </span>
        )}
        {!session && (
          <button onClick={() => setMenu(!menu)} className="flex items-center gap-2 px-4 py-2 doux"
            style={{ borderRadius: 999, background: menu ? T.accent : T.card, border: `1px solid ${menu ? T.accent : T.line}` }}>
            <span style={{ fontSize: 14, color: menu ? "#0E1A29" : T.accent }}>
              {(ONGLETS.find(([v]) => v === vue) || ["", "", "☰"])[2]}
            </span>
            <span className="text-sm" style={{ fontWeight: 600, color: menu ? "#0E1A29" : T.ink }}>
              {(ONGLETS.find(([v]) => v === vue) || ["", "Menu"])[1]}
            </span>
            <span style={{ fontSize: 9, color: menu ? "#0E1A29" : T.ink2 }}>{menu ? "▲" : "▼"}</span>
          </button>
        )}
        <div className="flex-1" />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Item ou n°…"
          className="px-3 py-2 text-sm w-28 sm:w-52"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, background: T.card }} />
      </div>

      </header>

      {menu && !session && (
        <div onClick={() => setMenu(false)}
          style={{ position: "fixed", inset: 0, zIndex: 40, background: "rgba(6,13,22,0.74)", backdropFilter: "blur(7px)" }}>
          <div onClick={(e) => e.stopPropagation()} className="vue"
            style={{ maxWidth: 580, margin: "76px auto 0", padding: "0 16px" }}>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              {ONGLETS.map(([v, l, ic, sous, acc]) => {
                const on = vue === v && !college && !item;
                return (
                  <button key={v} onClick={() => { setVue(v); setCollegeId(null); setItemId(null); setQ(""); setMenu(false); }}
                    className="text-left releve"
                    style={{
                      background: on ? acc : melange(acc, "#17293E", 0.13),
                      borderRadius: 20, padding: "16px 17px",
                      border: `1px solid ${on ? acc : melange(acc, "#24384F", 0.3)}`,
                    }}>
                    <span style={{ fontSize: 20, display: "block", marginBottom: 5, color: on ? "#0E1A29" : acc }}>{ic}</span>
                    <span className="block text-sm" style={{ fontWeight: 700, color: on ? "#0E1A29" : T.ink }}>{l}</span>
                    <span className="block text-xs mt-0.5" style={{ color: on ? "rgba(14,26,41,0.72)" : T.ink2 }}>{sous}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {alerte && (
        <button onClick={() => setAlerte(null)} className="w-full px-4 py-2 text-sm text-left"
          style={{ background: "#33261A", color: T.ink }}>{alerte} ✕</button>
      )}

      <div className="flex">
      {!session && !dossierActif && (
        <nav className="hidden lg:flex flex-col gap-1 shrink-0 py-5 px-2 sticky"
          style={{ width: 92, top: 64, height: "calc(100vh - 64px)", borderRight: `1px solid ${T.line}`, overflowY: "auto" }}>
          {ONGLETS.map(([v, l, ic, sous, acc]) => {
            const on = vue === v && !college && !item;
            return (
              <button key={v} onClick={() => { setVue(v); setCollegeId(null); setItemId(null); setQ(""); setMenu(false); }}
                title={l} className="relief flex flex-col items-center justify-center gap-1.5"
                style={{
                  padding: "13px 3px", borderRadius: 18,
                  background: on ? acc : melange(acc, "#17293E", 0.10),
                  color: on ? "#0E1A29" : melange(acc, "#B9CBDD", 0.55),
                  border: `1px solid ${on ? acc : "transparent"}`,
                }}>
                <span style={{ fontSize: 21 }}>{ic}</span>
                <span style={{ fontSize: 10.5, fontWeight: on ? 800 : 600, lineHeight: 1.15, textAlign: "center" }}>{l}</span>
              </button>
            );
          })}
        </nav>
      )}

      <main key={`${vue}-${collegeId || ""}-${itemId || ""}-${session ? "s" : ""}`} className={"vue py-5 flex-1 min-w-0 mx-auto " + (vue === "grille" && !college && !item && !session ? "px-2 w-full" : "px-4 max-w-3xl")}>
        {dossierActif ? (
          <SessionDossier dossier={dossierActif} onNoter={(v) => noter(null, v, "dossier")}
            onFin={() => setDossierActif(null)} />
        ) : session ? (
          <Session paquet={session} onNoter={noter} onFin={() => setSession(null)} items={items} />
        ) : recherche ? (
          <ListeItems items={recherche} scores={scores} colleges={colleges}
            onOuvrir={(id) => { const it = items.find((x) => x.id === id); setCollegeId(it.collegeId); setItemId(id); setQ(""); }} />
        ) : item ? (
          <VueItem
            item={item} college={college} score={scores[item.id]}
            cartes={cartes.filter((c) => c.itemId === item.id)}
            qcms={qcms.filter((c) => c.itemId === item.id)}
            annales={annales.filter((a) => a.itemId === item.id)}
            resultats={resultats.filter((r) => r.itemId === item.id)}
            onResume={(v) => setItems((l) => l.map((i) => i.id === item.id ? { ...i, resume: v } : i))}
            onAjoutCarte={(c) => setCartes((l) => [...l, { ...c, id: uid(), itemId: item.id }])}
            onSupprCarte={(id) => setCartes((l) => l.filter((x) => x.id !== id))}
            onAjoutQcm={(c) => setQcms((l) => [...l, { ...c, id: uid(), itemId: item.id }])}
            onSupprQcm={(id) => setQcms((l) => l.filter((x) => x.id !== id))}
            onAjoutAnnale={(a) => { setAnnales((l) => [...l, { ...a, id: uid(), itemId: item.id }]); noter(item.id, a.note / 100, "annale"); }}
            onSupprAnnale={(id) => setAnnales((l) => l.filter((x) => x.id !== id))}
            onNoter={(v, t) => noter(item.id, v, t)}
            onSession={(p) => setSession(p)}
            onTour={() => marquerTour(item.id)}
            onAnnulerTour={() => annulerTour(item.id)}
            onNiveau={(v) => definirNiveau(item.id, v)}
            fiches={fiches} onFiches={setFiches}
          />
        ) : college ? (
          <VueCollege college={college} items={items.filter((i) => i.collegeId === college.id)}
            scores={scores} cartes={cartes} qcms={qcms}
            onResume={(v) => setColleges((l) => l.map((c) => c.id === college.id ? { ...c, resume: v } : c))}
            onOuvrir={setItemId} />
        ) : vue === "grille" ? (
          <Grille colleges={colleges} items={items} scores={scores} resultats={resultats} cartes={cartes} qcms={qcms}
            taches={taches} onComp={definirComp}
            onOuvrir={(id) => { const it = items.find((x) => x.id === id); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : vue === "colleges" ? (
          <VueColleges colleges={colleges} items={items} scores={scores} onOuvrir={setCollegeId} />
        ) : vue === "cours" ? (
          <Cours cours={cours} onMaj={setCours} />
        ) : vue === "todo" ? (
          <Planning taches={taches} onMaj={majTaches} items={items} colleges={colleges}
            onOuvrirItem={(id) => { const it = items.find((x) => x.id === id); setVue("colleges"); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : vue === "exercice" ? (
          <Exercice items={items} colleges={colleges} cartes={cartes} qcms={qcms} resultats={resultats}
            onRattrapage={lancerRattrapage}
            onLancer={(p) => p.length ? setSession(p) : setAlerte("Aucun exercice ne correspond à ce choix.")} />
        ) : vue === "ai" ? (
          <MyAI items={items} colleges={colleges} resultats={resultats} />
        ) : vue === "dossiers" ? (
          <Dossiers dossiers={dossiers} onMaj={setDossiers} items={items} colleges={colleges}
            onLancer={(d) => setDossierActif(d)} />
        ) : vue === "cards" ? (
          <MyCards fiches={fiches} onMaj={setFiches} items={items} colleges={colleges}
            onOuvrirItem={(id) => { const it = items.find((x) => x.id === id); setVue("colleges"); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : vue === "resultats" ? (
          <Resultats items={items} colleges={colleges} resultats={resultats} annales={annales} />
        ) : vue === "erreurs" ? (
          <Erreurs erreurs={erreurs} items={items}
            onAjouter={(texte, itemId) => setErreurs((l) => [{ id: uid(), texte, itemId, date: auj() }, ...l])}
            onSupprimer={(id) => setErreurs((l) => l.filter((x) => x.id !== id))}
            onOuvrir={(id) => { const it = items.find((x) => x.id === id); setCollegeId(it.collegeId); setItemId(id); }} />
        ) : (
          <Accueil items={items} colleges={colleges} cartes={cartes} qcms={qcms}
            taches={taches} onTaches={majTaches} onPlanning={() => setVue("todo")}
            onOuvrirItem={(id) => { const it = items.find((x) => x.id === id); setVue("colleges"); setCollegeId(it.collegeId); setItemId(id); }}
            testes={testes} solides={solides} jours={resultats7}
            nbExos={cartes.length + qcms.length} nbAnnales={annales.length}
            onSession={lancerSessionFaible} onSessionCollege={lancerSessionCollege}
            revision={revision} onRevision={lancerRevision}
            rattrapage={rattrapage} onRattrapage={lancerRattrapage}
            onGrille={() => setVue("grille")} onExporter={exporter} onImporter={importer} />
        )}
      </main>
      </div>

    </div>
  );
}

function CourbeCouverture({ semaines, total }) {
  const L = 300, H = 90;
  const max = Math.max(total, 1);
  const pts = semaines.map((s, i) => `${(i / (semaines.length - 1)) * L},${H - (s.n / max) * H}`).join(" ");
  const aire = `0,${H} ${pts} ${L},${H}`;
  const fin = semaines[semaines.length - 1].n;
  return (
    <div className="p-3 rounded" style={{ background: T.card, border: `1px solid ${T.line}` }}>
      <p className="text-xs mb-2" style={{ color: T.ink2 }}>Items travaillés, 12 dernières semaines</p>
      <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="100" preserveAspectRatio="none">
        <polygon points={aire} fill="#15304A" />
        <polyline points={pts} fill="none" stroke={T.accent} strokeWidth="2" />
      </svg>
      <p className="text-xs mt-1" style={{ fontFamily: mono, color: T.ink2 }}>{fin} / {total}</p>
    </div>
  );
}

/* ================== grille type tableur ================== */
function Courbe({ jours }) {
  const pts = jours.filter((j) => j.taux !== null);
  if (pts.length < 2) return (
    <p className="text-xs p-3 rounded" style={{ background: T.card, border: `1px solid ${T.line}`, color: T.ink2 }}>
      La courbe de réussite apparaît dès que tu auras répondu à des questions sur deux jours différents.
    </p>
  );
  const L = 300, H = 70;
  const d = jours.map((j, i) => j.taux === null ? null : `${(i / (jours.length - 1)) * L},${H - (j.taux / 100) * H}`)
    .filter(Boolean).join(" ");
  return (
    <div className="p-3 rounded" style={{ background: T.card, border: `1px solid ${T.line}` }}>
      <p className="text-xs mb-2" style={{ color: T.ink2 }}>Taux de réussite, 14 derniers jours</p>
      <svg viewBox={`0 0 ${L} ${H}`} width="100%" height="80" preserveAspectRatio="none">
        <line x1="0" y1={H - 0.8 * H} x2={L} y2={H - 0.8 * H} stroke={T.line} strokeDasharray="3 3" />
        <polyline points={d} fill="none" stroke={T.accent} strokeWidth="2" />
      </svg>
    </div>
  );
}

const RUBRIQUES = [
  { k: ["définition", "definition", "généralités"], c: "#54A9EA" },
  { k: ["épidémio", "epidemio", "facteur", "terrain"], c: "#EE9BBF" },
  { k: ["clinique", "signe", "interrogatoire", "symptô"], c: "#E4685D" },
  { k: ["diagnostic", "paraclinique", "imagerie", "biolog", "examen"], c: "#EAAE43" },
  { k: ["traitement", "prise en charge", "thérapeut", "conduite"], c: "#35B48C" },
  { k: ["surveillance", "suivi", "mesure", "prévention", "complication"], c: "#B9A3EE" },
  { k: ["piège", "piege", "retenir", "erreur", "annale"], c: "#EEB061" },
];
function couleurRubrique(t) {
  const b = (t || "").toLowerCase();
  const r = RUBRIQUES.find((x) => x.k.some((m) => b.includes(m)));
  return r ? r.c : T.accent;
}

function ResumeLu({ texte }) {
  if (!texte.trim()) return null;
  const lignes = texte.split("\n");
  const out = []; let buffer = [];
  const vider = (i) => {
    if (!buffer.length) return;
    out.push(<p key={"p" + i} style={{ fontFamily: lecture, fontSize: 17, lineHeight: 1.8, margin: "0 0 15px", color: "#D6E4F1" }}>{buffer.join(" ")}</p>);
    buffer = [];
  };
  lignes.forEach((l, i) => {
    const t = l.trim();
    if (!t) { vider(i); return; }
    if (t.startsWith("[[fig:")) {
      vider(i);
      const corps = t.slice(6).replace(/\]\]$/, "");
      const [nom, leg] = corps.split("|");
      out.push(<Figure key={"f" + i} nom={nom.trim()} legende={(leg || "").trim()} />);
      return;
    }
    if (t.startsWith("![")) {
      vider(i);
      const m = t.match(/^!\[(.*?)\]\((.*?)\)$/);
      if (m) out.push(
        <figure key={"i" + i} style={{ margin: "18px 0 22px" }}>
          <img src={m[2]} alt={m[1]} style={{ width: "100%", borderRadius: 16, border: `1px solid ${T.line}` }} />
          <figcaption className="text-xs mt-2" style={{ color: T.ink2, lineHeight: 1.6 }}>{m[1]}</figcaption>
        </figure>
      );
      return;
    }
    if (t.startsWith("## ")) {
      vider(i);
      const titre = t.slice(3);
      const c = couleurRubrique(titre);
      out.push(
        <h4 key={"h" + i} style={{
          color: c, fontSize: 11.5, letterSpacing: "0.1em", textTransform: "uppercase", fontFamily: serif,
          fontWeight: 700, margin: "26px 0 10px", display: "inline-block",
          background: c + "14", padding: "5px 12px", borderRadius: 999,
        }}>{titre}</h4>
      );
    } else if (t.startsWith("- ")) {
      vider(i);
      out.push(
        <p key={"l" + i} style={{ fontFamily: lecture, fontSize: 17, lineHeight: 1.75, margin: "0 0 8px", paddingLeft: 18, textIndent: -18, color: "#D6E4F1" }}>
          <span style={{ color: T.accent }}>▸ </span>{t.slice(2)}
        </p>
      );
    } else buffer.push(t);
  });
  vider("fin");
  return <div style={{ maxWidth: 640 }}>{out}</div>;
}

function Bilan({ items, colleges, resultats = [], cartes = [], qcms = [], onOuvrir }) {

  const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;

  const il7 = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);

  const restants = n - par[0].nb;

  const il14 = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
  const aRevoir = items
    .filter((i) => (i.niveau || 0) === 1 || ((i.niveau || 0) === 2 && (!i.dateNiveau || i.dateNiveau < il14)))
    .sort((a, b) => (a.niveau || 0) - (b.niveau || 0) || (a.dateNiveau || "").localeCompare(b.dateNiveau || ""))

                      return nb > 0 && <div key={v} style={{ width: (nb / l.length) * 100 + "%", background: NIV[v].c }} />;
                    })}
                  </div>
                </button>
                {on && detailQcm(c)}
              </div>
            );
          })}
        </div>
      )}

      {aRevoir.length > 0 && (
        <div className="mt-4 pt-3" style={{ borderTop: `1px solid ${T.line}` }}>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>À revoir en premier</p>
          {aRevoir.map((i) => (
            <button key={i.id} onClick={() => onOuvrir && onOuvrir(i.id)} className="block w-full text-left text-xs py-1">
              <i className="inline-block rounded-sm mr-2" style={{ width: 8, height: 8, background: NIV[i.niveau || 0].c }} />
              <span style={{ color: T.ink2 }}>{i.numero}. </span>{i.titre.slice(0, 44)}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* niveaux de compréhension : la couleur que TU choisis fixe la prochaine révision */
const NIVEAUX_C = [
  { v: 0, nom: "Pas encore vu",     court: "—",  jours: null, bg: "#182B41", fg: "#7E93A6", bord: "#2B4260" },
  { v: 1, nom: "Pas compris",       court: "J1", jours: 1,    bg: "#8E2F26", fg: "#FFE4E0", bord: "#E4685D" },
  { v: 2, nom: "Un peu compris",    court: "J3", jours: 3,    bg: "#9A5312", fg: "#FFE8CE", bord: "#E08A2E" },
  { v: 3, nom: "Moyennement",       court: "J5", jours: 5,    bg: "#8E7412", fg: "#FFF4D2", bord: "#EAC53F" },
  { v: 4, nom: "Bien compris",      court: "J7", jours: 7,    bg: "#1E7A5C", fg: "#DEF7EC", bord: "#35B48C" },
];
const nivC = (it) => Math.min(it.comp || 0, 4);
const MOIS_C = ["janv", "févr", "mars", "avr", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
const dCourte = (d) => { if (!d) return ""; const x = new Date(d + "T12:00:00"); return `${x.getDate()} ${MOIS_C[x.getMonth()]}`; };
const ecart = (d) => d ? Math.round((new Date(auj() + "T12:00:00") - new Date(d + "T12:00:00")) / 86400000) : null;

function echeance(it) {
  const n = nivC(it);
  if (!n || !it.dateComp) return null;
  const d = new Date(it.dateComp + "T12:00:00");
  d.setDate(d.getDate() + NIVEAUX_C[n].jours);
  return iso(d);
}
function retard(it) {
  const e = echeance(it);
  return e ? Math.round((new Date(auj() + "T12:00:00") - new Date(e + "T12:00:00")) / 86400000) : null;
}

function Grille({ colleges, items, scores, resultats, cartes, qcms, taches = [], onComp, onOuvrir }) {
  const [filtre, setFiltre] = useState("tous");
  const [q, setQ] = useState("");
  const [panneau, setPanneau] = useState(true);
  const [sel, setSel] = useState(null);
  const [survol, setSurvol] = useState(null);
  const [histo, setHisto] = useState([]);
  const [vue, setVue] = useState("damier");

  const visibles = colleges.filter((c) => filtre === "tous" || c.id === filtre);
  const lignes = items
    .filter((i) => visibles.some((c) => c.id === i.collegeId))
    .filter((i) => !q.trim() || i.titre.toLowerCase().includes(q.toLowerCase()) || String(i.numero).startsWith(q))
    .sort((a, b) => a.numero - b.numero);

  /* avancement : un item compte pour sa part de compréhension */
  const avancement = (l) => l.length
    ? Math.round(l.reduce((s, i) => s + nivC(i) / 4, 0) / l.length * 100) : 0;
  const pctTotal = avancement(items);

  const poser = (i, v) => {
    setHisto((h) => [...h.slice(-19), { id: i.id, comp: i.comp || 0, date: i.dateComp || null }]);
    onComp(i.id, v);
  };
  const annuler = () => {
    const d = histo[histo.length - 1];
    if (!d) return;
    onComp(d.id, d.comp, d.date);
    setHisto((h) => h.slice(0, -1));
  };

  /* prochain créneau planifié pour un item */
  const planifie = (id) => {
    const t = taches.filter((x) => x.itemId === id && x.date >= auj()).sort((a, b) => a.date.localeCompare(b.date))[0];
    return t ? t.date : null;
  };

  const apercu = items.find((i) => i.id === (survol || sel));

  return (
    <div>
      <div className="flex items-start gap-3 mb-3">
        <button onClick={() => setPanneau(!panneau)} className="flex items-center justify-center doux shrink-0"
          style={{ width: 38, height: 38, borderRadius: 999, background: panneau ? T.accent : T.card,
            color: panneau ? "#fff" : T.accent, border: `1px solid ${panneau ? T.accent : T.line}`, fontSize: 15 }}>
          {panneau ? "«" : "»"}
        </button>
        <div className="flex-1">
          <h2 style={{ fontFamily: serif, fontSize: 24 }}>La grille</h2>
          <p className="text-xs mt-1" style={{ color: T.ink2 }}>
            Choisis la couleur selon ta compréhension : elle fixe la date de la prochaine révision.
          </p>
        </div>
        <div className="text-right shrink-0">
          <p style={{ fontFamily: serif, fontSize: 27, lineHeight: 1, color: T.accent }}>{pctTotal}%</p>
          <p className="text-xs" style={{ color: T.ink2 }}>total</p>
        </div>
      </div>

      {/* légende : couleur = compréhension = délai */}
      <div className="flex flex-wrap gap-2 mb-4">
        {NIVEAUX_C.slice(1).map((n) => {
          const nb = lignes.filter((i) => nivC(i) === n.v).length;
          return (
            <span key={n.v} className="flex items-center gap-2 px-3 py-1.5"
              style={{ borderRadius: 999, background: n.bg, border: `1px solid ${n.bord}` }}>
              <b style={{ color: n.fg, fontSize: 11 }}>{n.court}</b>
              <span className="text-xs" style={{ color: n.fg, opacity: 0.9 }}>{n.nom}</span>
              <b style={{ color: n.fg, fontSize: 11 }}>{nb}</b>
            </span>
          );
        })}
        <span className="flex items-center gap-2 px-3 py-1.5 text-xs"
          style={{ borderRadius: 999, background: NIVEAUX_C[0].bg, color: NIVEAUX_C[0].fg }}>
          Pas encore vu <b>{lignes.filter((i) => !nivC(i)).length}</b>
        </span>
        {(() => {
          const n = lignes.filter((i) => retard(i) !== null && retard(i) >= 0).length;
          return n ? (
            <span className="flex items-center gap-2 px-3 py-1.5 text-xs"
              style={{ borderRadius: 999, background: NIV[2].doux, color: NIV[2].encre, fontWeight: 700 }}>
              À revoir maintenant <b>{n}</b>
            </span>
          ) : null;
        })()}
      </div>

      <div className="flex flex-wrap gap-1 mb-3">
        <Chip actif={filtre === "tous"} onClick={() => setFiltre("tous")} p={{ fg: T.ink, bg: T.card }}>
          Toutes {pctTotal}%
        </Chip>
        {colleges.map((c) => {
          const l = items.filter((i) => i.collegeId === c.id);
          return (
            <Chip key={c.id} actif={filtre === c.id} onClick={() => setFiltre(c.id)} p={pal(c.nom)}>
              {c.nom} {avancement(l)}%
            </Chip>
          );
        })}
      </div>

      <div className="flex gap-2 mb-3">
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filtrer par mot ou numéro…"
          className="flex-1 px-3 py-2 text-sm" style={{ borderRadius: 999, border: `1px solid ${T.line}`, background: T.card }} />
        <button onClick={annuler} disabled={!histo.length} aria-label="Annuler"
          className="flex items-center justify-center doux"
          style={{ width: 40, height: 38, borderRadius: 999, background: T.card,
            border: `1px solid ${histo.length ? T.accent : T.line}`, color: histo.length ? T.accent : "#3E5C7C", fontSize: 16 }}>↺</button>
        <button onClick={() => setVue(vue === "damier" ? "tableau" : "damier")} className="px-4 py-2 text-xs doux"
          style={{ borderRadius: 999, background: T.card, border: `1px solid ${T.line}`, color: T.ink, fontWeight: 600 }}>
          {vue === "damier" ? "Tableau" : "Damier"}
        </button>
      </div>

      {/* aperçu de l'item survolé ou sélectionné */}
      {apercu && (() => {
        const i = apercu;
        const n = nivC(i);
        const N = NIVEAUX_C[n];
        const c = colleges.find((x) => x.id === i.collegeId);
        const e = echeance(i);
        const r = retard(i);
        const pl = planifie(i.id);
        const sc = scores[i.id];
        return (
          <div className="ombre mb-3 vue" style={{ background: T.card, borderRadius: 20, padding: "14px 16px", border: `1px solid ${N.bord}` }}>
            <div className="flex items-start gap-3 mb-3">
              <span className="shrink-0 flex items-center justify-center"
                style={{ width: 44, height: 40, borderRadius: 12, background: N.bg, border: `1.5px solid ${N.bord}`,
                  color: "#fff", fontWeight: 800, fontSize: 13 }}>{i.numero}</span>
              <span className="flex-1 min-w-0">
                <span className="block text-sm" style={{ fontWeight: 700, lineHeight: 1.35 }}>{i.titre}</span>
                <span className="block text-xs mt-1" style={{ color: pal(c ? c.nom : "").fg }}>{c ? c.nom : ""}</span>
              </span>
              {sel && <button onClick={() => setSel(null)} className="text-sm px-1" style={{ color: T.ink2 }}>✕</button>}
            </div>

            <div className="flex flex-wrap gap-2 text-xs mb-3">
              {i.dateComp && (
                <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.paper, color: T.ink2 }}>
                  Vu le {dCourte(i.dateComp)} · il y a {ecart(i.dateComp)} j
                </span>
              )}
              {e && (
                <span className="px-3 py-1.5" style={{ borderRadius: 999,
                  background: r >= 0 ? NIV[1].doux : T.paper, color: r >= 0 ? NIV[1].encre : T.ink2, fontWeight: r >= 0 ? 700 : 400 }}>
                  {r >= 0 ? `À revoir — en retard de ${r} j` : `À revoir le ${dCourte(e)}`}
                </span>
              )}
              {pl && (
                <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 600 }}>
                  Planifié le {dCourte(pl)}
                </span>
              )}
              {sc !== null && (
                <span className="px-3 py-1.5" style={{ borderRadius: 999, background: T.paper, color: couleur(sc), fontWeight: 700 }}>
                  {sc}% aux QCM
                </span>
              )}
            </div>

            <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
              Je viens de le travailler — je l'ai…
            </p>
            <div className="flex flex-wrap gap-2 mb-2">
              {NIVEAUX_C.slice(1).map((x) => (
                <button key={x.v} onClick={() => poser(i, x.v)} className="flex-1 py-2.5 text-xs doux"
                  style={{ borderRadius: 14, minWidth: 92,
                    background: n === x.v ? x.bord : x.bg, color: n === x.v ? "#0E1A29" : x.fg,
                    border: `1px solid ${x.bord}`, fontWeight: 700 }}>
                  {x.nom}
                  <span className="block" style={{ opacity: 0.8, fontWeight: 600 }}>revoir à {x.court}</span>
                </button>
              ))}
            </div>
            <div className="flex gap-2">
              <button onClick={() => onOuvrir(i.id)} className="px-4 py-2 text-xs doux"
                style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600 }}>Ouvrir l'item</button>
              {n > 0 && (
                <button onClick={() => poser(i, 0)} className="px-3 py-2 text-xs doux"
                  style={{ border: `1px solid ${T.line}`, color: T.ink2, borderRadius: 999 }}>Remettre à zéro</button>
              )}
            </div>
          </div>
        );
      })()}

      <div className="md:flex md:gap-5 md:items-start">
      <div className="md:order-2 md:flex-1 md:min-w-0">

      {visibles.map((c) => {
        const l = lignes.filter((i) => i.collegeId === c.id);
        if (!l.length) return null;
        const p = pal(c.nom);
        return (
          <div key={c.id} className="mb-6">
            <div className="flex items-baseline justify-between mb-2">
              <span style={{ fontFamily: serif, fontSize: 16, color: p.fg, fontWeight: 600 }}>{c.nom}</span>
              <span className="text-xs" style={{ color: T.ink2 }}>
                {avancement(l)}% · {l.filter((i) => nivC(i)).length}/{l.length}
              </span>
            </div>

            {vue === "damier" ? (
              <div className="flex flex-wrap gap-1.5">
                {l.map((i) => {
                  const n = nivC(i);
                  const N = NIVEAUX_C[n];
                  const r = retard(i);
                  const pl = planifie(i.id);
                  return (
                    <button key={i.id}
                      onClick={() => setSel(sel === i.id ? null : i.id)}
                      onMouseEnter={() => setSurvol(i.id)} onMouseLeave={() => setSurvol(null)}
                      title={`${i.numero}. ${i.titre}`}
                      className="case flex flex-col items-center justify-center"
                      style={{
                        width: 52, height: 46, borderRadius: 12, background: N.bg,
                        border: `1.5px solid ${sel === i.id ? "#fff" : r >= 0 ? T.moyen : N.bord}`,
                        position: "relative", overflow: "hidden",
                      }}>
                      <span style={{ fontSize: 13, fontWeight: 800, color: "#FFFFFF", lineHeight: 1.1 }}>{i.numero}</span>
                      {i.dateComp && (
                        <span style={{ fontSize: 8.5, color: "#FFFFFF", opacity: 0.72, lineHeight: 1.2 }}>{dCourte(i.dateComp)}</span>
                      )}
                      {pl && <span style={{ position: "absolute", top: 3, right: 3, width: 5, height: 5, borderRadius: 999, background: T.accent }} />}
                    </button>
                  );
                })}
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full" style={{ borderCollapse: "collapse", fontSize: 12.5 }}>
                  <tbody>
                    {l.map((i) => {
                      const N = NIVEAUX_C[nivC(i)];
                      const pl = planifie(i.id);
                      const r = retard(i);
                      return (
                        <tr key={i.id} onClick={() => setSel(sel === i.id ? null : i.id)}
                          style={{ borderTop: `1px solid ${T.line}`, cursor: "pointer" }}>
                          <td style={{ width: 42, padding: "9px 4px", color: "#fff", fontWeight: 700 }}>{i.numero}</td>
                          <td style={{ padding: "9px 6px", lineHeight: 1.4 }}>{i.titre}</td>
                          <td style={{ width: 76, textAlign: "right", padding: "9px 4px", color: T.accent, fontSize: 11 }}>
                            {pl ? "◷ " + dCourte(pl) : ""}
                          </td>
                          <td style={{ width: 86, textAlign: "right", padding: "9px 6px" }}>
                            <span style={{ padding: "4px 9px", borderRadius: 999, background: N.bg,
                              border: `1px solid ${r >= 0 ? T.moyen : N.bord}`, color: N.fg, fontWeight: 700, fontSize: 11 }}>
                              {i.dateComp ? dCourte(i.dateComp) : "jamais"}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}

      <p className="text-xs mt-2" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Un point bleu en haut d'une case signale un créneau déjà posé dans ton planning.
        Un contour ambre signale une révision en retard.
      </p>

      </div>
      {panneau && (
        <div className="md:order-1 md:w-72 md:shrink-0 mt-6 md:mt-0 md:sticky" style={{ top: 70 }}>
          <Bilan items={filtre === "tous" ? items : items.filter((i) => i.collegeId === filtre)}
            colleges={filtre === "tous" ? colleges : colleges.filter((c) => c.id === filtre)}
            resultats={resultats} cartes={cartes} qcms={qcms} onOuvrir={onOuvrir} />
        </div>
      )}
      </div>
    </div>
  );
}

function Chip({ actif, onClick, p, children }) {
  return (
    <button onClick={onClick} className="px-3 py-1 rounded-full text-xs"
      style={{
        background: actif ? p.fg : p.bg, color: actif ? "#fff" : p.fg,
        border: `1px solid ${actif ? p.fg : "transparent"}`, fontWeight: 600,
      }}>{children}</button>
  );
}

/* ================== collèges ================== */
function Anneau({ pct, couleur, taille = 46 }) {
  const r = (taille - 6) / 2, C = 2 * Math.PI * r;
  return (
    <svg width={taille} height={taille} style={{ flexShrink: 0 }}>
      <circle cx={taille / 2} cy={taille / 2} r={r} fill="none" stroke={couleur} strokeOpacity="0.18" strokeWidth="5" />
      <circle cx={taille / 2} cy={taille / 2} r={r} fill="none" stroke={couleur} strokeWidth="5" strokeLinecap="round"
        strokeDasharray={`${(pct / 100) * C} ${C}`} transform={`rotate(-90 ${taille / 2} ${taille / 2})`}
        style={{ transition: "stroke-dasharray 420ms ease" }} />
      <text x="50%" y="50%" textAnchor="middle" dy="0.35em"
        style={{ fontFamily: serif, fontSize: 12, fontWeight: 700, fill: couleur }}>{pct}</text>
    </svg>
  );
}

function VueColleges({ colleges, items, scores, onOuvrir }) {
  return (
    <div>
      <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>Collèges</h2>
      <p className="text-xs mb-5" style={{ color: T.ink2 }}>Le chiffre dans l'anneau est ton pourcentage d'items maîtrisés.</p>
      {colleges.map((c) => {
        const l = items.filter((i) => i.collegeId === c.id);
        const bien = l.filter((i) => (i.niveau || 0) === 3).length;
        const commences = l.filter((i) => (i.niveau || 0) > 0).length;
        const pct = l.length ? Math.round((bien / l.length) * 100) : 0;
        const p = pal(c.nom);
        return (
          <button key={c.id} onClick={() => onOuvrir(c.id)}
            className="w-full text-left mb-3 flex items-center gap-4 releve"
            style={{
              background: `linear-gradient(135deg, ${melange(p.fg, p.bg, 0.20)} 0%, ${p.bg} 100%)`,
              borderRadius: 24, padding: "17px 19px",
              border: `1px solid ${melange(p.fg, "#24384F", 0.28)}`,
            }}>
            <Anneau pct={pct} couleur={p.fg} />
            <span className="flex-1 min-w-0">
              <span className="block" style={{ fontFamily: serif, fontSize: 17, fontWeight: 600, color: p.fg }}>{c.nom}</span>
              <span className="block text-xs mt-1" style={{ color: p.fg, opacity: 0.72 }}>
                {l.length} items · {commences} commencés · {bien} maîtrisés
              </span>
            </span>
            <span style={{ color: p.fg, opacity: 0.45, fontSize: 22 }}>›</span>
          </button>
        );
      })}
    </div>
  );
}

function VueCollege({ college, items, scores, cartes, qcms, onResume, onOuvrir }) {
  const [voirResume, setVoirResume] = useState(false);
  const tries = [...items].sort((a, b) => a.numero - b.numero);
  return (
    <div>
      <div className="mb-5 doux" style={{
        background: `linear-gradient(135deg, ${melange(pal(college.nom).fg, "#17293E", 0.28)} 0%, ${pal(college.nom).bg} 100%)`,
        borderRadius: 24, padding: "20px 22px", border: `1px solid ${melange(pal(college.nom).fg, "#24384F", 0.35)}` }}>
        <div className="flex items-center gap-4">
          <Anneau pct={items.length ? Math.round(items.filter((i) => (i.niveau || 0) === 3).length / items.length * 100) : 0}
            couleur={pal(college.nom).fg} taille={52} />
          <div>
            <h2 style={{ fontFamily: serif, fontSize: 22, color: pal(college.nom).fg }}>{college.nom}</h2>
            <p className="text-xs mt-1" style={{ color: pal(college.nom).fg, opacity: 0.72 }}>
              {items.length} items au programme
            </p>
          </div>
        </div>
      </div>

      <button onClick={() => setVoirResume(!voirResume)} className="text-sm mb-3" style={{ color: T.accent }}>
        {voirResume ? "Masquer" : "Voir"} le résumé du collège
      </button>
      {voirResume && (
        <textarea value={college.resume} onChange={(e) => onResume(e.target.value)} rows={5}
          placeholder="La synthèse transversale du collège : réflexes, chiffres, pièges."
          className="w-full p-3 rounded text-sm mb-4" style={{ border: `1px solid ${T.line}`, background: T.card }} />
      )}

      <ListeItems items={tries} scores={scores} colleges={[college]} cartes={cartes} qcms={qcms} onOuvrir={onOuvrir} />
    </div>
  );
}

function ListeItems({ items, scores, colleges, cartes = [], qcms = [], onOuvrir }) {
  if (!items.length) return <p className="text-sm py-6" style={{ color: T.ink2 }}>Rien ici.</p>;
  return (
    <ul>
      {items.map((i) => {
        const c = colleges.find((x) => x.id === i.collegeId);
        const p = pal(c ? c.nom : "");
        const nv = NIV[i.niveau || 0];
        const nbc = cartes.filter((x) => x.itemId === i.id).length;
        const nbq = qcms.filter((x) => x.itemId === i.id).length;
        return (
          <li key={i.id} className="mb-2">
            <button onClick={() => onOuvrir(i.id)} className="w-full text-left flex items-center gap-3 releve"
              style={{ background: T.card, borderRadius: 18, padding: "12px 14px", border: `1px solid ${T.line}` }}>
              <span className="shrink-0 flex items-center justify-center"
                style={{ width: 38, height: 38, borderRadius: 999,
                  background: melange(p.fg, p.bg, 0.22), color: p.fg,
                  border: `1px solid ${melange(p.fg, p.bg, 0.45)}`,
                  fontFamily: serif, fontWeight: 700, fontSize: 12 }}>{i.numero}</span>

              <span className="flex-1 min-w-0">
                <span className="block" style={{ fontSize: 14.5, fontWeight: 500, lineHeight: 1.35 }}>{i.titre}</span>
                {(nbc + nbq) > 0 && (
                  <span className="block text-xs mt-1.5" style={{ color: T.ink2 }}>
                    {nbq > 0 ? nbq + " QCM" : ""}{nbq > 0 && nbc > 0 ? " · " : ""}{nbc > 0 ? nbc + " cartes" : ""}
                  </span>
                )}
              </span>

              <span className="shrink-0 rounded-full"
                style={{ width: 10, height: 10, background: (i.niveau || 0) === 0 ? "#24384F" : nv.c }} />
            </button>
          </li>
        );
      })}
    </ul>
  );
}

/* ================== assistant IA, dédié à un item ================== */
function Assistant({ item, college, cartes, qcms, depart, onAjoutCarte, onAjoutQcm }) {
  const [genre, setGenre] = useState(depart || "qcm");
  const [nb, setNb] = useState(5);
  const [etat, setEtat] = useState(null);
  const [erreur, setErreur] = useState(null);
  const [cle, setCle] = useState(litCle());
  const [reglages, setReglages] = useState(!litCle());
  const [manuel, setManuel] = useState(false);
  const [colle, setColle] = useState("");

  const dejaVus = genre === "qcm" || genre === "qroc"
    ? qcms.map((q) => q.enonce).slice(-25)
    : cartes.map((c) => c.recto).slice(-25);

  const consigneGenre = {
    qcm: `Rédige ${nb} QCM à cinq propositions A à E, plusieurs réponses possibles, du niveau des EDN.
Pour CHAQUE proposition, vraie comme fausse, une justification d'une à deux phrases dans "pourquoi".
Le champ "explication" donne le raisonnement d'ensemble : ce qu'il fallait reconnaître.
Format : [{"enonce":"...","props":[{"txt":"...","vrai":true,"pourquoi":"..."}],"explication":"..."}]`,
    qroc: `Rédige ${nb} questions à réponse rédigée courte, du type des EDN.
Donne la réponse attendue et la liste des mots-clés qui doivent y figurer.
Format : [{"type":"qroc","enonce":"...","reponse":"...","cles":["..."],"explication":"..."}]`,
    flash: `Rédige ${nb} flashcards recto-verso. Recto : une question courte et précise. Verso : une réponse exacte et brève. Une seule idée par carte.
Format : [{"recto":"...","verso":"..."}]`,
  }[genre];

  const message = `Item ${item.numero} — ${item.titre} (collège de ${college.nom}).

${consigneGenre}

Reste dans le périmètre de cet item.
${dejaVus.length ? "Ne reprends aucun de ces énoncés déjà présents :\n- " + dejaVus.join("\n- ") : ""}`;

  const integrer = (liste) => {
    let n = 0;
    (Array.isArray(liste) ? liste : []).forEach((x) => {
      if (x.recto && x.verso) { onAjoutCarte({ recto: x.recto, verso: x.verso }); n++; }
      else if (x.type === "qroc" && x.enonce && x.reponse) {
        onAjoutQcm({ type: "qroc", enonce: x.enonce, reponse: x.reponse, cles: x.cles || [], explication: x.explication || "" }); n++;
      } else if (x.enonce && Array.isArray(x.props)) {
        onAjoutQcm({ enonce: x.enonce, props: x.props, explication: x.explication || "" }); n++;
      }
    });
    return n;
  };

  const generer = async () => {
    setErreur(null); setEtat("Rédaction en cours…");
    try {
      const txt = await demanderIA(CONSIGNE, message, 4000);
      const n = integrer(extraireJson(txt));
      setEtat(n ? `${n} exercice(s) ajouté(s) à cet item.` : "Rien d'exploitable dans la réponse.");
      setTimeout(() => setEtat(null), 4000);
    } catch (e) {
      setEtat(null);
      if (String(e.message) === "PAS_DE_CLE") { setReglages(true); setErreur("Ajoute ta clé pour générer directement."); }
      else setErreur(String(e.message || e));
    }
  };

  return (
    <div>
      <div className="flex gap-2 mb-3 flex-wrap">
        {[["qcm", "QCM"], ["qroc", "Rédigées"], ["flash", "Flashcards"]].map(([v, l]) => (
          <button key={v} onClick={() => setGenre(v)} className="px-4 py-2 text-xs doux"
            style={{ borderRadius: 999, fontWeight: 600,
              background: genre === v ? T.accent : T.accentPale, color: genre === v ? "#fff" : T.accent }}>{l}</button>
        ))}
        <div className="flex-1" />
        {[5, 10, 15].map((k) => (
          <button key={k} onClick={() => setNb(k)} className="px-3 py-2 text-xs doux"
            style={{ borderRadius: 999, fontWeight: 600,
              background: nb === k ? T.ink : "transparent", color: nb === k ? "#fff" : T.ink2,
              border: `1px solid ${nb === k ? T.ink : T.line}` }}>{k}</button>
        ))}
      </div>

      <button onClick={generer} disabled={!!etat}
        className="w-full py-4 doux mb-2"
        style={{ background: etat ? "#24384F" : T.accent, color: "#fff", borderRadius: 999, fontWeight: 700, fontSize: 15 }}>
        {etat || `Générer ${nb} ${genre === "flash" ? "flashcards" : genre === "qroc" ? "questions rédigées" : "QCM"}`}
      </button>

      {erreur && (
        <p className="text-xs mb-2 px-3 py-2" style={{ background: NIV[1].doux, color: NIV[1].encre, borderRadius: 12 }}>{erreur}</p>
      )}

      {reglages && (
        <div className="mb-3" style={{ background: T.card, borderRadius: 18, padding: "14px 16px" }}>
          <p className="text-xs mb-2" style={{ color: T.ink2, lineHeight: 1.7 }}>
            La génération directe demande ta clé d'API Anthropic. Elle reste dans ce navigateur, elle n'est
            pas dans le fichier du site, et je ne la vois pas. Chaque génération coûte une fraction de centime.
          </p>
          <input type="password" value={cle} onChange={(e) => { setCle(e.target.value); ecritCle(e.target.value); }}
            placeholder="sk-ant-..." className="w-full px-3 py-2 text-sm mb-2"
            style={{ borderRadius: 12, border: `1px solid ${T.line}` }} />
          <button onClick={() => setReglages(false)} className="text-xs" style={{ color: T.accent, fontWeight: 600 }}>Fermer</button>
        </div>
      )}

      <div className="flex gap-3 text-xs" style={{ color: T.ink2 }}>
        <button onClick={() => setReglages(!reglages)} style={{ textDecoration: "underline" }}>Clé d'API</button>
        <button onClick={() => setManuel(!manuel)} style={{ textDecoration: "underline" }}>
          {manuel ? "Masquer" : "Passer par le presse-papier"}
        </button>
      </div>

      {manuel && (
        <div className="mt-3">
          <textarea readOnly value={message} rows={5} onFocus={(e) => e.target.select()}
            className="w-full p-3 text-xs mb-2"
            style={{ borderRadius: 14, border: `1px solid ${T.line}`, background: "#132436", color: T.ink2, lineHeight: 1.5 }} />
          <button onClick={() => navigator.clipboard.writeText(CONSIGNE + "\n\n" + message)}
            className="px-4 py-2 text-xs doux mb-3"
            style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600 }}>Copier</button>
          <textarea value={colle} onChange={(e) => setColle(e.target.value)} rows={3}
            placeholder="Colle ici la réponse JSON" className="w-full p-3 text-xs mb-2"
            style={{ borderRadius: 14, border: `1px solid ${T.line}` }} />
          <button onClick={() => {
            try { const n = integrer(extraireJson(colle)); setColle(""); setEtat(`${n} ajouté(s).`); setTimeout(() => setEtat(null), 3000); }
            catch { setErreur("JSON invalide."); }
          }} disabled={!colle.trim()} className="px-4 py-2 text-xs doux"
            style={{ background: colle.trim() ? T.ink : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>Ajouter</button>
        </div>
      )}

      <p className="text-xs mt-5" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Relis ce qui est produit avant de l'apprendre : une IA écrit ce qui ressemble à une bonne question,
        elle ne garantit pas la fidélité au référentiel.
      </p>
    </div>
  );
}
