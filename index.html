function Planning({ taches, onMaj, items, colleges, onOuvrirItem, onComprendre, onNote }) {
  const [debutSem, setDebutSem] = useState(() => lundiDe(new Date()));
  const [jour, setJour] = useState(() => iso(new Date()));
  const [creneau, setCreneau] = useState(null);
  const [fin, setFin] = useState(9);
  const [texte, setTexte] = useState("");
  const [selection, setSelection] = useState(null);
  const [noter, setNoter] = useState(null);
  const [export_, setExport_] = useState(false);
  const [modeles, setModeles] = useState(false);
  const [purge, setPurge] = useState(false);
  const [effacer_, setEffacer] = useState(false);
  const [corbeille, setCorbeille] = useState([]);
  const [glisse, setGlisse] = useState(null);
  const [apercu, setApercu] = useState(null);  // position provisoire, non enregistrée
  const zone = useRef(null);

  useEffect(() => { if (zone.current) zone.current.scrollTop = 7 * HT; }, []);

  const semaine = [...Array(7)].map((_, i) => {
    const d = new Date(debutSem); d.setDate(d.getDate() + i); return d;
  });
  const aujourdhui = iso(new Date());
  const duJour = taches.filter((t) => t.date === jour).map(normaliser).sort((a, b) => a.debut - b.debut);

  const ajouter = (type, itemId, libelle) => {
    onMaj([...taches, {
      id: Math.random().toString(36).slice(2, 9), date: jour, type,
      itemId: itemId || null, texte: libelle || "",
      debut: creneau, duree: Math.max(1, fin - creneau), fait: false, teinte: taches.length % BLOCS.length,
    }]);
    setTexte(""); setCreneau(null);
  };
  const modifier = (id, patch) => onMaj(taches.map((t) => t.id === id ? { ...normaliser(t), ...patch } : t));
  const supprimer = (id) => { onMaj(taches.filter((t) => t.id !== id)); setSelection(null); };
  const reporter = (t) => {
    const d = new Date(t.date + "T12:00:00"); d.setDate(d.getDate() + 1);
    const demain = iso(d), dur = t.duree || 1;
    onMaj(taches.map((x) => {
      if (x.id === t.id) return { ...normaliser(x), date: demain, debut: 8, fait: false };
      const n = normaliser(x);
      if (n.date === demain && n.debut >= 8) return { ...n, debut: Math.min(23, n.debut + dur) };
      return x;
    }));
    setSelection(null);
  };

  /* étirement et déplacement au doigt ou au stylet */
  const prendre = (e, t, mode) => {
    e.stopPropagation();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
    setSelection(t.id);
    setGlisse({ id: t.id, mode, y0: e.clientY, debut0: t.debut, duree0: t.duree || 1 });
    setApercu({ id: t.id, debut: t.debut, duree: t.duree || 1 });
  };
  const bouger = (e) => {
    if (!glisse) return;
    const pas = Math.round((e.clientY - glisse.y0) / HT);
    if (glisse.mode === "duree") {
      const d = Math.min(24 - glisse.debut0, Math.max(1, glisse.duree0 + pas));
      setApercu((a) => (a && a.duree === d ? a : { id: glisse.id, debut: glisse.debut0, duree: d }));
    } else {
      const h = Math.min(24 - glisse.duree0, Math.max(0, glisse.debut0 + pas));
      setApercu((a) => (a && a.debut === h ? a : { id: glisse.id, debut: h, duree: glisse.duree0 }));
    }
  };
  const lacher = () => {
    if (apercu) modifier(apercu.id, { debut: apercu.debut, duree: apercu.duree });
    setApercu(null); setGlisse(null);
  };

  /* Place un item à réviser dans le premier créneau libre. La durée dépend de
     la compréhension : moins c'est compris, plus le bloc est long. */
  const placerRevision = (i) => {
    const n = Math.min(i.comp || 0, 4);
    const duree = [1, 3, 2, 2, 1][n] || 1;
    const occupees = duJour.map((t) => [t.debut, t.debut + (t.duree || 1)]);
    const libre = (a, b) => b <= 24 && !occupees.some(([x, y]) => a < y && b > x);
    let h = -1;
    for (let d = 8; d <= 22; d++) { if (libre(d, d + duree)) { h = d; break; } }
    if (h === -1) for (let d = 8; d <= 23; d++) { if (libre(d, d + 1)) { h = d; break; } }
    if (h === -1) return;
    onMaj([...taches, {
      id: Math.random().toString(36).slice(2, 9), date: jour, type: "item",
      itemId: i.id, texte: "", debut: h, duree: libre(h, h + duree) ? duree : 1,
      fait: false, teinte: (taches.length + i.numero) % BLOCS.length, revision: true,
    }]);
  };

  /* remplit la journée avec un modèle, en piochant les items les plus faibles */
  const appliquerModele = (m) => {
    const occupees = duJour.map((t) => [t.debut, t.debut + (t.duree || 1)]);
    const libre = (a, b) => !occupees.some(([x, y]) => a < y && b > x);
    const candidats = items
      .filter((i) => (i.comp || 0) < 4)
      .map((i) => ({ i, d: i.dateComp || "0000-00-00", n: i.comp || 0 }))
      .sort((a, b) => a.n - b.n || a.d.localeCompare(b.d));
    let k = 0;
    const nouvelles = [];
    m.creneaux.forEach((c, idx) => {
      if (!libre(c.debut, c.debut + c.duree)) return;
      let type = "perso", itemId = null, texte_ = c.texte;
      if (c.texte === null) {
        const x = candidats[k++];
        if (x) { type = "item"; itemId = x.i.id; texte_ = ""; }
        else texte_ = "Révision libre";
      }
      nouvelles.push({
        id: Math.random().toString(36).slice(2, 9), date: jour, type, itemId, texte: texte_,
        debut: c.debut, duree: c.duree, fait: false,
        teinte: c.libre === false ? 7 : (taches.length + idx) % BLOCS.length,
      });
    });
    if (nouvelles.length) onMaj([...taches, ...nouvelles]);
    setModeles(false);
  };

  /* duplique la journée affichée vers une autre date */
  const dupliquer = (versDate) => {
    const copie = duJour.map((t) => ({
      ...t, id: Math.random().toString(36).slice(2, 9), date: versDate, fait: false,
    }));
    if (copie.length) onMaj([...taches, ...copie]);
    setModeles(false);
  };

  const trouves = texte.trim()
    ? items.filter((i) => correspond(i, texte)).slice(0, 4)
    : [];

  const dateLisible = (() => {
    const d = new Date(jour + "T12:00:00");
    return `${JOURS[(d.getDay() + 6) % 7]}. ${d.getDate()} ${MOIS[d.getMonth()]}`;
  })();

  const vue = duJour.map((t) => (apercu && apercu.id === t.id ? { ...t, debut: apercu.debut, duree: apercu.duree } : t))
    .sort((a, b) => a.debut - b.debut || (b.duree || 1) - (a.duree || 1));

  /* répartition en colonnes : deux blocs qui se chevauchent restent visibles côte à côte */
  const place = [];
  let grappe = [], finGrappe = -1;
  const viderGrappe = () => {
    if (!grappe.length) return;
    const cols = [];
    grappe.forEach((t) => {
      let c = cols.findIndex((f) => f <= t.debut);
      if (c === -1) { c = cols.length; cols.push(0); }
      cols[c] = t.debut + (t.duree || 1);
      t.col = c;
    });
    grappe.forEach((t) => place.push({ ...t, nCols: cols.length }));
    grappe = [];
  };
  vue.forEach((t) => {
    if (grappe.length && t.debut >= finGrappe) { viderGrappe(); finGrappe = -1; }
    grappe.push({ ...t });
    finGrappe = Math.max(finGrappe, t.debut + (t.duree || 1));
  });
  viderGrappe();

  const occupe = (h) => duJour.some((t) => h >= t.debut && h < t.debut + (t.duree || 1));

  return (
    <div>
      <div className="flex items-center gap-2 mb-3">
        <button onClick={() => { const d = new Date(debutSem); d.setDate(d.getDate() - 7); setDebutSem(d); }}
          className="flex items-center justify-center doux"
          style={{ width: 34, height: 34, borderRadius: 999, border: `1px solid ${T.line}`, color: T.accent }}>‹</button>
        <span className="flex-1 text-center text-sm" style={{ fontWeight: 600 }}>
          {MOIS[semaine[3].getMonth()]} {semaine[3].getFullYear()}
        </span>
        <button onClick={() => { const d = new Date(debutSem); d.setDate(d.getDate() + 7); setDebutSem(d); }}
          className="flex items-center justify-center doux"
          style={{ width: 34, height: 34, borderRadius: 999, border: `1px solid ${T.line}`, color: T.accent }}>›</button>
        <button onClick={() => { setDebutSem(lundiDe(new Date())); setJour(aujourdhui); }}
          className="px-3 py-1.5 text-xs doux"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>Aujourd'hui</button>
      </div>

      <div className="flex gap-1.5 mb-4">
        {semaine.map((d, i) => {
          const k = iso(d);
          const n = taches.filter((t) => t.date === k);
          const faits = n.filter((t) => t.fait).length;
          const actif = k === jour;
          return (
            <button key={k} onClick={() => { setJour(k); setCreneau(null); setSelection(null); }} className="flex-1 doux"
              style={{ borderRadius: 16, padding: "9px 2px 8px", background: actif ? T.accent : T.card,
                border: `1px solid ${actif ? T.accent : k === aujourdhui ? T.accent : T.line}` }}>
              <span className="block text-xs" style={{ color: actif ? "#fff" : T.ink2, opacity: 0.8 }}>{JOURS[i]}</span>
              <span className="block" style={{ fontSize: 17, fontWeight: 700, color: actif ? "#fff" : T.ink }}>{d.getDate()}</span>
              <span className="block" style={{ height: 6, marginTop: 3 }}>
                {n.length > 0 && <i style={{ display: "inline-block", width: 6, height: 6, borderRadius: 999,
                  background: faits === n.length ? T.haut : actif ? "#fff" : T.accent }} />}
              </span>
            </button>
          );
        })}
      </div>

      <div className="flex items-center justify-between mb-2 px-1">
        <span style={{ fontFamily: serif, fontSize: 20 }}>{dateLisible}</span>
        <span className="flex items-center gap-2">
          <span className="text-xs" style={{ color: T.ink2 }}>
            {duJour.filter((t) => t.fait).length}/{duJour.length} fait
          </span>
          <button onClick={() => { setEffacer(!effacer_); setModeles(false); setExport_(false); }}
            className="flex items-center gap-1.5 px-3 py-1.5 doux"
            style={{ borderRadius: 999, background: effacer_ ? T.bas : T.card, color: effacer_ ? "#fff" : T.ink2, fontWeight: 700, fontSize: 12, border: `1px solid ${effacer_ ? T.bas : T.line}` }}>
            <span style={{ fontSize: 13 }}>⌫</span> Effacer
          </button>
          <button onClick={() => { setModeles(!modeles); setExport_(false); setEffacer(false); }}
            className="flex items-center gap-1.5 px-3 py-1.5 doux"
            style={{ borderRadius: 999, background: modeles ? T.accent : T.accentPale, color: modeles ? "#fff" : T.accent, fontWeight: 700, fontSize: 12 }}>
            <span style={{ fontSize: 13 }}>◫</span> Modèles
          </button>
          <button onClick={() => { setExport_(!export_); setModeles(false); }} aria-label="Ajouter à Calendrier"
            className="flex items-center gap-1.5 px-3 py-1.5 doux"
            style={{ borderRadius: 999, background: export_ ? T.accent : T.accentPale, color: export_ ? "#fff" : T.accent, fontWeight: 700, fontSize: 12 }}>
            <span style={{ fontSize: 13 }}>◷</span> Calendrier
          </button>
        </span>
      </div>

      {corbeille && (
        <div className="flex items-center gap-3 mb-3 px-4 py-3 vue"
          style={{ background: NIV[2].doux, borderRadius: 16 }}>
          <span className="text-xs flex-1" style={{ color: NIV[2].encre, fontWeight: 600 }}>
            {corbeille.length} élément(s) effacé(s)
          </span>
          <button onClick={() => { onMaj([...taches, ...(corbeille || [])]); setCorbeille([]); }}
            className="px-4 py-1.5 text-xs doux"
            style={{ background: NIV[2].encre, color: "#241A03", borderRadius: 999, fontWeight: 800 }}>
            ↺ Annuler
          </button>
          <button onClick={() => setCorbeille([])} className="text-xs px-1" style={{ color: NIV[2].encre }}>✕</button>
        </div>
      )}

      {effacer_ && (
        <div className="ombre mb-3 vue" style={{ background: T.card, borderRadius: 20, padding: "14px 16px", border: `1px solid ${T.bas}` }}>
          <p className="text-xs mb-3" style={{ color: T.ink2, lineHeight: 1.7 }}>
            Efface des créneaux du planning. Un bouton d'annulation reste affiché ensuite : rien n'est perdu tant que tu ne l'as pas fermé.
          </p>
          <div className="flex flex-wrap gap-2">
            {[["Ce jour", (t) => t.date === jour],
              ["Cette semaine", (t) => t.date >= iso(debutSem) && t.date <= iso(new Date(debutSem.getTime() + 6 * 86400000))],
              ["Ce qui est fait", (t) => t.fait],
              ["Tout le passé", (t) => t.date < auj()],
              ["Tout", () => true]].map(([l, f]) => {
              const lot = taches.filter(f);
              return (
                <button key={l} disabled={!lot.length}
                  onClick={() => {
                    setCorbeille(lot);
                    onMaj(taches.filter((t) => !lot.some((x) => x.id === t.id)));
                    setEffacer(false);
                  }}
                  className="px-4 py-2.5 text-xs doux"
                  style={{
                    borderRadius: 999, fontWeight: 600,
                    background: lot.length ? (l === "Tout" ? NIV[1].doux : T.paper) : "transparent",
                    color: lot.length ? (l === "Tout" ? NIV[1].encre : T.ink) : "#3E5C7C",
                    border: `1px solid ${lot.length ? (l === "Tout" ? T.bas : T.line) : T.line}`,
                  }}>
                  {l} <span style={{ opacity: 0.7 }}>{lot.length}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {purge && (
        <div className="ombre mb-3 vue" style={{ background: T.card, borderRadius: 20, padding: "14px 16px", border: `1px solid ${T.bas}` }}>
          <p className="text-xs mb-3" style={{ color: T.ink2, lineHeight: 1.7 }}>
            Efface des créneaux du planning. Un bouton de rétablissement apparaît juste après.
          </p>
          <div className="flex flex-wrap gap-2">
            {[["Cette journée", (t) => t.date === jour],
              ["Cette semaine", (t) => t.date >= iso(debutSem) && t.date <= iso(new Date(debutSem.getTime() + 6 * 86400000))],
              ["Tout le passé", (t) => t.date < auj()],
              ["Tout", () => true]].map(([l, f]) => {
              const lot = taches.filter(f);
              return (
                <button key={l} disabled={!lot.length}
                  onClick={() => { setCorbeille(lot); onMaj(taches.filter((t) => !lot.includes(t))); setPurge(false); }}
                  className="px-4 py-2.5 text-xs doux"
                  style={{ borderRadius: 999, fontWeight: 600,
                    background: lot.length ? NIV[1].doux : "transparent",
                    color: lot.length ? NIV[1].encre : "#3E5C7C",
                    border: `1px solid ${lot.length ? "transparent" : T.line}` }}>
                  {l} <span style={{ opacity: 0.75 }}>{lot.length}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {(corbeille || []).length > 0 && (
        <div className="flex items-center gap-3 mb-3 px-4 py-2.5 vue" style={{ background: T.accent, borderRadius: 14 }}>
          <span className="text-xs flex-1" style={{ color: "#fff", fontWeight: 600 }}>
            {(corbeille || []).length} créneau(x) effacé(s)
          </span>
          <button onClick={() => { onMaj([...taches, ...(corbeille || [])]); setCorbeille([]); }}
            className="text-xs px-3 py-1 doux"
            style={{ background: "rgba(255,255,255,0.24)", color: "#fff", borderRadius: 999, fontWeight: 700 }}>Rétablir</button>
          <button onClick={() => setCorbeille([])} className="text-xs" style={{ color: "#fff" }}>✕</button>
        </div>
      )}

      {modeles && (
        <div className="ombre mb-3 vue" style={{ background: T.card, borderRadius: 20, padding: "14px 16px" }}>
          <p className="text-xs mb-3" style={{ color: T.ink2, lineHeight: 1.7 }}>
            Un modèle pose les créneaux de la journée et y place automatiquement tes items les plus faibles.
            Il n'écrase jamais ce qui est déjà planifié.
          </p>
          <div className="grid grid-cols-2 gap-2 mb-3">
            {MODELES.map((m) => (
              <button key={m.id} onClick={() => appliquerModele(m)} className="text-left doux"
                style={{ background: T.paper, borderRadius: 16, padding: "12px 13px", border: `1px solid ${T.line}` }}>
                <span style={{ fontSize: 17, color: T.accent, display: "block", marginBottom: 3 }}>{m.ic}</span>
                <span className="block text-sm" style={{ fontWeight: 700 }}>{m.nom}</span>
                <span className="block text-xs mt-0.5" style={{ color: T.ink2, lineHeight: 1.4 }}>{m.sous}</span>
              </button>
            ))}
          </div>

          {duJour.length > 0 && (
            <>
              <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
                Copier cette journée vers
              </p>
              <div className="flex flex-wrap gap-2">
                {[["Demain", 1], ["Dans 2 j", 2], ["Dans 7 j", 7]].map(([l, n]) => (
                  <button key={l} onClick={() => {
                    const d = new Date(jour + "T12:00:00"); d.setDate(d.getDate() + n);
                    dupliquer(iso(d));
                  }} className="px-4 py-2 text-xs doux"
                    style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 600 }}>{l}</button>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {export_ && (
        <div className="ombre mb-3 vue" style={{ background: T.card, borderRadius: 20, padding: "14px 16px" }}>
          <p className="text-xs mb-3" style={{ color: T.ink2, lineHeight: 1.7 }}>
            Envoi ponctuel vers l'app Calendrier : les événements y restent sans limite de durée,
            mais ne se mettront pas à jour si tu modifies ton planning ici. Réexporte après une modification.
          </p>
          <div className="flex flex-wrap gap-2">
            {[["Ce jour", (t) => t.date === jour],
              ["7 jours", (t) => t.date >= jour && t.date <= iso(new Date(new Date(jour + "T12:00:00").getTime() + 6 * 86400000))],
              ["30 jours", (t) => t.date >= jour && t.date <= iso(new Date(new Date(jour + "T12:00:00").getTime() + 29 * 86400000))],
              ["Tout mon planning", () => true]].map(([l, f]) => {
              const lot = taches.map(normaliser).filter(f);
              return (
                <button key={l} disabled={!lot.length}
                  onClick={() => {
                    const blob = new Blob([versICS(lot, items, colleges)], { type: "text/calendar;charset=utf-8" });
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob); a.download = `edn-go-${l.toLowerCase().replace(/ /g, "-")}.ics`; a.click();
                    URL.revokeObjectURL(a.href);
                    setExport_(false);
                  }}
                  className="px-4 py-2.5 text-xs doux"
                  style={{
                    borderRadius: 999, fontWeight: 600,
                    background: lot.length ? T.accentPale : "transparent",
                    color: lot.length ? T.accent : "#3E5C7C",
                    border: `1px solid ${lot.length ? "transparent" : T.line}`,
                  }}>
                  {l} <span style={{ opacity: 0.7 }}>{lot.length}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      <div className="lg:flex lg:gap-4 lg:items-start">
      <div ref={zone} className="ombre lg:flex-1 lg:min-w-0" style={{ background: T.card, borderRadius: 22, overflow: "auto", maxHeight: "66vh" }}>
        <div style={{ position: "relative", height: 24 * HT + 14, paddingTop: 8 }}
          onPointerMove={bouger} onPointerUp={lacher} onPointerCancel={lacher}>

          {[...Array(25)].map((_, h) => (
            <div key={h} onClick={() => { setSelection(null); if (h < 24 && !occupe(h)) { setCreneau(h); setFin(h + 1); setTexte(""); } }}
              style={{
                position: "absolute", top: h * HT, left: 0, right: 0, height: h < 24 ? HT : 1,
                borderTop: `1px solid ${h % 6 === 0 ? "#3A5573" : "#1E3149"}`,
                cursor: h < 24 && !occupe(h) ? "pointer" : "default", display: "flex", alignItems: "flex-start",
              }}>
              <span style={{
                width: 52, paddingLeft: 14, marginTop: -7, fontSize: 11,
                color: h % 6 === 0 ? "#9DB3C8" : "#6E859E", fontWeight: h % 6 === 0 ? 800 : 600,
                background: "inherit",
              }}>
                {String(h % 24).padStart(2, "0")}:00
              </span>
            </div>
          ))}

          {place.map((t) => {
            const i = t.type === "item" ? items.find((x) => x.id === t.itemId) : null;
            const c = i ? colleges.find((x) => x.id === i.collegeId) : null;
            const b = BLOCS[(t.teinte ?? 0) % BLOCS.length];
            const actif = selection === t.id;
            const enCours = glisse && glisse.id === t.id;
            return (
              <div key={t.id}
                style={{
                  position: "absolute", top: t.debut * HT + 10,
                  left: `calc(58px + (100% - 68px) * ${t.col / t.nCols})`,
                  width: `calc((100% - 68px) / ${t.nCols} - 4px)`,
                  height: (t.duree || 1) * HT - 4, borderRadius: 14,
                  background: b.bg, borderLeft: `4px solid ${b.bar}`,
                  outline: actif ? `2px solid ${b.bar}` : "none",
                  opacity: t.fait ? 0.45 : 1, overflow: "hidden",
                  touchAction: "none", zIndex: enCours ? 4 : 2,
                  boxShadow: enCours ? "0 10px 28px rgba(0,0,0,0.5)" : "none",
                  transition: enCours ? "none" : "top 140ms ease, height 140ms ease, left 140ms ease, width 140ms ease",
                }}>
                <div onPointerDown={(e) => { setSelection(t.id); prendre(e, t, "debut"); }}
                  style={{ padding: "7px 10px", height: "100%", cursor: "grab" }}>
                  <span className="flex items-start gap-2">
                    <span onPointerDown={(e) => e.stopPropagation()}
                      onClick={(e) => {
                        e.stopPropagation();
                        const cocheMaintenant = !t.fait;
                        modifier(t.id, { fait: cocheMaintenant });
                        /* Cocher un cours ouvre le panneau de compréhension : on note
                           à chaud, sans avoir à aller dans la grille. */
                        if (cocheMaintenant && i) setNoter(t.id);
                      }}
                      className="shrink-0 flex items-center justify-center"
                      style={{ width: 20, height: 20, borderRadius: 999, marginTop: 1,
                        border: `2px solid ${t.fait ? b.bar : b.fg}`, background: t.fait ? b.bar : "transparent",
                        color: "#0E1A29", fontSize: 11, fontWeight: 800 }}>
                      {t.fait ? "✓" : ""}
                    </span>
                    <span className="min-w-0">
                      <span className="block" style={{ fontSize: 13.5, lineHeight: 1.35, color: b.fg, fontWeight: 600,
                        textDecoration: t.fait ? "line-through" : "none" }}>
                        {i ? `${i.numero}. ${i.titre}` : t.texte}
                      </span>
                      {i && (i.comp || 0) > 0 && (
                        <span className="inline-block mt-1 px-2 py-0.5" style={{
                          borderRadius: 999, fontSize: 10, fontWeight: 800,
                          background: NIVEAUX_C[Math.min(i.comp, 4)].bord, color: "#0E1A29" }}>
                          {NIVEAUX_C[Math.min(i.comp, 4)].nom}
                        </span>
                      )}
                      <span className="block text-xs mt-0.5" style={{ color: b.fg, opacity: 0.72 }}>
                        {t.debut}h – {t.debut + (t.duree || 1)}h{t.nCols === 1 && c ? ` · ${c.nom}` : ""}
                      </span>
                    </span>
                  </span>
                </div>

                {/* poignée d'étirement */}
                <div onPointerDown={(e) => prendre(e, t, "duree")}
                  style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: 18,
                    display: "flex", alignItems: "center", justifyContent: "center", cursor: "ns-resize" }}>
                  <span style={{ width: 46, height: 4, borderRadius: 999, background: b.bar, opacity: 0.85 }} />
                </div>

                {actif && (
                  <div className="flex gap-1" style={{ position: "absolute", top: 5, right: 6 }}>
                    {i && (
                      <button onClick={(e) => { e.stopPropagation(); onOuvrirItem(i.id); }}
                        className="text-xs px-2 py-1" style={{ borderRadius: 999, background: b.bar, color: "#0E1A29", fontWeight: 700 }}>
                        Ouvrir
                      </button>
                    )}
                    <button onClick={(e) => { e.stopPropagation(); reporter(t); }}
                      className="text-xs px-2 py-1" style={{ borderRadius: 999, background: "rgba(0,0,0,0.3)", color: b.fg }}>→</button>
                    <button onClick={(e) => { e.stopPropagation(); supprimer(t.id); }}
                      className="text-xs px-2 py-1" style={{ borderRadius: 999, background: "rgba(0,0,0,0.3)", color: b.fg }}>×</button>
                  </div>
                )}
              </div>
            );
          })}

          {/* saisie, posée exactement sur le créneau choisi */}
          {creneau !== null && (
            <div onClick={(e) => e.stopPropagation()}
              style={{
                position: "absolute", top: creneau * HT + 10, left: 58, right: 10, zIndex: 5,
                background: T.paper, borderRadius: 16, border: `2px solid ${T.accent}`, padding: "10px 12px",
                boxShadow: "0 10px 30px rgba(0,0,0,0.5)",
              }}>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-xs shrink-0" style={{ color: T.accent, fontWeight: 700 }}>
                  {String(creneau).padStart(2, "0")}:00
                </span>
                <span className="text-xs shrink-0" style={{ color: T.ink2 }}>→</span>
                <select value={fin} onChange={(e) => setFin(Number(e.target.value))}
                  className="text-xs px-2 py-1 shrink-0"
                  style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.accent, fontWeight: 700 }}>
                  {[...Array(24 - creneau)].map((_, k) => (
                    <option key={k} value={creneau + k + 1}>{String(creneau + k + 1).padStart(2, "0")}:00</option>
                  ))}
                </select>
                <div className="flex-1" />
                <button onClick={() => { setCreneau(null); setTexte(""); }} className="px-1 text-sm" style={{ color: T.ink2 }}>×</button>
              </div>

              <input autoFocus value={texte} onChange={(e) => setTexte(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter" && texte.trim()) ajouter("perso", null, texte.trim());
                  if (e.key === "Escape") { setCreneau(null); setTexte(""); }
                }}
                placeholder="Numéro d'item, mot-clé, ou autre chose…"
                className="w-full px-3 py-2 text-sm" style={{ borderRadius: 12, border: `1px solid ${T.line}` }} />

              {trouves.map((i) => {
                const c = colleges.find((x) => x.id === i.collegeId);
                const p = pal(c ? c.nom : "");
                return (
                  <button key={i.id} onClick={() => ajouter("item", i.id)}
                    className="w-full text-left flex items-center gap-2 doux mt-1"
                    style={{ background: T.card, borderRadius: 10, padding: "7px 9px" }}>
                    <span className="shrink-0 flex items-center justify-center"
                      style={{ width: 26, height: 26, borderRadius: 999, background: p.bg, color: p.fg, fontSize: 10, fontWeight: 700 }}>
                      {i.numero}
                    </span>
                    <span className="flex-1 min-w-0 text-xs truncate">{i.titre}</span>
                  </button>
                );
              })}
              {texte.trim() && (
                <button onClick={() => ajouter("perso", null, texte.trim())} className="text-xs mt-2 px-3 py-1.5 doux"
                  style={{ borderRadius: 999, background: T.accent, color: "#fff", fontWeight: 600 }}>
                  Ajouter tel quel
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      <div className="lg:w-72 lg:shrink-0 mt-4 lg:mt-0">
        {(() => {
          const tache = taches.find((t) => t.id === noter);
          const item = tache && items.find((x) => x.id === tache.itemId);
          if (!tache || !item) return null;
          const col = colleges.find((x) => x.id === item.collegeId);
          return (
            <div className="ombre vue mb-3" style={{ background: T.card, borderRadius: 22, padding: "16px 18px" }}>
              <div className="flex items-start gap-3 mb-3">
                <span className="flex-1 min-w-0">
                  <span className="block text-xs uppercase" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
                    Cours terminé
                  </span>
                  <span className="block text-sm mt-0.5" style={{ fontWeight: 600, lineHeight: 1.4 }}>
                    {item.numero}. {item.titre}
                  </span>
                  {col && <span className="block text-xs mt-0.5" style={{ color: pal(col.nom).fg }}>{col.nom}</span>}
                </span>
                <button onClick={() => setNoter(null)} className="text-sm px-2 shrink-0" style={{ color: T.ink2 }}>✕</button>
              </div>

              <p className="text-xs mb-2" style={{ color: T.ink2 }}>Comment l'as-tu compris ?</p>
              <div className="flex flex-wrap gap-2 mb-4">
                {[1, 2, 3, 4].map((k) => {
                  const N = NIVEAUX_C[k];
                  const actif = (item.comp || 0) === k;
                  return (
                    <button key={k} onClick={() => onComprendre && onComprendre(item.id, k)}
                      className="doux flex-1 py-2.5 px-2" style={{ minWidth: 92, borderRadius: 14,
                        background: actif ? N.bord : N.bg, color: actif ? "#0E1A29" : N.fg,
                        fontWeight: 700, fontSize: 12, border: `1px solid ${actif ? N.bord : "transparent"}` }}>
                      {N.nom}
                      <span className="block" style={{ fontSize: 10, fontWeight: 500, opacity: 0.85 }}>
                        revoir à J{N.jours}
                      </span>
                    </button>
                  );
                })}
              </div>

              <p className="text-xs mb-1.5" style={{ color: T.ink2 }}>Ce qu'il faut retenir</p>
              <textarea value={item.note || ""} onChange={(e) => onNote && onNote(item.id, e.target.value)}
                rows={3} placeholder="Points clés, pièges, ce qui t'a bloqué…"
                className="w-full p-3 text-sm" style={{ borderRadius: 14, border: `1px solid ${T.line}`,
                  background: T.paper, lineHeight: 1.6 }} />

              <div className="flex items-center gap-2 mt-3">
                <button onClick={() => { onOuvrirItem(item.id); setNoter(null); }}
                  className="text-xs px-3 py-1.5 doux" style={{ borderRadius: 999, color: T.accent }}>
                  Ouvrir l'item ›
                </button>
                <div className="flex-1" />
                <button onClick={() => setNoter(null)} className="text-xs px-4 py-1.5 doux"
                  style={{ borderRadius: 999, background: T.accent, color: "#fff", fontWeight: 700 }}>
                  Terminé
                </button>
              </div>
            </div>
          );
        })()}

        <ColonneRevisions items={items} colleges={colleges} jour={jour} taches={taches}
          onOuvrirItem={onOuvrirItem} onPoser={placerRevision} />
      </div>
      </div>

      <button onClick={() => {
        const faibles = items
          .map((i) => ({ i, dernier: i.dateComp || "0000-00-00", niv: i.comp || 0 }))
          .filter((x) => x.niv < 4)
          .sort((a, b) => a.niv - b.niv || String(a.dernier).localeCompare(String(b.dernier)))
          .slice(0, 10);
        if (!faibles.length) return;
        const base = new Date(jour + "T12:00:00");
        const nouvelles = [];
        faibles.forEach((x, k) => {
          const d = new Date(base); d.setDate(d.getDate() + Math.floor(k / 2));
          nouvelles.push({
            id: Math.random().toString(36).slice(2, 9), date: iso(d), type: "item",
            itemId: x.i.id, texte: "", debut: k % 2 ? 14 : 9, duree: 2, fait: false,
            teinte: (taches.length + k) % BLOCS.length,
          });
        });
        onMaj([...taches, ...nouvelles]);
      }} className="w-full py-3 mt-4 doux"
        style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600, fontSize: 13 }}>
        Remplir les 5 prochains jours avec mes items les plus faibles
      </button>

      <button onClick={() => setPurge(!purge)} className="w-full py-3 mt-2 doux"
        style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.bas, fontWeight: 600, fontSize: 13 }}>
        Effacer des créneaux…
      </button>

      <p className="text-xs mt-4" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Appuie sur un créneau libre pour le remplir, en choisissant l'heure de fin.
        Tire la petite barre en bas d'un bloc pour l'allonger ou le raccourcir, glisse le bloc pour le déplacer.
      </p>
    </div>
  );
}

/* ================== citation du jour ================== */
const CITATIONS = [
  "Un item par jour vaut mieux que dix items un dimanche de panique.",

async function demanderIA(systeme, message, maxJetons = 4000) {
  const cle = litCle();
  if (!cle) throw new Error("PAS_DE_CLE");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json", "x-api-key": cle,
      "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: maxJetons, system: systeme,
      messages: [{ role: "user", content: message }],
    }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message || "Réponse refusée");
  return (d.content || []).filter((x) => x.type === "text").map((x) => x.text).join("\n");
}

function extraireJson(txt) {
  let t = (txt || "").trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
  const d = t.search(/[\[{]/);
  if (d > 0) t = t.slice(d);
  const f = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}"));
  if (f > -1) t = t.slice(0, f + 1);
  return JSON.parse(t);
}

/* ================== le Rattrapage ================== */
const CLE_RATTRAPAGE = "edngo-rattrapage";
const JOURS_RATTRAPAGE = [2, 5];

function rattrapageDu() {
  const j = new Date().getDay();
  return JOURS_RATTRAPAGE.includes(j === 0 ? 7 : j);
}
function dernierRattrapage() { try { return localStorage.getItem(CLE_RATTRAPAGE) || ""; } catch (e) { return ""; } }
function noterRattrapage() { try { localStorage.setItem(CLE_RATTRAPAGE, auj()); } catch (e) {} }

function construireRattrapage(items, colleges, cartes, qcms, resultats, taille = 30) {
  const exos = [
    ...cartes.map((c) => ({ ...c, genre: "carte" })),
    ...qcms.map((c) => ({ ...c, genre: "qcm" })),
  ];
  const parItem = {};
  items.forEach((i) => (parItem[i.id] = i));

  const note = (e) => {
    const h = resultats.filter((r) => r.exoId === e.id);
    const it = parItem[e.itemId];
    if (!it) return -1;
    const rates = h.filter((r) => r.valeur < 1).length;
    const taux = h.length ? h.reduce((s, r) => s + r.valeur, 0) / h.length : null;
    const et = etatRevision(e.id, resultats);
    let p = 0;
    if (rates) p += 40 + rates * 12;
    if (taux !== null && taux < 0.5) p += 30;
    else if (taux !== null && taux < 0.8) p += 15;
    if (!et.neuf && et.du <= auj()) p += 20;
    if ((it.niveau || 0) === 1) p += 25;
    else if ((it.niveau || 0) === 2) p += 10;
    if (h.length === 0) p += 3;
    return p;
  };

  const classes = exos.map((e) => ({ e, p: note(e), col: parItem[e.itemId] ? parItem[e.itemId].collegeId : null }))
    .filter((x) => x.p >= 0).sort((a, b) => b.p - a.p);

  const paniers = {};
  classes.forEach((x) => { (paniers[x.col] = paniers[x.col] || []).push(x.e); });
  const cles = Object.keys(paniers);
  const sortie = [];
  let k = 0;
  while (sortie.length < taille && cles.some((c) => paniers[c].length)) {
    const c = cles[k % cles.length];
    if (paniers[c].length) sortie.push(paniers[c].shift());
    k++;
  }
  return sortie;
}

/* ================== répétition espacée ==================
   Intervalles inspirés de SM-2, simplifiés : ce qui compte est
   que l'écart grandisse à chaque réussite et retombe à l'échec. */
const PALIERS = [0, 1, 3, 7, 16, 35, 70];

function prochaineEcheance(niv, date) {
  const d = new Date((date || auj()) + "T12:00:00");
  d.setDate(d.getDate() + PALIERS[Math.min(niv, PALIERS.length - 1)]);
  return iso(d);
}

/* état de révision d'un exercice, calculé depuis l'historique */
function etatRevision(id, resultats) {
  const h = resultats.filter((r) => r.exoId === id).sort((a, b) => a.t - b.t);
  if (!h.length) return { niveau: 0, du: auj(), neuf: true };
  let niv = 0;
  h.forEach((r) => { niv = r.valeur >= 1 ? niv + 1 : Math.max(0, niv - 1); });
  return { niveau: niv, du: prochaineEcheance(niv, h[h.length - 1].date), neuf: false };
}

function aReviser(exos, resultats) {
  const today = auj();
  const du = [], neufs = [];
  exos.forEach((e) => {
    const s = etatRevision(e.id, resultats);
    if (s.neuf) neufs.push({ ...e, etat: s });
    else if (s.du <= today) du.push({ ...e, etat: s });
  });
  du.sort((a, b) => a.etat.niveau - b.etat.niveau);
  return { du, neufs };
}

function Chrono({ depart, limite }) {
  const [s, setS] = useState(0);
  useEffect(() => {
    const i = setInterval(() => setS(Math.floor((Date.now() - depart) / 1000)), 1000);
    return () => clearInterval(i);
  }, [depart]);
  const m = Math.floor(s / 60);
  const depasse = limite && s > limite;
  return (
    <span className="text-xs" style={{ fontWeight: 700, color: depasse ? T.bas : T.ink2 }}>
      {String(m).padStart(2, "0")}:{String(s % 60).padStart(2, "0")}
    </span>
  );
}

  return (
    <div>
      <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>Dossiers progressifs</h2>
      <p className="text-xs mb-5" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Le format réel de l'épreuve : un cas qui se déroule, où chaque question fait avancer l'histoire.
      </p>

      {dossiers.map((x) => (
        <button key={x.id} onClick={() => setOuvert(x.id)} className="w-full text-left mb-2 flex items-center gap-3 doux"
          style={{ background: T.card, borderRadius: 18, padding: "14px 16px", border: `1px solid ${T.line}` }}>
          <span className="flex-1 min-w-0">
            <span className="block text-sm" style={{ fontWeight: 600 }}>{x.titre}</span>
            <span className="block text-xs mt-1" style={{ color: T.ink2 }}>{x.college} · {x.questions.length} questions</span>
          </span>
          <span style={{ color: T.accent, fontSize: 18 }}>›</span>
        </button>
      ))}

      <div className="ombre mt-4" style={{ background: T.card, borderRadius: 22, padding: "18px 20px" }}>
        <p className="text-sm mb-2" style={{ fontWeight: 600 }}>Créer un dossier avec une IA</p>
        <textarea readOnly value={prompt} rows={5} onFocus={(e) => e.target.select()}
          className="w-full p-3 text-xs mb-2"
          style={{ borderRadius: 14, border: `1px solid ${T.line}`, background: "#132436", color: T.ink2, lineHeight: 1.5 }} />
        <button onClick={() => { navigator.clipboard.writeText(prompt); setEtat("Prompt copié."); setTimeout(() => setEtat(null), 2000); }}
          className="px-4 py-2 text-xs doux mb-3"
          style={{ background: T.accent, color: "#fff", borderRadius: 999, fontWeight: 600 }}>Copier le prompt</button>
        <textarea value={colle} onChange={(e) => setColle(e.target.value)} rows={3}
          placeholder="Colle ici le JSON du dossier" className="w-full p-3 text-xs mb-2"
          style={{ borderRadius: 14, border: `1px solid ${T.line}` }} />
        <button onClick={importer} disabled={!colle.trim()} className="px-4 py-2 text-xs doux"
          style={{ background: colle.trim() ? T.ink : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
          Ajouter le dossier
        </button>
        {etat && <p className="text-xs mt-2" style={{ color: T.accent }}>{etat}</p>}
      </div>
    </div>
  );
}

/* passage d'un dossier, question après question */
function SessionDossier({ dossier, onNoter, onFin }) {
  const [n, setN] = useState(0);
  const [choix, setChoix] = useState([]);
  const [corrige, setCorrige] = useState(false);
  const [score, setScore] = useState(0);
  const [depart] = useState(Date.now());
  const [voirEnonce, setVoirEnonce] = useState(false);

  const q = dossier.questions[n];
  if (!q) return null;
  const ordre = propsMelangees(q, n, depart);
  const juste = ordre.every((p, i) => p.vrai === choix.includes(i));

  return (
    <div>
      <div className="flex items-center gap-3 mb-3">
        <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
          <div className="doux h-1.5 rounded-full"
            style={{ width: ((n + (corrige ? 1 : 0)) / dossier.questions.length) * 100 + "%", background: T.accent }} />
        </div>
        <Chrono depart={depart} />
        <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{dossier.questions.length}</span>
        <button onClick={onFin} className="text-xs" style={{ color: T.ink2 }}>✕</button>
      </div>

      <button onClick={() => setVoirEnonce(!voirEnonce)} className="text-xs mb-3" style={{ color: T.accent, fontWeight: 600 }}>
        {voirEnonce ? "Masquer l'énoncé" : "Revoir l'énoncé du cas"}
      </button>
      {voirEnonce && (
        <div className="mb-3" style={{ background: T.card, borderRadius: 18, padding: "14px 16px" }}>
          <p style={{ fontFamily: lecture, fontSize: 15.5, lineHeight: 1.7, color: "#D6E4F1" }}>{dossier.enonce}</p>
        </div>
      )}

      {q.contexte && (
        <div className="mb-3" style={{ background: T.accentPale, borderRadius: 16, padding: "12px 15px" }}>
          <p className="text-xs mb-1" style={{ color: T.accent, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em" }}>
            Évolution
          </p>
          <p style={{ fontFamily: lecture, fontSize: 15.5, lineHeight: 1.65, color: "#D6E4F1" }}>{q.contexte}</p>
        </div>
      )}

      <p className="mb-4" style={{ fontSize: 16, lineHeight: 1.55, fontWeight: 500 }}>{q.enonce}</p>

      {ordre.map((p, i) => (
        <Proposition key={i} p={p} i={i} choisi={choix.includes(i)} corrige={corrige}
          onClic={() => setChoix((l) => l.includes(i) ? l.filter((x) => x !== i) : [...l, i])} />
      ))}

      {corrige && <Correction juste={juste} texte={q.explication} props={ordre} choix={choix} />}

      <div className="mt-5">
        {!corrige ? (
          <button onClick={() => { setCorrige(true); if (juste) setScore((s) => s + 1); onNoter(juste ? 1 : 0); }}
            disabled={!choix.length} className="w-full py-3.5 text-sm doux"
            style={{ background: choix.length ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
            Valider
          </button>
        ) : (
          <button onClick={() => {
            if (n + 1 >= dossier.questions.length) return onFin(score + (juste ? 0 : 0));
            setN(n + 1); setChoix([]); setCorrige(false);
          }} className="w-full py-3.5 text-sm doux"
            style={{ background: T.ink, color: "#fff", borderRadius: 999, fontWeight: 600 }}>
            {n + 1 >= dossier.questions.length ? `Terminer — ${score}/${dossier.questions.length}` : "Question suivante"}
          </button>
        )}
      </div>
    </div>
  );
}

/* ================== horloge ================== */
const CLE_CHRONO = "edngo-chrono";

/* Un volet par chiffre : le nouveau chiffre bascule par-dessus l'ancien,
   comme sur un afficheur mécanique. */
function Volet({ valeur }) {
  const [affiche, setAffiche] = useState(valeur);
  const [sortant, setSortant] = useState(null);

  useEffect(() => {
    if (valeur === affiche) return;
    setSortant(affiche);
    setAffiche(valeur);
    const t = setTimeout(() => setSortant(null), 420);
    return () => clearTimeout(t);
  }, [valeur]);

  const base = {
    position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
    fontFamily: serif, fontWeight: 700, color: T.ink, background: "#17293E",
    borderRadius: 14, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden",
  };

  return (
    <span style={{
      position: "relative", display: "inline-block", width: "1.05em", height: "1.5em",
      perspective: 400, margin: "0 2px",
    }}>
      {sortant !== null && (
        <span style={{ ...base, animation: "voletSort 420ms cubic-bezier(0.4,0,0.6,1) forwards", zIndex: 2 }}>
          {sortant}
        </span>
      )}
      <span style={{ ...base, animation: sortant !== null ? "voletEntre 420ms cubic-bezier(0.4,0,0.6,1)" : "none" }}>
        {affiche}
      </span>
      <span style={{
        position: "absolute", left: 4, right: 4, top: "50%", height: 1,
        background: "rgba(0,0,0,0.35)", zIndex: 3, pointerEvents: "none",
      }} />
    </span>
  );
}

function Afficheur({ texte, taille }) {
  return (
    <div className="flex items-center justify-center" style={{ fontSize: taille, lineHeight: 1 }}>
      {texte.split("").map((c, i) =>
        c === ":"
          ? <span key={i} style={{ color: T.ink2, margin: "0 4px", fontFamily: serif, fontWeight: 700 }}>:</span>
          : <Volet key={i} valeur={c} />
      )}
    </div>
  );
}

function Horloge() {
  const [duree, setDuree] = useState(120 * 60);
  const [reste, setReste] = useState(120 * 60);
  const [marche, setMarche] = useState(false);
  const [plein, setPlein] = useState(false);
  const [mode, setMode] = useState("minuteur");
  const [ecoule, setEcoule] = useState(0);
  const [perso, setPerso] = useState("");
  const [tours, setTours] = useState([]);
  const tic = useRef(null);

  useEffect(() => {
    try {
      const d = JSON.parse(localStorage.getItem(CLE_CHRONO) || "null");
      if (d && d.fin && d.fin > Date.now()) {
        setDuree(d.duree); setReste(Math.round((d.fin - Date.now()) / 1000)); setMarche(true);
      }
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (!marche) return;
    tic.current = setInterval(() => {
      if (mode === "minuteur") {
        setReste((r) => {
          if (r <= 1) { setMarche(false); try { localStorage.removeItem(CLE_CHRONO); } catch (e) {} return 0; }
          return r - 1;
        });
      } else setEcoule((e) => e + 1);
    }, 1000);
    return () => clearInterval(tic.current);
  }, [marche, mode]);

  const lancer = () => {
    if (mode === "minuteur") {
      try { localStorage.setItem(CLE_CHRONO, JSON.stringify({ duree, fin: Date.now() + reste * 1000 })); } catch (e) {}
    }
    setMarche(true);
  };
  const pause = () => { setMarche(false); try { localStorage.removeItem(CLE_CHRONO); } catch (e) {} };
  const remettre = () => { pause(); setReste(duree); setEcoule(0); setTours([]); };
  const choisir = (s) => { pause(); setDuree(s); setReste(s); };

  const v = mode === "minuteur" ? reste : ecoule;
  const hh = Math.floor(v / 3600), mm = Math.floor((v % 3600) / 60), ss = v % 60;
  const texte = hh > 0
    ? `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`
    : `${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  const part = mode === "minuteur" && duree ? reste / duree : 0;
  const fini = mode === "minuteur" && reste === 0;

  const Boutons = ({ grand }) => (
    <div className="flex items-center gap-3">
      <button onClick={marche ? pause : lancer} className="doux"
        style={{ background: marche ? T.card : T.accent, color: marche ? T.ink : "#fff",
          borderRadius: 999, fontWeight: 700, fontSize: grand ? 17 : 15,
          padding: grand ? "16px 44px" : "13px 32px", border: `1px solid ${marche ? T.line : T.accent}` }}>
        {marche ? "Pause" : reste === duree && !ecoule ? "Démarrer" : "Reprendre"}
      </button>
      {mode === "chrono" && marche && (
        <button onClick={() => setTours((l) => [ecoule, ...l].slice(0, 12))} className="doux"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2, fontWeight: 600,
            padding: grand ? "16px 26px" : "13px 20px" }}>Tour</button>
      )}
      <button onClick={remettre} className="doux"
        style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2, fontWeight: 600,
          padding: grand ? "16px 26px" : "13px 20px" }}>Zéro</button>
    </div>
  );

  if (plein) {
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 70, background: T.paper,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 30 }}>
        <div style={{ width: "min(78vw, 520px)" }}>
          <div className="h-1.5 rounded-full mb-8" style={{ background: "#1E3149" }}>
            <div className="h-1.5 rounded-full" style={{ width: part * 100 + "%",
              background: fini ? T.bas : T.accent, transition: "width 900ms linear" }} />
          </div>
        </div>
        <Afficheur texte={texte} taille="clamp(58px, 15vw, 132px)" />
        <p className="text-sm" style={{ color: fini ? T.bas : T.ink2, fontWeight: 700, letterSpacing: "0.14em" }}>
          {fini ? "TEMPS ÉCOULÉ" : mode === "minuteur" ? "MINUTEUR" : "CHRONOMÈTRE"}
        </p>
        <Boutons grand />
        <button onClick={() => setPlein(false)} className="text-sm" style={{ color: T.ink2 }}>Réduire</button>
      </div>
    );
  }

  return (
    <div>
      <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>Horloge</h2>
      <p className="text-xs mb-5" style={{ color: T.ink2 }}>
        Le décompte continue si tu changes d'onglet ou si tu fermes la page.
      </p>

      <div className="flex gap-2 mb-4">
        {[["minuteur", "Minuteur"], ["chrono", "Chronomètre"]].map(([x, l]) => (
          <button key={x} onClick={() => { pause(); setMode(x); setEcoule(0); setReste(duree); setTours([]); }}
            className="flex-1 py-3 doux"
            style={{ borderRadius: 999, fontWeight: 700,
              background: mode === x ? T.accent : T.accentPale, color: mode === x ? "#fff" : T.accent }}>{l}</button>
        ))}
      </div>

      <div className="ombre flex flex-col items-center gap-6"
        style={{ background: T.card, borderRadius: 26, padding: "30px 20px 26px" }}>
        {mode === "minuteur" && (
          <div className="w-full h-1.5 rounded-full" style={{ background: "#1E3149" }}>
            <div className="h-1.5 rounded-full" style={{ width: part * 100 + "%",
              background: fini ? T.bas : T.accent, transition: "width 900ms linear" }} />
          </div>
        )}
        <Afficheur texte={texte} taille="clamp(46px, 12vw, 86px)" />
        <Boutons />
        <button onClick={() => setPlein(true)} className="text-xs px-5 py-2 doux"
          style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 700 }}>
          Plein écran
        </button>
      </div>

      {mode === "chrono" && tours.length > 0 && (
        <div className="ombre mt-4" style={{ background: T.card, borderRadius: 20, padding: "14px 16px" }}>
          <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Tours</p>
          {tours.map((t, k) => (
            <div key={k} className="flex justify-between text-sm py-1.5"
              style={{ borderBottom: k < tours.length - 1 ? `1px solid ${T.line}` : "none" }}>
              <span style={{ color: T.ink2 }}>Tour {tours.length - k}</span>
              <span style={{ fontWeight: 700 }}>
                {String(Math.floor(t / 60)).padStart(2, "0")}:{String(t % 60).padStart(2, "0")}
              </span>
            </div>
          ))}
        </div>
      )}

      {mode === "minuteur" && (
        <>
          <p className="text-xs uppercase mt-6 mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Durées</p>
          <div className="flex flex-wrap gap-2 mb-3">
            {[["25 min", 25], ["45 min", 45], ["1 h", 60], ["1 h 30", 90], ["2 h", 120], ["3 h", 180]].map(([l, m]) => (
              <button key={l} onClick={() => choisir(m * 60)} className="px-4 py-2.5 text-xs doux"
                style={{ borderRadius: 999, fontWeight: 600,
                  background: duree === m * 60 ? T.accent : T.card, color: duree === m * 60 ? "#fff" : T.ink,
                  border: `1px solid ${duree === m * 60 ? T.accent : T.line}` }}>{l}</button>
            ))}
          </div>
          <div className="flex gap-2">
            <input value={perso} onChange={(e) => setPerso(e.target.value.replace(/\D/g, ""))}
              placeholder="Durée en minutes" inputMode="numeric"
              className="flex-1 px-3 py-2.5 text-sm" style={{ borderRadius: 999, border: `1px solid ${T.line}` }} />
            <button onClick={() => { const m = parseInt(perso, 10); if (m > 0) { choisir(m * 60); setPerso(""); } }}
              disabled={!perso} className="px-5 py-2.5 text-sm doux"
              style={{ borderRadius: 999, background: perso ? T.accent : "#24384F", color: "#fff", fontWeight: 600 }}>
              Régler
            </button>
          </div>
        </>
      )}

      <p className="text-xs mt-6" style={{ color: T.ink2, lineHeight: 1.7 }}>
        Pour un accès rapide : Safari, bouton Partager, « Sur l'écran d'accueil ».
        EDN Go se lance alors en plein écran comme une application.
      </p>
    </div>
  );
}

/* ================== statistiques ================== */
function Stats({ items, colleges, resultats, cartes, qcms }) {
  const [periode, setPeriode] = useState(30);
  const [ouvert, setOuvert] = useState(null);

  const depuis_ = new Date(Date.now() - periode * 86400000).toISOString().slice(0, 10);
  const R = resultats.filter((r) => r.date >= depuis_);
  const sec = (l) => Math.round(l.reduce((s, r) => s + Math.min(r.ms || 0, 300000), 0) / 1000);
  const taux = (l) => l.length ? Math.round(l.reduce((s, x) => s + x.valeur, 0) / l.length * 100) : null;
  const duree = (s) => {
    if (!s) return "0 min";
    const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    return h ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`;
  };

  const stats = colleges.map((c) => {
    const its = items.filter((i) => i.collegeId === c.id);
    const ids = its.map((i) => i.id);
    const l = R.filter((r) => ids.includes(r.itemId));
    const exos = [...cartes, ...qcms].filter((x) => ids.includes(x.itemId));
    return {
      c, its, l, sec: sec(l), taux: taux(l), n: l.length,
      justes: l.filter((r) => r.valeur >= 1).length,
      rates: l.filter((r) => r.valeur < 1).length,
      exos: exos.length,
      testes: new Set(l.map((r) => r.itemId)).size,
      acquis: its.filter((i) => (i.comp || 0) === 4).length,
      avance: its.length ? Math.round(its.reduce((s, i) => s + (i.comp || 0) / 4, 0) / its.length * 100) : 0,
    };
  }).filter((x) => x.exos > 0 || x.n > 0 || x.its.some((i) => i.comp));

  const totalSec = sec(R);
  const maxSec = Math.max(1, ...stats.map((x) => x.sec));

  /* courbe des 14 derniers jours d'activité */
  const jours14 = [...Array(14)].map((_, k) => {
    const d = new Date(Date.now() - (13 - k) * 86400000).toISOString().slice(0, 10);
    const l = resultats.filter((r) => r.date === d);
    return { d, n: l.length, sec: sec(l), taux: taux(l) };
  });
  const maxJ = Math.max(1, ...jours14.map((j) => j.sec));

  const Carte = ({ titre, valeur, sous, coul }) => (
    <div style={{ background: T.card, borderRadius: 18, padding: "13px 15px", flex: "1 1 130px" }}>
      <p className="text-xs uppercase" style={{ letterSpacing: "0.09em", color: T.ink2 }}>{titre}</p>
      <p style={{ fontFamily: serif, fontSize: 25, lineHeight: 1.2, color: coul || T.ink }}>{valeur}</p>
      {sous && <p className="text-xs" style={{ color: T.ink2 }}>{sous}</p>}
    </div>
  );

  return (
    <div>
      <h2 className="mb-1" style={{ fontFamily: serif, fontSize: 26 }}>Statistiques</h2>
      <p className="text-xs mb-4" style={{ color: T.ink2 }}>Appuie sur un collège pour le détail item par item.</p>

      <div className="flex gap-2 mb-4 flex-wrap">
        {[7, 30, 90, 3650].map((p) => (
          <button key={p} onClick={() => setPeriode(p)} className="px-4 py-2 text-xs doux"
            style={{ borderRadius: 999, fontWeight: 600,
              background: periode === p ? T.accent : "transparent", color: periode === p ? "#fff" : T.ink2,
              border: `1px solid ${periode === p ? T.accent : T.line}` }}>
            {p === 3650 ? "Tout" : p + " j"}
          </button>
        ))}
      </div>

      <div className="flex flex-wrap gap-2.5 mb-5">
        <Carte titre="Temps" valeur={duree(totalSec)} sous={`${[...new Set(R.map((r) => r.date))].length} jour(s)`} />
        <Carte titre="Réponses" valeur={R.length} sous={`${R.filter((r) => r.valeur >= 1).length} justes`} />
        <Carte titre="Réussite" valeur={taux(R) === null ? "—" : taux(R) + " %"} coul={couleur(taux(R))} />
        <Carte titre="Erreurs" valeur={R.filter((r) => r.valeur < 1).length} coul={T.bas} sous="à retravailler" />
      </div>

      {/* activité des 14 derniers jours */}
      <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>
        Ces deux semaines
      </p>
      <div className="ombre mb-5" style={{ background: T.card, borderRadius: 20, padding: "16px 16px 12px" }}>
        <div className="flex items-end gap-1.5" style={{ height: 96 }}>
          {jours14.map((j, k) => (
            <div key={k} className="flex-1 flex flex-col items-center justify-end" style={{ height: "100%" }}>
              {j.sec > 0 && (
                <span className="text-xs mb-1" style={{ color: T.ink2, fontSize: 9 }}>
                  {Math.round(j.sec / 60)}
                </span>
              )}
              <div className="doux w-full" style={{
                height: Math.max(j.sec > 0 ? 6 : 2, (j.sec / maxJ) * 70),
                background: j.sec > 0 ? couleur(j.taux) : "#1E3149",
                borderRadius: 6,
              }} />
              <span style={{ fontSize: 9, color: T.ink2, marginTop: 4 }}>
                {new Date(j.d + "T12:00:00").getDate()}
              </span>
            </div>
          ))}
        </div>
        <p className="text-xs mt-2" style={{ color: T.ink2 }}>
          Hauteur : minutes travaillées. Couleur : taux de réussite du jour.
        </p>
      </div>

      {/* par collège */}
      <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Par collège</p>
      {stats.length === 0 ? (
        <p className="text-sm py-6" style={{ color: T.ink2, lineHeight: 1.7 }}>
          Aucune donnée. Colore des items dans la grille ou lance une séance de QCM.
        </p>
      ) : stats.sort((a, b) => b.sec - a.sec).map((x) => {
        const p = pal(x.c.nom);
        const on = ouvert === x.c.id;
        return (
          <div key={x.c.id} className="mb-2.5 ombre" style={{ background: T.card, borderRadius: 20, overflow: "hidden" }}>
            <button onClick={() => setOuvert(on ? null : x.c.id)} className="w-full text-left"
              style={{ padding: "14px 16px" }}>

                <div className="flex flex-wrap gap-1.5 mb-3">

                    const nExos = [...cartes, ...qcms].filter((e) => e.itemId === i.id).length;
                    if (!h.length && !nExos && !(i.comp || 0)) return null;
                    const N = NIVEAUX_C[Math.min(i.comp || 0, 4)];

              </div>
            )}
