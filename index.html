<script>
window.storage = {
  async get(k) { const v = localStorage.getItem(k); if (v === null) throw new Error("absent"); return { key: k, value: v }; },
  async set(k, v) { localStorage.setItem(k, v); return { key: k, value: v }; },
};
window.addEventListener("error", function (e) {
  var r = document.getElementById("root");
  if (r && !r.dataset.ok) {
    var d = e.message || String(e);
    if (e.error && e.error.message) d = e.error.message;
    if (e.filename) d += " (" + e.filename.split("/").pop() + " ligne " + e.lineno + ")";
    r.innerHTML = '<div id="ecran"><div style="max-width:520px"><p style="color:#E4685D"><b>EDN Go n\'a pas pu demarrer.</b></p>'
      + '<p style="font-size:13px">' + d + '</p>'
      + '<p style="font-size:12px;margin-top:14px">Si le message dit seulement « Script error », ouvre la page depuis '
      + 'ed-ngo.vercel.app plutot qu\'en double-cliquant le fichier : Safari masque les erreurs des fichiers locaux.</p></div></div>';
  }
});

/* ============ score : calculé, jamais déclaré ============ */
function scoreItem(itemId, resultats) {
  const r = resultats.filter((x) => x.itemId === itemId).slice(-20);
  if (!r.length) return null;
  const somme = r.reduce((s, x) => s + x.valeur, 0);
  return Math.round((somme / r.length) * 100);
}
function couleur(score) {
  if (score === null) return T.neutre;
  if (score < 50) return T.bas;
  if (score < 80) return T.moyen;
  return T.haut;
}

/* mélange deux couleurs hexadécimales, t entre 0 et 1 */
function melange(a, b, t) {
  const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
  const m = (x, y) => Math.round(y + (x - y) * t).toString(16).padStart(2, "0");
  return `#${m(r1, r2)}${m(g1, g2)}${m(b1, b2)}`;
}

function pointsECG(variante, largeur = 620, ligne = 62) {
  const P = [];
  const push = (x, y) => P.push([x, y]);
  let x = 4;
  const cfg = {
    normal:   { rr: 78, p: 6, pr: 12, q: 3, r: 30, s: 6, st: 0, t: 8, qrs: 9, tNeg: false },
    stemi:    { rr: 78, p: 6, pr: 12, q: 6, r: 22, s: 3, st: 14, t: 10, qrs: 10, tNeg: false },
    ischemie: { rr: 78, p: 6, pr: 12, q: 3, r: 28, s: 5, st: -8, t: 9, qrs: 9, tNeg: true },
    fa:       { rr: 0,  p: 0, pr: 10, q: 3, r: 28, s: 5, st: 0, t: 7, qrs: 9, tNeg: false },
    bav3:     { rr: 130, p: 6, pr: 10, q: 3, r: 26, s: 5, st: 0, t: 7, qrs: 16, tNeg: false },
    hyperk:   { rr: 90, p: 0, pr: 14, q: 3, r: 24, s: 5, st: 0, t: 26, qrs: 20, tNeg: false },
  }[variante] || {};

  const rrs = [];
  if (variante === "fa") {
    const irr = [58, 92, 66, 108, 74, 84, 62, 96, 70];
    let i = 0; while (x < largeur) { rrs.push(irr[i % irr.length]); x += irr[i % irr.length]; i++; }
  } else {
    let n = Math.ceil(largeur / cfg.rr); for (let i = 0; i < n; i++) rrs.push(cfg.rr);
  }

  x = 4; push(x, ligne);
  rrs.forEach((rr) => {
    if (x > largeur) return;
    // onde P
    if (cfg.p > 0) {
      push(x + 6, ligne); push(x + 12, ligne - cfg.p); push(x + 18, ligne);
      x += cfg.pr + 18;
    } else if (variante === "fa") {
      // trémulation de la ligne de base
      for (let k = 0; k < 4; k++) push(x + k * 4, ligne + (k % 2 ? -2 : 2));
      x += 16;
    } else { x += cfg.pr; }
    push(x, ligne);
    // QRS
    const u = cfg.qrs / 3;
    push(x + u, ligne + cfg.q);
    push(x + 2 * u, ligne - cfg.r);
    push(x + 3 * u, ligne + cfg.s);
    x += cfg.qrs;
    push(x, ligne - cfg.st);
    // segment ST
    push(x + 10, ligne - cfg.st);
    x += 10;
    // onde T
    const h = cfg.tNeg ? -cfg.t : cfg.t;
    push(x + 8, ligne - cfg.st - h);
    push(x + 16, ligne);
    x += 16;
    push(x + Math.max(6, rr - 60), ligne);
    x += Math.max(6, rr - 60);
  });
  return P.filter(([px]) => px <= largeur).map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join(" ");
}

              <rect width="30" height="30" fill={`url(#p1${variante})`} />
              <path d="M30 0 L0 0 0 30" fill="none" stroke="#A83C48" strokeOpacity="0.42" strokeWidth="1" />

      {legende && (
        <figcaption className="text-xs mt-2" style={{ color: T.ink2, lineHeight: 1.6 }}>{legende}</figcaption>
      )}

const COURS_INIT = [
  {
    id: "ecg",
    titre: "Lire un ECG",
    famille: "Examens complémentaires",
    contenu: `## À quoi sert un ECG
L'électrocardiogramme enregistre, depuis la peau, les variations de potentiel produites par la dépolarisation et la repolarisation du myocarde. Il ne mesure ni la contraction, ni le débit : un cœur peut avoir un tracé parfait et ne rien éjecter. Retenir cette limite évite beaucoup de contresens.

## Le trajet normal de l'influx
Le nœud sinusal, dans l'oreillette droite, impose le rythme. L'influx dépolarise les oreillettes, ce qui donne l'onde P. Il est ensuite freiné dans le nœud auriculo-ventriculaire — ce délai physiologique laisse aux oreillettes le temps de se vider, et c'est lui qu'on mesure avec l'intervalle PR. Puis il descend par le faisceau de His, ses deux branches et le réseau de Purkinje, dépolarisant les ventricules très vite : c'est le QRS, étroit parce que rapide. La repolarisation ventriculaire donne l'onde T.

Deux conséquences immédiates : un QRS large signifie que l'influx n'a pas emprunté le chemin rapide, et une onde P absente signifie que le rythme ne vient pas du nœud sinusal.

## Le papier
Vitesse standard 25 mm/s, étalonnage 10 mm pour 1 mV. Un petit carreau vaut donc 0,04 s en largeur et 0,1 mV en hauteur, un grand carreau 0,20 s et 0,5 mV. Vérifie toujours ces deux réglages avant d'interpréter : sur un tracé à 50 mm/s, tous les intervalles paraissent doublés.

## Les douze dérivations et ce qu'elles regardent
Six dérivations frontales, obtenues avec les électrodes des membres : DI, DII, DIII, aVR, aVL, aVF. Six dérivations précordiales, sur le thorax : V1 à V6.

Chaque dérivation est un point de vue. Une onde est positive quand l'influx s'en approche, négative quand il s'en éloigne.
- DII, DIII, aVF regardent la face inférieure
- DI et aVL regardent la face latérale haute
- V1, V2 regardent le septum
- V3, V4 la face antérieure et l'apex
- V5, V6 la face latérale basse
- aVR regarde le cœur « de l'extérieur » : tout y est normalement négatif

En pratique, les dérivations ne sont pas lues une par une mais par groupes : deux dérivations contiguës qui bougent ensemble désignent un territoire.

## Le tracé normal
[[fig:normal|Rythme sinusal régulier : une onde P avant chaque QRS, PR constant, QRS fins, segment ST sur la ligne de base, onde T positive et asymétrique.]]

## La méthode, toujours dans le même ordre
Ne jamais commencer par ce qui saute aux yeux : on rate le reste. L'ordre qui protège :
- Rythme : sinusal ou non
- Fréquence
- Axe
- Onde P et intervalle PR
- QRS : durée, amplitude, ondes Q
- Segment ST
- Onde T et intervalle QT
- Conclusion, comparée à un tracé antérieur si tu en as un

## Étape 1 — le rythme
Il est sinusal si trois conditions sont réunies : une onde P précède chaque QRS, cette P est positive en DII et négative en aVR, et le PR est constant. Si les P manquent, cherche une fibrillation ou un flutter. Si les P existent mais sans lien avec les QRS, pense au bloc complet.

## Étape 2 — la fréquence
Divise 300 par le nombre de grands carreaux entre deux QRS : un carreau donne 300/min, deux 150, trois 100, quatre 75, cinq 60, six 50. Si le rythme est irrégulier, compte les QRS sur six secondes — soit trente grands carreaux — et multiplie par dix.

Bradycardie sous 60, tachycardie au-dessus de 100.

## Étape 3 — l'axe
L'axe est la direction moyenne de la dépolarisation ventriculaire, normalement entre -30° et +90°. Méthode rapide : regarde DI et aVF.
- DI positif, aVF positif : axe normal
- DI positif, aVF négatif : déviation gauche, évoquant un hémibloc antérieur gauche
- DI négatif, aVF positif : déviation droite, évoquant une hypertrophie droite ou un hémibloc postérieur
- Les deux négatifs : axe hyperdroit, rare, souvent une inversion d'électrodes

## Étape 4 — onde P et intervalle PR
P normale : moins de 0,12 s de large et moins de 2,5 mm de haut. Une P large et bifide en DII traduit une hypertrophie auriculaire gauche, une P ample et pointue une hypertrophie droite.

PR normal entre 0,12 et 0,20 s, mesuré du début de la P au début du QRS.
- PR long et fixe : bloc du premier degré, souvent bénin
- PR qui s'allonge progressivement jusqu'à une P non suivie de QRS : Mobitz 1, généralement nodal et bénin
- P bloquée brutalement, sans allongement préalable : Mobitz 2, siège plus bas, évolution imprévisible vers le bloc complet
- Aucune relation entre P et QRS : bloc du troisième degré

[[fig:bav3|Bloc auriculo-ventriculaire complet : les QRS sont lents, larges et réguliers, totalement indépendants des ondes P. Rythme d'échappement, urgence rythmologique.]]

## Étape 5 — le QRS
Durée normale inférieure à 0,12 s.
- Bloc de branche droit : aspect RSR' en V1, onde S large et empâtée en DI et V6
- Bloc de branche gauche : QRS large, aspect en M en V5-V6, disparition de l'onde Q septale. Un bloc gauche d'apparition récente chez un patient douloureux se prend en charge comme un infarctus avec sus-décalage

Onde Q pathologique : durée supérieure à 0,04 s, ou amplitude dépassant le quart de l'onde R qui la suit. Elle témoigne d'une nécrose constituée et reste définitivement.

Hypertrophie ventriculaire gauche : indice de Sokolow, somme de l'onde S en V1 et de l'onde R en V5 ou V6 supérieure à 35 mm.

Microvoltage, c'est-à-dire des QRS de petite amplitude partout : penser à un épanchement péricardique, une obésité, un emphysème.

## Étape 6 — le segment ST, le moment critique
Le segment ST doit être sur la ligne de base. Un sus-décalage est significatif s'il existe dans au moins deux dérivations contiguës.

Territoires à connaître par cœur :
- Antéroseptal : V1, V2, V3
- Apical : V4 — antérieur étendu : V1 à V6 avec DI et aVL
- Latéral bas : V5, V6 ; latéral haut : DI, aVL
- Inférieur : DII, DIII, aVF
- Postérieur : pas de dérivation directe, on voit un miroir en V1-V2-V3 et on confirme par V7, V8, V9
- Ventricule droit : V3R et V4R, à réaliser systématiquement devant un infarctus inférieur

[[fig:stemi|Sus-décalage convexe englobant l'onde T, avec onde Q naissante : syndrome coronarien avec sus-décalage persistant. Reperfusion en urgence, le délai fait le pronostic.]]

Le miroir — un sous-décalage dans le territoire opposé — renforce beaucoup le diagnostic et distingue l'infarctus de la péricardite.

Autres causes de sus-décalage à ne pas confondre :
- Péricardite : sus-décalage diffus, concave vers le haut, sans miroir, avec un sous-décalage du segment PQ
- Repolarisation précoce : fréquente chez le sujet jeune sportif, stable dans le temps
- Anévrysme ventriculaire : sus-décalage figé, persistant des semaines après un infarctus
- Bloc de branche gauche et stimulation par pacemaker, qui déforment la repolarisation

## Ischémie sans sus-décalage
[[fig:ischemie|Sous-décalage horizontal ou descendant du ST avec onde T négative : ischémie sous-endocardique. Dosage de la troponine et stratification du risque, pas de thrombolyse.]]

Un sous-décalage isolé peut aussi être fonctionnel, lié à une tachycardie, à la digoxine ou à une hypokaliémie : le contexte tranche.

## Étape 7 — onde T et intervalle QT
L'onde T normale est positive dans la plupart des dérivations, asymétrique, avec une montée lente et une descente rapide. Elle est normalement négative en aVR, souvent en V1.

Onde T négative ailleurs : ischémie, mais aussi surcharge ventriculaire, bloc de branche, imprégnation médicamenteuse, ou séquelle. Ondes T amples, pointues et symétriques : hyperkaliémie, ou tout premier stade d'un infarctus.

QT corrigé par la formule de Bazett : QT divisé par la racine carrée de l'intervalle RR. Un QT long expose aux torsades de pointes, donc à la mort subite. Causes : hypokaliémie, hypocalcémie, hypomagnésémie, de nombreux médicaments dont certains antiarythmiques, antibiotiques et neuroleptiques, et les formes congénitales.

## Les troubles du rythme les plus fréquents
[[fig:fa|Fibrillation atriale : rythme irrégulier, aucune onde P identifiable, trémulation de la ligne de base. Deux questions immédiates : tolérance et risque embolique.]]

- Flutter atrial : aspect en dents de scie dans les dérivations inférieures, souvent 300 auriculaire pour 150 ventriculaire
- Tachycardie jonctionnelle : QRS fins, très réguliers, rapides, début et fin brusques
- Extrasystoles : battement prématuré, fin s'il est supraventriculaire, large s'il est ventriculaire
- Tachycardie ventriculaire : QRS larges, réguliers, avec dissociation auriculo-ventriculaire. Devant toute tachycardie à QRS larges, on considère qu'il s'agit d'une TV jusqu'à preuve du contraire
- Fibrillation ventriculaire : tracé anarchique, c'est un arrêt cardiaque

## L'ionogramme se lit sur l'ECG
[[fig:hyperk|Hyperkaliémie évoluée : ondes T amples et pointues, QRS très élargi, onde P disparue. Urgence vitale immédiate, avant même le résultat du laboratoire.]]

Séquence de l'hyperkaliémie : T pointues, puis allongement du PR et aplatissement de la P, puis élargissement du QRS, puis aspect sinusoïdal et arrêt. Hypokaliémie : sous-décalage de ST, aplatissement de l'onde T, apparition d'une onde U après la T.

## Les cinq tracés à reconnaître en priorité
- Sus-décalage de ST : diagnostic qui se compte en minutes
- Hyperkaliémie évoluée : mort par arrêt cardiaque si elle est méconnue
- Bloc auriculo-ventriculaire complet : syncopes, appareillage
- Tachycardie ventriculaire : ne jamais la traiter comme une tachycardie supraventriculaire
- Fibrillation atriale : la plus fréquente, enjeu embolique majeur

## Erreurs de lecture les plus courantes
- Interpréter sans vérifier la vitesse et l'étalonnage
- Conclure sur une seule dérivation au lieu de raisonner par territoire
- Prendre une inversion d'électrodes pour une pathologie : P négative en DII, aVR positif, tout est inversé
- Oublier les dérivations droites devant un infarctus inférieur
- Se rassurer sur un ECG normal alors que la douleur persiste

## Pièges d'annales
Un ECG normal n'élimine pas un syndrome coronarien : il faut le répéter et doser la troponine. Devant un infarctus inférieur, chercher l'extension au ventricule droit avant de donner un dérivé nitré, qui provoquerait un collapsus. Un bloc de branche gauche récent avec douleur thoracique se gère comme un sus-décalage.`,
  },
  {
    id: "radio-thorax",
    titre: "Lire une radiographie de thorax",
    famille: "Examens complémentaires",
    contenu: `## Vérifier le cliché avant de l'interpréter
Un cliché mal fait conduit à des conclusions fausses. Contrôle dans l'ordre :
- Identité et date
- Incidence : de face postéro-antérieure debout, ou antéro-postérieure au lit, ce qui agrandit la silhouette cardiaque et interdit de conclure à une cardiomégalie
- Inspiration : au moins six arcs costaux antérieurs visibles
- Centrage : extrémités des clavicules à égale distance des épineuses
- Pénétration : les corps vertébraux doivent rester devinés derrière le cœur

## L'anatomie à connaître
[[fig:thorax|Les repères d'une radiographie de face : champs pulmonaires, hiles, silhouette cardiaque, coupoles diaphragmatiques et culs-de-sac costo-diaphragmatiques.]]

Points fixes : la trachée est médiane, le hile gauche est plus haut que le droit, la coupole droite est plus haute que la gauche à cause du foie, les culs-de-sac costo-diaphragmatiques sont fins et pointus.

## Une lecture ordonnée
Balaye toujours dans le même ordre pour ne rien oublier : parties molles et squelette, trachée et médiastin, silhouette cardiaque, hiles, champs pulmonaires comparés côté à côté, coupoles, culs-de-sac, puis les zones aveugles — apex, derrière le cœur, sous les coupoles.

## Le signe de la silhouette
Deux structures de même densité au contact perdent leur limite commune. Un effacement du bord droit du cœur situe l'opacité dans le lobe moyen ; un effacement de la coupole droite la situe dans le lobe inférieur. C'est l'outil qui permet de localiser une lésion sur un seul cliché.

## Les cinq situations à reconnaître d'emblée
- **Pneumopathie franche lobaire aiguë** : opacité systématisée, dense, homogène, limitée par une scissure, avec bronchogramme aérien, sans déplacement médiastinal
- **Épanchement pleural liquidien** : opacité déclive avec ligne bordante concave vers le haut, comblement du cul-de-sac, refoulant le médiastin du côté opposé s'il est abondant
- **Pneumothorax** : hyperclarté périphérique sans trame vasculaire, avec la ligne pleurale visible. Cherche les signes de compression : déviation médiastinale, aplatissement de la coupole — c'est une urgence d'exsufflation
- **Œdème pulmonaire cardiogénique** : opacités alvéolaires bilatérales périhilaires en ailes de papillon, redistribution vasculaire vers les sommets, lignes de Kerley, cardiomégalie, souvent un épanchement associé
- **Atélectasie** : opacité rétractile, qui attire le médiastin, les scissures et la coupole du côté atteint — l'inverse exact de l'épanchement

## Distinguer ce qui refoule et ce qui attire
La question qui tranche : le médiastin est-il poussé ou tiré ? Poussé du côté opposé, c'est un processus expansif — épanchement abondant, pneumothorax compressif. Tiré du côté de la lésion, c'est un processus rétractile — atélectasie, fibrose, pneumonectomie.

## Le pneumopéritoine
Un croissant clair sous une coupole sur un cliché debout signe une perforation d'organe creux : urgence chirurgicale. C'est une des rares découvertes de radiographie thoracique qui envoie directement au bloc.

## Ce qu'une radiographie ne montre pas
Elle manque les lésions de petite taille, les embolies pulmonaires, une part des pneumopathies débutantes, et les lésions rétrocardiaques. Une radiographie normale n'élimine pas grand-chose : c'est un examen d'orientation, pas d'exclusion.

## Où trouver de vraies images
Je ne peux pas intégrer ici des clichés réels, qui sont protégés par le droit d'auteur. Deux sources libres et fiables, avec des milliers de cas légendés : **Radiopaedia** et **Wikimedia Commons**, catégorie radiographie thoracique. Tu peux coller l'adresse d'une image dans un chapitre avec la syntaxe suivante, en mode Modifier :

![Légende de mon image](adresse de l'image)

## Pièges d'annales
Un cliché couché ne permet jamais d'affirmer une cardiomégalie. Une ligne bordante concave vers le haut signe l'épanchement, pas la pneumopathie. Devant un pneumothorax, chercher immédiatement les signes de compression.`,
  },
];

/* stockage des documents : IndexedDB, pas localStorage — les PDF y tiennent */
const BDD = "edngo-docs";
function ouvrirBdd() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(BDD, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("docs")) r.result.createObjectStore("docs"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function poserDoc(id, blob) {
  const db = await ouvrirBdd();
  return new Promise((res, rej) => {
    const tx = db.transaction("docs", "readwrite");
    tx.objectStore("docs").put(blob, id);
    tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
  });
}
async function prendreDoc(id) {
  const db = await ouvrirBdd();
  return new Promise((res, rej) => {
    const tx = db.transaction("docs", "readonly");
    const q = tx.objectStore("docs").get(id);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function retirerDoc(id) {
  const db = await ouvrirBdd();
  return new Promise((res) => {
    const tx = db.transaction("docs", "readwrite");
    tx.objectStore("docs").delete(id);
    tx.oncomplete = () => res(true);
  });
}
const poids = (o) => o < 1024 ? o + " o" : o < 1048576 ? Math.round(o / 1024) + " Ko" : (o / 1048576).toFixed(1) + " Mo";

function Documents({ docs = [], onMaj }) {
  const [etat, setEtat] = useState(null);
  const [apercu, setApercu] = useState(null);

  const importer = async (e) => {
    const fichiers = [...(e.target.files || [])];
    e.target.value = "";
    if (!fichiers.length) return;
    setEtat("Import en cours…");
    const ajoutes = [];
    for (const fi of fichiers) {
      const id = Math.random().toString(36).slice(2, 10);
      try {
        await poserDoc(id, fi);
        ajoutes.push({ id, nom: fi.name, taille: fi.size, type: fi.type });
      } catch { setEtat("Import impossible : " + fi.name); }
    }
    if (ajoutes.length) { onMaj([...docs, ...ajoutes]); setEtat(`${ajoutes.length} document(s) ajouté(s).`); }
    setTimeout(() => setEtat(null), 2500);
  };

  const ouvrir = async (d) => {
    try {
      const blob = await prendreDoc(d.id);
      if (!blob) return setEtat("Document introuvable sur cet appareil.");
      const url = URL.createObjectURL(blob);
      setApercu({ id: d.id, url, nom: d.nom });
    } catch { setEtat("Lecture impossible."); }
  };

  const supprimer = async (d) => {
    await retirerDoc(d.id);
    onMaj(docs.filter((x) => x.id !== d.id));
    if (apercu && apercu.id === d.id) { URL.revokeObjectURL(apercu.url); setApercu(null); }
  };

  return (
    <div>
      <label className="inline-block px-4 py-2.5 text-sm cursor-pointer doux"
        style={{ background: T.accent, color: "#fff", borderRadius: 999, fontWeight: 600 }}>
        Importer un PDF
        <input type="file" accept="application/pdf,image/*" multiple onChange={importer} className="hidden" />
      </label>
      {etat && <p className="text-xs mt-2" style={{ color: T.accent }}>{etat}</p>}

      {docs.length > 0 && (
        <ul className="mt-3">
          {docs.map((d) => (
            <li key={d.id} className="flex items-center gap-3 mb-2"
              style={{ background: T.card, borderRadius: 16, padding: "11px 14px", border: `1px solid ${T.line}` }}>
              <span className="shrink-0 flex items-center justify-center"
                style={{ width: 34, height: 34, borderRadius: 10, background: T.accentPale, color: T.accent, fontSize: 11, fontWeight: 700 }}>
                PDF
              </span>
              <span className="flex-1 min-w-0">
                <span className="block text-sm truncate" style={{ fontWeight: 600 }}>{d.nom}</span>
                <span className="block text-xs" style={{ color: T.ink2 }}>{poids(d.taille)}</span>
              </span>
              <button onClick={() => ouvrir(d)} className="px-3 py-1.5 text-xs doux"
                style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 600 }}>Ouvrir</button>
              <button onClick={() => supprimer(d)} className="text-xs px-1" style={{ color: T.bas }}>×</button>
            </li>
          ))}
        </ul>
      )}

      {apercu && (
        <div className="mt-3">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xs flex-1 truncate" style={{ color: T.ink2 }}>{apercu.nom}</span>
            <a href={apercu.url} target="_blank" rel="noreferrer" className="px-3 py-1.5 text-xs doux"
              style={{ borderRadius: 999, background: T.accent, color: "#fff", fontWeight: 600 }}>Plein écran</a>
            <button onClick={() => { URL.revokeObjectURL(apercu.url); setApercu(null); }}
              className="px-3 py-1.5 text-xs" style={{ color: T.ink2 }}>Fermer</button>
          </div>
          <iframe src={apercu.url} title={apercu.nom} style={{ width: "100%", height: "70vh", borderRadius: 16, border: `1px solid ${T.line}`, background: "#fff" }} />
        </div>
      )}
    </div>
  );
}

const clair = (c) => {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  return (r * 299 + g * 587 + b * 114) / 1000 > 140;
};

function Toile({ traces, onTraces }) {
  const [couleur, setCouleur] = useState(COULEURS_STYLO[0]);
  useEffect(() => {
    setCouleur((c) => (c === "#E2ECF6" || c === "#16202B") ? (clair(fond) ? "#16202B" : "#E2ECF6") : c);
  }, [fond]);
  const [taille, setTaille] = useState(3);
  const [gomme, setGomme] = useState(false);
  const [plein, setPlein] = useState(false);
  const [zoomPct, setZoomPct] = useState(100);
  const [fond, setFond] = useState("#12243A");
  const [trame, setTrame] = useState("vierge");

  const svg = useRef(null);
  const encours = useRef(null);      // élément <path> du trait en cours
  const trait = useRef(null);        // points du trait en cours
  const vue = useRef({ x: 0, y: 0, w: 1000, h: 700 });
  const doigts = useRef(new Map());
  const geste = useRef(null);

  /* les écouteurs natifs ne voient pas l'état React : on le miroite */
  const cfg = useRef({ couleur, taille, gomme, traces, onTraces });
  cfg.current = { couleur, taille, gomme, traces, onTraces };

  const appliquerVue = () => {
    const v = vue.current;
    if (svg.current) svg.current.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
    const fond = svg.current && svg.current.querySelector("#fond");
    if (fond) {
      fond.setAttribute("x", v.x - v.w); fond.setAttribute("y", v.y - v.h);
      fond.setAttribute("width", v.w * 3); fond.setAttribute("height", v.h * 3);
    }
    setZoomPct(Math.round((1000 / v.w) * 100));
  };

  const monde = (cx, cy) => {
    const r = svg.current.getBoundingClientRect();
    const v = vue.current;
    return [v.x + ((cx - r.left) / r.width) * v.w, v.y + ((cy - r.top) / r.height) * v.h];
  };

  const zoomer = (facteur, cx, cy) => {
    const v = vue.current;
    const [mx, my] = monde(cx, cy);
    const nw = Math.min(6000, Math.max(150, v.w / facteur));
    const nh = nw * (v.h / v.w);
    vue.current = { x: mx - (mx - v.x) * (nw / v.w), y: my - (my - v.y) * (nh / v.h), w: nw, h: nh };
    appliquerVue();
  };

  const chemin = (pts) => pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");

  const effacer = (x, y) => {
    const { traces: tr, onTraces: maj } = cfg.current;
    const seuil = 18 * (vue.current.w / 1000);
    const reste = tr.filter((t) => t && t.pts && !t.pts.some(([px, py]) => Math.hypot(px - x, py - y) < seuil));
    if (reste.length !== tr.length) maj(reste);
  };

  /* écouteurs natifs, non passifs : c'est ce qui permet de bloquer le geste de Safari */
  useEffect(() => {
    const el = svg.current;
    if (!el) return;

    const bas = (e) => {
      if (e.pointerType === "touch") {
        doigts.current.set(e.pointerId, [e.clientX, e.clientY]);
        if (doigts.current.size === 2) {
          const [a, b] = [...doigts.current.values()];
          geste.current = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };
        }
        return;
      }
      e.preventDefault();
      const [x, y] = monde(e.clientX, e.clientY);
      if (cfg.current.gomme) return effacer(x, y);
      const p = e.pressure && e.pressure > 0 ? e.pressure : 0.5;
      trait.current = {
        couleur: cfg.current.couleur,
        taille: (cfg.current.taille * (0.6 + p) * vue.current.w) / 1000,
        pts: [[x, y]],
      };
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", trait.current.couleur);
      path.setAttribute("stroke-width", trait.current.taille);
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      path.setAttribute("d", chemin(trait.current.pts));
      el.appendChild(path);
      encours.current = path;
    };

    const bouge = (e) => {
      if (e.pointerType === "touch") {
        if (!doigts.current.has(e.pointerId)) return;
        e.preventDefault();
        doigts.current.set(e.pointerId, [e.clientX, e.clientY]);
        if (doigts.current.size === 2 && geste.current) {
          const [a, b] = [...doigts.current.values()];
          const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
          const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          const r = el.getBoundingClientRect();
          const v = vue.current;
          vue.current = {
            ...v,
            x: v.x - ((m[0] - geste.current.m[0]) / r.width) * v.w,
            y: v.y - ((m[1] - geste.current.m[1]) / r.height) * v.h,
          };
          appliquerVue();
          if (geste.current.d > 0) zoomer(d / geste.current.d, m[0], m[1]);
          geste.current = { d, m };
        }
        return;
      }
      if (cfg.current.gomme) { if (e.buttons) { const [x, y] = monde(e.clientX, e.clientY); effacer(x, y); } return; }
      if (!trait.current) return;
      e.preventDefault();
      const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      evts.forEach((ev) => trait.current.pts.push(monde(ev.clientX, ev.clientY)));
      if (encours.current) encours.current.setAttribute("d", chemin(trait.current.pts));
    };

    const haut = (e) => {
      if (e && e.pointerType === "touch") {
        doigts.current.delete(e.pointerId);
        if (doigts.current.size < 2) geste.current = null;
        return;
      }
      const t = trait.current;
      trait.current = null;
      if (encours.current) { encours.current.remove(); encours.current = null; }
      if (t && t.pts.length > 1) cfg.current.onTraces([...cfg.current.traces, t]);
    };

    const molette = (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) return zoomer(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
      const r = el.getBoundingClientRect();
      const v = vue.current;
      vue.current = { ...v, x: v.x + (e.deltaX / r.width) * v.w, y: v.y + (e.deltaY / r.height) * v.h };
      appliquerVue();
    };

    const opt = { passive: false };
    el.addEventListener("pointerdown", bas, opt);
    el.addEventListener("pointermove", bouge, opt);
    el.addEventListener("pointerup", haut, opt);
    el.addEventListener("pointercancel", haut, opt);
    el.addEventListener("pointerleave", haut, opt);
    el.addEventListener("wheel", molette, opt);
    const stop = (e) => e.preventDefault();
    el.addEventListener("touchstart", stop, opt);
    el.addEventListener("touchmove", stop, opt);
    el.addEventListener("gesturestart", stop, opt);
    return () => {
      el.removeEventListener("pointerdown", bas);
      el.removeEventListener("pointermove", bouge);
      el.removeEventListener("pointerup", haut);
      el.removeEventListener("pointercancel", haut);
      el.removeEventListener("pointerleave", haut);
      el.removeEventListener("wheel", molette);
      el.removeEventListener("touchstart", stop);
      el.removeEventListener("touchmove", stop);
      el.removeEventListener("gesturestart", stop);
    };
  }, []);

  useEffect(() => { appliquerVue(); }, [plein]);

  const cadrer = () => {
    const pts = traces.filter((t) => t && t.pts).flatMap((t) => t.pts);
    if (!pts.length) vue.current = { x: 0, y: 0, w: 1000, h: 700 };
    else {
      const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      const x0 = Math.min(...xs) - 60, y0 = Math.min(...ys) - 60;
      const w = Math.max(300, Math.max(...xs) - x0 + 60);
      vue.current = { x: x0, y: y0, w, h: w * 0.7 };
    }
    appliquerVue();
  };

  const barre = (
    <div className="flex flex-wrap items-center gap-2 mb-3">
      {COULEURS_STYLO.map((c) => (
        <button key={c} onClick={() => { setCouleur(c); setGomme(false); }} aria-label={"Couleur " + c}
          className="doux" style={{
            width: 28, height: 28, borderRadius: 999, background: c,
            border: couleur === c && !gomme ? `3px solid ${T.accent}` : `1px solid ${T.line}`,
          }} />
      ))}
      {[2, 4, 8].map((k) => (
        <button key={k} onClick={() => { setTaille(k); setGomme(false); }}
          className="flex items-center justify-center doux"
          style={{ width: 32, height: 32, borderRadius: 999,
            background: taille === k && !gomme ? T.accentPale : "transparent", border: `1px solid ${T.line}` }}>
          <i style={{ width: k + 2, height: k + 2, borderRadius: 999, background: T.ink, display: "block" }} />
        </button>
      ))}
      <button onClick={() => setGomme(!gomme)} className="px-3 py-1.5 text-xs doux"
        style={{ borderRadius: 999, fontWeight: 600, background: gomme ? T.accent : "transparent",
          color: gomme ? "#fff" : T.ink2, border: `1px solid ${gomme ? T.accent : T.line}` }}>Gomme</button>
      <button onClick={() => onTraces(traces.filter((t) => t && t.pts).slice(0, -1))} disabled={!traces.length}
        className="px-3 py-1.5 text-xs doux"
        style={{ borderRadius: 999, color: traces.length ? T.ink2 : "#3E5C7C", border: `1px solid ${T.line}` }}>Annuler</button>
      <div className="flex items-center gap-1">
        <button onClick={() => { const r = svg.current.getBoundingClientRect(); zoomer(1 / 1.25, r.left + r.width / 2, r.top + r.height / 2); }}
          className="text-xs doux" style={{ width: 30, height: 30, borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>−</button>
        <span className="text-xs" style={{ color: T.ink2, width: 42, textAlign: "center" }}>{zoomPct}%</span>
        <button onClick={() => { const r = svg.current.getBoundingClientRect(); zoomer(1.25, r.left + r.width / 2, r.top + r.height / 2); }}
          className="text-xs doux" style={{ width: 30, height: 30, borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>+</button>
      </div>
      <button onClick={cadrer} className="px-3 py-1.5 text-xs doux"
        style={{ borderRadius: 999, color: T.ink2, border: `1px solid ${T.line}` }}>Recadrer</button>
      <span className="flex items-center gap-1.5">
        {[["#12243A", "nuit"], ["#0E1A29", "sombre"], ["#F7F3E8", "papier"], ["#FFFFFF", "blanc"]].map(([c, l]) => (
          <button key={c} onClick={() => setFond(c)} title={l} className="doux"
            style={{ width: 22, height: 22, borderRadius: 999, background: c,
              border: fond === c ? `3px solid ${T.accent}` : `1px solid ${T.line}` }} />
        ))}
        <button onClick={() => setTrame(trame === "vierge" ? "quadrille" : trame === "quadrille" ? "ligne" : "vierge")}
          className="px-3 py-1.5 text-xs doux"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2, fontWeight: 600 }}>
          {trame === "vierge" ? "Vierge" : trame === "quadrille" ? "Quadrillé" : "Lignes"}
        </button>
      </span>
      <button onClick={() => setPlein(!plein)} className="px-3 py-1.5 text-xs doux"
        style={{ borderRadius: 999, fontWeight: 600, background: T.accent, color: "#fff" }}>
        {plein ? "Réduire" : "Plein écran"}
      </button>
    </div>
  );

  const dessin = (
    <svg ref={svg} viewBox="0 0 1000 700" width="100%"
      style={{
        background: fond, borderRadius: plein ? 12 : 18, border: plein ? "none" : `1px solid ${T.line}`,
        touchAction: "none", WebkitUserSelect: "none", userSelect: "none", WebkitTouchCallout: "none",
        display: "block", height: plein ? "calc(100vh - 76px)" : "auto", aspectRatio: plein ? "auto" : "10 / 7",
      }}>
      <defs>
        <pattern id="quadrillage" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d={trame === "ligne" ? "M0 40 L40 40" : "M40 0 L0 0 0 40"} fill="none"
            stroke={clair(fond) ? "#DCE2EA" : "#1E3149"} strokeWidth="1" />
        </pattern>
      </defs>
      <rect id="fond" x="-1000" y="-700" width="3000" height="2100"
        fill={trame === "vierge" ? "none" : "url(#quadrillage)"} />
      {traces.filter((t) => t && t.pts).map((t, i) => (
        <path key={i} d={chemin(t.pts)} fill="none" stroke={t.couleur} strokeWidth={t.taille}
          strokeLinecap="round" strokeLinejoin="round" />
      ))}
    </svg>
  );

  if (plein) {
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 60, background: T.paper, padding: 8, overflow: "hidden" }}>
        {barre}
        {dessin}
      </div>
    );
  }
  return (
    <div>
      {barre}
      {dessin}
      <p className="text-xs mt-2" style={{ color: T.ink2 }}>
        {traces.length} trait(s) · toile infinie : le stylet écrit, deux doigts déplacent et zooment
      </p>
    </div>
  );
}

function EditeurFiche({ f, onMaj, onSupprimer, onRetour, items, colleges, onOuvrirItem, rattachement = true }) {
  const it = (items || []).find((i) => i.id === f.itemId);
  return (
    <div>
      <div className="flex items-center gap-3 mb-4">
        {onRetour && (
          <button onClick={onRetour} className="flex items-center justify-center shrink-0 doux"
            style={{ width: 36, height: 36, borderRadius: 999, background: T.card, border: `1px solid ${T.line}`, color: T.accent }}>←</button>
        )}
        <input value={f.titre} onChange={(e) => onMaj({ titre: e.target.value })} placeholder="Titre de la fiche"
          className="flex-1 px-3 py-2 text-sm" style={{ borderRadius: 14, border: `1px solid ${T.line}` }} />
        <button onClick={onSupprimer} className="text-xs px-3 py-2" style={{ color: T.bas }}>Supprimer</button>
      </div>

      {rattachement && (
        <div className="flex flex-wrap gap-2 mb-4">
          <select value={f.collegeId || ""} onChange={(e) => onMaj({ collegeId: e.target.value || null, itemId: null })}
            className="px-3 py-2 text-sm" style={{ borderRadius: 14, border: `1px solid ${T.line}` }}>
            <option value="">Rattacher à un collège…</option>
            {colleges.map((c) => <option key={c.id} value={c.id}>{c.nom}</option>)}
          </select>
          {f.collegeId && (
            <select value={f.itemId || ""} onChange={(e) => onMaj({ itemId: e.target.value || null })}
              className="px-3 py-2 text-sm flex-1 min-w-40" style={{ borderRadius: 14, border: `1px solid ${T.line}` }}>
              <option value="">…et à un item (facultatif)</option>
              {items.filter((i) => i.collegeId === f.collegeId).sort((a, b) => a.numero - b.numero)
                .map((i) => <option key={i.id} value={i.id}>{i.numero}. {i.titre.slice(0, 55)}</option>)}
            </select>
          )}
          {it && onOuvrirItem && (
            <button onClick={() => onOuvrirItem(it.id)} className="px-3 py-2 text-xs doux"
              style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 600 }}>Ouvrir l'item</button>
          )}
        </div>
      )}

      {f.type === "doc" ? null : f.type === "texte" ? (
        <>
          <textarea value={f.texte} onChange={(e) => onMaj({ texte: e.target.value })} rows={18}
            placeholder={"Écris ce que tu sais, sans regarder.\n\n## Définition\n...\n\n## Traitement\n- premier point"}
            className="w-full p-4 text-sm" style={{ borderRadius: 20, border: `1px solid ${T.line}`, lineHeight: 1.75 }} />
          {f.texte.trim() && (
            <div className="mt-4 ombre" style={{ background: T.card, borderRadius: 22, padding: "18px 20px" }}>
              <p className="text-xs uppercase mb-3" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Aperçu</p>
              <ResumeLu texte={f.texte} />
            </div>
          )}
        </>
      ) : (
        <Toile traces={f.traces || []} onTraces={(t) => onMaj({ traces: t })} />
      )}

      <p className="text-xs uppercase mt-6 mb-3" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Documents</p>
      <Documents docs={f.docs || []} onMaj={(d) => onMaj({ docs: d })} />

      <p className="text-xs uppercase mt-6 mb-2" style={{ letterSpacing: "0.1em", color: T.ink2 }}>Ou un lien externe</p>
      <input value={f.lien || ""} onChange={(e) => onMaj({ lien: e.target.value })}
        placeholder="Adresse d'un document sur iCloud ou Drive"
        className="w-full px-3 py-2 text-sm" style={{ borderRadius: 14, border: `1px solid ${T.line}` }} />
      {f.lien && (
        <a href={f.lien} target="_blank" rel="noreferrer" className="inline-block mt-2 px-4 py-2 text-xs doux"
          style={{ borderRadius: 999, background: T.accentPale, color: T.accent, fontWeight: 600 }}>Ouvrir le lien</a>
      )}
    </div>
  );
}

function VignetteFiche({ x, sous, onClick, couleurs }) {
  return (
    <button onClick={onClick} className="w-full text-left mb-2 flex items-center gap-3 doux"
      style={{ background: T.card, borderRadius: 18, padding: "13px 15px", border: `1px solid ${T.line}` }}>

        <span className="block text-xs mt-1" style={{ color: T.ink2 }}>{sous}</span>
      </span>
      <span style={{ color: T.accent, fontSize: 18 }}>›</span>

function FichesItem({ fiches, onMaj, item }) {
  const [ouvert, setOuvert] = useState(null);
  const miennes = fiches.filter((x) => x.itemId === item.id);
  const f = fiches.find((x) => x.id === ouvert);

  const creer = (type) => {
    const n = nouvelleFiche(type, item.id, item.collegeId);
    onMaj([n, ...fiches]);
    setOuvert(n.id);
  };

  if (f) return (
    <EditeurFiche f={f} rattachement={false} items={[]} colleges={[]}
      onMaj={(p) => onMaj(fiches.map((x) => x.id === f.id ? { ...x, ...p } : x))}
      onSupprimer={() => { onMaj(fiches.filter((x) => x.id !== f.id)); setOuvert(null); }}
      onRetour={() => setOuvert(null)} />
  );

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={() => creer("texte")} className="px-4 py-2.5 text-sm doux"
          style={{ background: T.accent, color: "#fff", borderRadius: 999, fontWeight: 600 }}>Fiche écrite</button>
        <button onClick={() => creer("dessin")} className="px-4 py-2.5 text-sm doux"
          style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600 }}>Carte au stylet</button>
        <button onClick={() => creer("doc")} className="px-4 py-2.5 text-sm doux"
          style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600 }}>Importer un PDF</button>
      </div>
      {miennes.length === 0 ? (
        <p className="text-sm" style={{ color: T.ink2, lineHeight: 1.7 }}>

const JOURS = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août",
  "septembre", "octobre", "novembre", "décembre"];
const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const lundiDe = (d) => {
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  x.setHours(12, 0, 0, 0);
  return x;
};
const HT = 46; // hauteur d'une heure, en pixels

const BLOCS = [
  { bg: "#1B3A57", fg: "#9AD2F5", bar: "#54A9EA" },
  { bg: "#33201E", fg: "#F3A49E", bar: "#E4685D" },
  { bg: "#123227", fg: "#7FDCBD", bar: "#35B48C" },
  { bg: "#3A2F17", fg: "#F3D08F", bar: "#EAAE43" },
  { bg: "#251F45", fg: "#C3B0F2", bar: "#8B6FE0" },
  { bg: "#331A28", fg: "#F2A9C8", bar: "#D96A96" },
  { bg: "#1D2E1A", fg: "#A8D993", bar: "#6BB84E" },
  { bg: "#15303F", fg: "#95CEEF", bar: "#3E8CC4" },
  { bg: "#331F14", fg: "#F2BC77", bar: "#D08A32" },
  { bg: "#2A2140", fg: "#BFA8E8", bar: "#7C5FD0" },
];

/* les anciennes tâches n'avaient qu'une heure texte : on les convertit */
const normaliser = (t) => {
  if (typeof t.debut === "number") return t;
  const h = parseInt((t.heure || "").split(":")[0], 10);
  return { ...t, debut: isNaN(h) ? 8 : h, duree: t.duree || 1 };
};

function versICS(taches, items, colleges) {
  const pad = (n) => String(n).padStart(2, "0");
  const stamp = (d, h) => `${d.replace(/-/g, "")}T${pad(h)}0000`;
  const echap = (t) => String(t).replace(/[\\;,]/g, (m) => "\\" + m).replace(/\n/g, "\\n");
  const lignes = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//EDN Go//FR", "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH", "X-WR-CALNAME:EDN Go", "X-WR-TIMEZONE:Europe/Paris",
  ];
  taches.map(normaliser).forEach((t) => {
    const i = t.type === "item" ? items.find((x) => x.id === t.itemId) : null;
    const c = i ? colleges.find((x) => x.id === i.collegeId) : null;
    const titre = i ? `Item ${i.numero} — ${i.titre}` : t.texte || "Révision";
    lignes.push("BEGIN:VEVENT",
      `UID:edngo-${t.id}@edngo`,
      `DTSTAMP:${stamp(auj(), 8)}Z`,
      `DTSTART;TZID=Europe/Paris:${stamp(t.date, t.debut)}`,
      `DTEND;TZID=Europe/Paris:${stamp(t.date, Math.min(23, t.debut + (t.duree || 1)))}`,
      `SUMMARY:${echap((t.fait ? "✓ " : "") + titre)}`,
      c ? `DESCRIPTION:${echap(c.nom + " · EDN Go")}` : "DESCRIPTION:EDN Go",
      "END:VEVENT");
  });
  lignes.push("END:VCALENDAR");
  return lignes.join("\r\n");
}

/* rappel LCA toutes les trois semaines */
const CLE_LCA = "edngo-lca";
function lcaDu() {
  try {
    const d = localStorage.getItem(CLE_LCA);
    if (!d) return true;
    return (new Date(auj()) - new Date(d)) / 86400000 >= 21;
  } catch (e) { return false; }
}
function noterLca() { try { localStorage.setItem(CLE_LCA, auj()); } catch (e) {} }

function Planning({ taches, onMaj, items, colleges, onOuvrirItem }) {
  const [debutSem, setDebutSem] = useState(() => lundiDe(new Date()));
  const [jour, setJour] = useState(() => iso(new Date()));
  const [creneau, setCreneau] = useState(null);
  const [fin, setFin] = useState(9);
  const [texte, setTexte] = useState("");
  const [selection, setSelection] = useState(null);
  const [export_, setExport_] = useState(false);
  const [modeles, setModeles] = useState(false);
  const [purge, setPurge] = useState(false);
  const [corbeille, setCorbeille] = useState([]);
  const [effacer_, setEffacer] = useState(false);
  const [corbeille, setCorbeille] = useState(null);
  const [glisse, setGlisse] = useState(null);
  const [apercu, setApercu] = useState(null);  // position provisoire, non enregistrée
  const zone = useRef(null);

  useEffect(() => { if (zone.current) zone.current.scrollTop = 7 * HT; }, []);

  const semaine = [...Array(7)].map((_, i) => {
    const d = new Date(debutSem); d.setDate(d.getDate() + i); return d;
  });
  const aujourdhui = iso(new Date());
  const duJour = taches.filter((t) => t.date === jour).map(normaliser).sort((a, b) => a.debut - b.debut);

  const ajouter = (type, itemId, libelle) => {
    onMaj([...taches, {
      id: Math.random().toString(36).slice(2, 9), date: jour, type,
      itemId: itemId || null, texte: libelle || "",
      debut: creneau, duree: Math.max(1, fin - creneau), fait: false, teinte: taches.length % BLOCS.length,
    }]);
    setTexte(""); setCreneau(null);
  };
  const modifier = (id, patch) => onMaj(taches.map((t) => t.id === id ? { ...normaliser(t), ...patch } : t));
  const supprimer = (id) => { onMaj(taches.filter((t) => t.id !== id)); setSelection(null); };
  const reporter = (t) => {
    const d = new Date(t.date + "T12:00:00"); d.setDate(d.getDate() + 1);
    const demain = iso(d), dur = t.duree || 1;
    onMaj(taches.map((x) => {
      if (x.id === t.id) return { ...normaliser(x), date: demain, debut: 8, fait: false };
      const n = normaliser(x);
      if (n.date === demain && n.debut >= 8) return { ...n, debut: Math.min(23, n.debut + dur) };
      return x;
    }));
    setSelection(null);
  };

  /* étirement et déplacement au doigt ou au stylet */
  const prendre = (e, t, mode) => {
    e.stopPropagation();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
    setSelection(t.id);
    setGlisse({ id: t.id, mode, y0: e.clientY, debut0: t.debut, duree0: t.duree || 1 });
    setApercu({ id: t.id, debut: t.debut, duree: t.duree || 1 });
  };
  const bouger = (e) => {
    if (!glisse) return;
    const pas = Math.round((e.clientY - glisse.y0) / HT);
    if (glisse.mode === "duree") {
      const d = Math.min(24 - glisse.debut0, Math.max(1, glisse.duree0 + pas));
      setApercu((a) => (a && a.duree === d ? a : { id: glisse.id, debut: glisse.debut0, duree: d }));
    } else {
      const h = Math.min(24 - glisse.duree0, Math.max(0, glisse.debut0 + pas));
      setApercu((a) => (a && a.debut === h ? a : { id: glisse.id, debut: h, duree: glisse.duree0 }));
    }
  };
  const lacher = () => {
    if (apercu) modifier(apercu.id, { debut: apercu.debut, duree: apercu.duree });
    setApercu(null); setGlisse(null);
  };

  /* remplit la journée avec un modèle, en piochant les items les plus faibles */
  const appliquerModele = (m) => {
    const occupees = duJour.map((t) => [t.debut, t.debut + (t.duree || 1)]);
    const libre = (a, b) => !occupees.some(([x, y]) => a < y && b > x);
    const candidats = items
      .filter((i) => (i.comp || 0) < 4)
      .map((i) => ({ i, d: i.dateComp || "0000-00-00", n: i.comp || 0 }))
      .sort((a, b) => a.n - b.n || a.d.localeCompare(b.d));
    let k = 0;
    const nouvelles = [];
    m.creneaux.forEach((c, idx) => {
      if (!libre(c.debut, c.debut + c.duree)) return;
      let type = "perso", itemId = null, texte_ = c.texte;
      if (c.texte === null) {
        const x = candidats[k++];
        if (x) { type = "item"; itemId = x.i.id; texte_ = ""; }
        else texte_ = "Révision libre";
      }
      nouvelles.push({
        id: Math.random().toString(36).slice(2, 9), date: jour, type, itemId, texte: texte_,
        debut: c.debut, duree: c.duree, fait: false,
        teinte: c.libre === false ? 7 : (taches.length + idx) % BLOCS.length,
      });
    });
    if (nouvelles.length) onMaj([...taches, ...nouvelles]);
    setModeles(false);
  };

  /* duplique la journée affichée vers une autre date */
  const dupliquer = (versDate) => {
    const copie = duJour.map((t) => ({
      ...t, id: Math.random().toString(36).slice(2, 9), date: versDate, fait: false,
    }));
    if (copie.length) onMaj([...taches, ...copie]);
    setModeles(false);
  };

  const trouves = texte.trim()
    ? items.filter((i) => i.titre.toLowerCase().includes(texte.toLowerCase())
        || String(i.numero).startsWith(texte.trim())).slice(0, 4)
    : [];

  const dateLisible = (() => {
    const d = new Date(jour + "T12:00:00");
    return `${JOURS[(d.getDay() + 6) % 7]}. ${d.getDate()} ${MOIS[d.getMonth()]}`;
  })();

  const vue = duJour.map((t) => (apercu && apercu.id === t.id ? { ...t, debut: apercu.debut, duree: apercu.duree } : t))
    .sort((a, b) => a.debut - b.debut || (b.duree || 1) - (a.duree || 1));

  /* répartition en colonnes : deux blocs qui se chevauchent restent visibles côte à côte */
  const place = [];
  let grappe = [], finGrappe = -1;
  const viderGrappe = () => {
    if (!grappe.length) return;
    const cols = [];
    grappe.forEach((t) => {
      let c = cols.findIndex((f) => f <= t.debut);
      if (c === -1) { c = cols.length; cols.push(0); }
      cols[c] = t.debut + (t.duree || 1);
      t.col = c;
    });
    grappe.forEach((t) => place.push({ ...t, nCols: cols.length }));
    grappe = [];
  };
  vue.forEach((t) => {
    if (grappe.length && t.debut >= finGrappe) { viderGrappe(); finGrappe = -1; }
    grappe.push({ ...t });
    finGrappe = Math.max(finGrappe, t.debut + (t.duree || 1));
  });
  viderGrappe();

  const occupe = (h) => duJour.some((t) => h >= t.debut && h < t.debut + (t.duree || 1));

  return (
    <div>
      <div className="flex items-center gap-2 mb-3">
        <button onClick={() => { const d = new Date(debutSem); d.setDate(d.getDate() - 7); setDebutSem(d); }}
          className="flex items-center justify-center doux"
          style={{ width: 34, height: 34, borderRadius: 999, border: `1px solid ${T.line}`, color: T.accent }}>‹</button>
        <span className="flex-1 text-center text-sm" style={{ fontWeight: 600 }}>
          {MOIS[semaine[3].getMonth()]} {semaine[3].getFullYear()}
        </span>
        <button onClick={() => { const d = new Date(debutSem); d.setDate(d.getDate() + 7); setDebutSem(d); }}
          className="flex items-center justify-center doux"
          style={{ width: 34, height: 34, borderRadius: 999, border: `1px solid ${T.line}`, color: T.accent }}>›</button>
        <button onClick={() => { setDebutSem(lundiDe(new Date())); setJour(aujourdhui); }}
          className="px-3 py-1.5 text-xs doux"
          style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.ink2 }}>Aujourd'hui</button>
      </div>

      <div className="flex gap-1.5 mb-4">
        {semaine.map((d, i) => {
          const k = iso(d);
          const n = taches.filter((t) => t.date === k);
          const faits = n.filter((t) => t.fait).length;
          const actif = k === jour;
          return (
            <button key={k} onClick={() => { setJour(k); setCreneau(null); setSelection(null); }} className="flex-1 doux"
              style={{ borderRadius: 16, padding: "9px 2px 8px", background: actif ? T.accent : T.card,
                border: `1px solid ${actif ? T.accent : k === aujourdhui ? T.accent : T.line}` }}>
              <span className="block text-xs" style={{ color: actif ? "#fff" : T.ink2, opacity: 0.8 }}>{JOURS[i]}</span>
              <span className="block" style={{ fontSize: 17, fontWeight: 700, color: actif ? "#fff" : T.ink }}>{d.getDate()}</span>
              <span className="block" style={{ height: 6, marginTop: 3 }}>
                {n.length > 0 && <i style={{ display: "inline-block", width: 6, height: 6, borderRadius: 999,
                  background: faits === n.length ? T.haut : actif ? "#fff" : T.accent }} />}
              </span>
            </button>
          );

      </div>

      <div className="flex items-center justify-between mb-2 px-1">
        <span style={{ fontFamily: serif, fontSize: 20 }}>{dateLisible}</span>
        <span className="flex items-center gap-2">
          <span className="text-xs" style={{ color: T.ink2 }}>
            {duJour.filter((t) => t.fait).length}/{duJour.length} fait
          </span>
          <button onClick={() => { setEffacer(!effacer_); setModeles(false); setExport_(false); }}
            className="flex items-center gap-1.5 px-3 py-1.5 doux"
            style={{ borderRadius: 999, background: effacer_ ? T.bas : T.card, color: effacer_ ? "#fff" : T.ink2, fontWeight: 700, fontSize: 12, border: `1px solid ${effacer_ ? T.bas : T.line}` }}>

              {texte.trim() && (
                <button onClick={() => ajouter("perso", null, texte.trim())} className="text-xs mt-2 px-3 py-1.5 doux"
                  style={{ borderRadius: 999, background: T.accent, color: "#fff", fontWeight: 600 }}>
                  Ajouter tel quel
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      <button onClick={() => {
        const faibles = items
          .map((i) => ({ i, dernier: i.dateComp || "0000-00-00", niv: i.comp || 0 }))
          .filter((x) => x.niv < 4)
          .sort((a, b) => a.niv - b.niv || String(a.dernier).localeCompare(String(b.dernier)))
          .slice(0, 10);
        if (!faibles.length) return;
        const base = new Date(jour + "T12:00:00");
        const nouvelles = [];
        faibles.forEach((x, k) => {
          const d = new Date(base); d.setDate(d.getDate() + Math.floor(k / 2));
          nouvelles.push({
            id: Math.random().toString(36).slice(2, 9), date: iso(d), type: "item",
            itemId: x.i.id, texte: "", debut: k % 2 ? 14 : 9, duree: 2, fait: false,
            teinte: (taches.length + k) % BLOCS.length,
          });
        });
        onMaj([...taches, ...nouvelles]);
      }} className="w-full py-3 mt-4 doux"
        style={{ background: T.accentPale, color: T.accent, borderRadius: 999, fontWeight: 600, fontSize: 13 }}>

      <button onClick={() => setPurge(!purge)} className="w-full py-3 mt-2 doux"
        style={{ borderRadius: 999, border: `1px solid ${T.line}`, color: T.bas, fontWeight: 600, fontSize: 13 }}>
        Effacer des créneaux…
      </button>

      <p className="text-xs mt-4" style={{ color: T.ink2, lineHeight: 1.7 }}>

        Tire la petite barre en bas d'un bloc pour l'allonger ou le raccourcir, glisse le bloc pour le déplacer.
      </p>
    </div>
  );
}

function citationDuJour() {
  const d = new Date();
  const n = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000) + d.getFullYear();
  return CITATIONS[n % CITATIONS.length];
}

const CLE_EDN = "edngo-date-edn";

function Compteur() {
  const [date, setDate] = useState("2028-10-02");
  const [edition, setEdition] = useState(false);
  useEffect(() => { try { const v = localStorage.getItem(CLE_EDN); if (v) setDate(v); } catch (e) {} }, []);
  const enregistrer = (v) => { setDate(v); try { localStorage.setItem(CLE_EDN, v); } catch (e) {} };

  const jours = Math.max(0, Math.ceil((new Date(date + "T08:00:00") - new Date()) / 86400000));
  const mois = Math.floor(jours / 30.44);

  return (
    <div className="ombre" style={{ background: T.card, borderRadius: 24, padding: "18px 20px", height: "100%" }}>
      <p className="text-xs uppercase mb-1" style={{ letterSpacing: "0.12em", color: T.ink2 }}>Jusqu'aux EDN</p>
      <p style={{ fontFamily: serif, fontSize: 40, lineHeight: 1.05, color: T.accent }}>{jours}</p>
      <p className="text-xs" style={{ color: T.ink2 }}>
        jours · environ {mois} mois · {(jours / 7).toFixed(0)} semaines
      </p>
      {edition ? (
        <div className="mt-3 flex gap-2 items-center">
          <input type="date" value={date} onChange={(e) => enregistrer(e.target.value)}
            className="px-2 py-1 text-xs" style={{ borderRadius: 10, border: `1px solid ${T.line}` }} />
          <button onClick={() => setEdition(false)} className="text-xs" style={{ color: T.accent }}>ok</button>
        </div>
      ) : (
        <button onClick={() => setEdition(true)} className="text-xs mt-3" style={{ color: T.ink2, textDecoration: "underline" }}>
          {new Date(date + "T08:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}
        </button>
      )}
    </div>
  );
}

/* la journée, telle qu'elle apparaît sur l'accueil */
function JourneeAccueil({ taches, onMaj, items, colleges, onOuvrirItem, onPlanning }) {
  const auj_ = iso(new Date());
  const duJour = taches.filter((t) => t.date === auj_).map(normaliser).sort((a, b) => a.debut - b.debut);
  const faits = duJour.filter((t) => t.fait).length;
  const h = new Date().getHours();
  const enCours = duJour.find((t) => !t.fait && h >= t.debut && h < t.debut + (t.duree || 1));
  const suivante = duJour.find((t) => !t.fait && t.debut > h);
  const restantes = duJour.filter((t) => !t.fait);
  const heures = restantes.reduce((s, t) => s + (t.duree || 1), 0);

  const d = new Date();
  const titre = `${JOURS[(d.getDay() + 6) % 7] === "lun" ? "Lundi" : ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"][(d.getDay() + 6) % 7]} ${d.getDate()} ${MOIS[d.getMonth()]}`;

/* ================== appel direct à l'IA ================== */
const CLE_API = "edngo-cle";
const litCle = () => { try { return localStorage.getItem(CLE_API) || ""; } catch (e) { return ""; } };
const ecritCle = (v) => { try { v ? localStorage.setItem(CLE_API, v) : localStorage.removeItem(CLE_API); } catch (e) {} };

async function demanderIA(systeme, message, maxJetons = 4000) {
  const cle = litCle();
  if (!cle) throw new Error("PAS_DE_CLE");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json", "x-api-key": cle,
      "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: maxJetons, system: systeme,
      messages: [{ role: "user", content: message }],
    }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message || "Réponse refusée");
  return (d.content || []).filter((x) => x.type === "text").map((x) => x.text).join("\n");
}

function extraireJson(txt) {
  let t = (txt || "").trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
  const d = t.search(/[\[{]/);
  if (d > 0) t = t.slice(d);
  const f = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}"));
  if (f > -1) t = t.slice(0, f + 1);
  return JSON.parse(t);
}

Base-toi uniquement sur les référentiels des Collèges nationaux et les recommandations françaises en vigueur.
N'invente jamais un chiffre, un seuil ou une posologie dont tu ne sois pas certain.

/* ================== le Rattrapage ================== */
const CLE_RATTRAPAGE = "edngo-rattrapage";
const JOURS_RATTRAPAGE = [2, 5];

function rattrapageDu() {
  const j = new Date().getDay();
  return JOURS_RATTRAPAGE.includes(j === 0 ? 7 : j);
}
function dernierRattrapage() { try { return localStorage.getItem(CLE_RATTRAPAGE) || ""; } catch (e) { return ""; } }
function noterRattrapage() { try { localStorage.setItem(CLE_RATTRAPAGE, auj()); } catch (e) {} }

function construireRattrapage(items, colleges, cartes, qcms, resultats, taille = 30) {
  const exos = [
    ...cartes.map((c) => ({ ...c, genre: "carte" })),
    ...qcms.map((c) => ({ ...c, genre: "qcm" })),
  ];
  const parItem = {};
  items.forEach((i) => (parItem[i.id] = i));

  const note = (e) => {
    const h = resultats.filter((r) => r.exoId === e.id);
    const it = parItem[e.itemId];
    if (!it) return -1;
    const rates = h.filter((r) => r.valeur < 1).length;
    const taux = h.length ? h.reduce((s, r) => s + r.valeur, 0) / h.length : null;
    const et = etatRevision(e.id, resultats);
    let p = 0;
    if (rates) p += 40 + rates * 12;
    if (taux !== null && taux < 0.5) p += 30;
    else if (taux !== null && taux < 0.8) p += 15;
    if (!et.neuf && et.du <= auj()) p += 20;
    if ((it.niveau || 0) === 1) p += 25;
    else if ((it.niveau || 0) === 2) p += 10;
    if (h.length === 0) p += 3;
    return p;
  };

  const classes = exos.map((e) => ({ e, p: note(e), col: parItem[e.itemId] ? parItem[e.itemId].collegeId : null }))
    .filter((x) => x.p >= 0).sort((a, b) => b.p - a.p);

  const paniers = {};
  classes.forEach((x) => { (paniers[x.col] = paniers[x.col] || []).push(x.e); });
  const cles = Object.keys(paniers);
  const sortie = [];
  let k = 0;
  while (sortie.length < taille && cles.some((c) => paniers[c].length)) {
    const c = cles[k % cles.length];
    if (paniers[c].length) sortie.push(paniers[c].shift());
    k++;
  }
  return sortie;
}

/* ================== répétition espacée ==================
   Intervalles inspirés de SM-2, simplifiés : ce qui compte est
   que l'écart grandisse à chaque réussite et retombe à l'échec. */
const PALIERS = [0, 1, 3, 7, 16, 35, 70];

function prochaineEcheance(niv, date) {
  const d = new Date((date || auj()) + "T12:00:00");
  d.setDate(d.getDate() + PALIERS[Math.min(niv, PALIERS.length - 1)]);
  return iso(d);
}

/* état de révision d'un exercice, calculé depuis l'historique */
function etatRevision(id, resultats) {
  const h = resultats.filter((r) => r.exoId === id).sort((a, b) => a.t - b.t);
  if (!h.length) return { niveau: 0, du: auj(), neuf: true };
  let niv = 0;
  h.forEach((r) => { niv = r.valeur >= 1 ? niv + 1 : Math.max(0, niv - 1); });
  return { niveau: niv, du: prochaineEcheance(niv, h[h.length - 1].date), neuf: false };
}

function aReviser(exos, resultats) {
  const today = auj();
  const du = [], neufs = [];
  exos.forEach((e) => {
    const s = etatRevision(e.id, resultats);
    if (s.neuf) neufs.push({ ...e, etat: s });
    else if (s.du <= today) du.push({ ...e, etat: s });
  });
  du.sort((a, b) => a.etat.niveau - b.etat.niveau);
  return { du, neufs };
}

/* ================== chronomètre ================== */
function Chrono({ depart, limite }) {
  const [s, setS] = useState(0);
  useEffect(() => {
    const i = setInterval(() => setS(Math.floor((Date.now() - depart) / 1000)), 1000);
    return () => clearInterval(i);
  }, [depart]);
  const m = Math.floor(s / 60);
  const depasse = limite && s > limite;
  return (
    <span className="text-xs" style={{ fontWeight: 700, color: depasse ? T.bas : T.ink2 }}>
      {String(m).padStart(2, "0")}:{String(s % 60).padStart(2, "0")}
    </span>
  );
}

/* passage d'un dossier, question après question */
function SessionDossier({ dossier, onNoter, onFin }) {
  const [n, setN] = useState(0);
  const [choix, setChoix] = useState([]);
  const [corrige, setCorrige] = useState(false);
  const [score, setScore] = useState(0);
  const [depart] = useState(Date.now());
  const [voirEnonce, setVoirEnonce] = useState(false);

  const q = dossier.questions[n];
  if (!q) return null;
  const juste = (q.props || []).every((p, i) => p.vrai === choix.includes(i));

  return (
    <div>
      <div className="flex items-center gap-3 mb-3">
        <div className="flex-1 h-1.5 rounded-full" style={{ background: "#1E3149" }}>
          <div className="doux h-1.5 rounded-full"

        </div>
        <Chrono depart={depart} />
        <span className="text-xs" style={{ color: T.ink2, fontWeight: 600 }}>{n + 1}/{dossier.questions.length}</span>
        <button onClick={onFin} className="text-xs" style={{ color: T.ink2 }}>✕</button>
      </div>

      <button onClick={() => setVoirEnonce(!voirEnonce)} className="text-xs mb-3" style={{ color: T.accent, fontWeight: 600 }}>
        {voirEnonce ? "Masquer l'énoncé" : "Revoir l'énoncé du cas"}
      </button>
      {voirEnonce && (
        <div className="mb-3" style={{ background: T.card, borderRadius: 18, padding: "14px 16px" }}>
          <p style={{ fontFamily: lecture, fontSize: 15.5, lineHeight: 1.7, color: "#D6E4F1" }}>{dossier.enonce}</p>
        </div>
      )}

      {q.contexte && (
        <div className="mb-3" style={{ background: T.accentPale, borderRadius: 16, padding: "12px 15px" }}>
          <p className="text-xs mb-1" style={{ color: T.accent, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em" }}>
            Évolution
          </p>
          <p style={{ fontFamily: lecture, fontSize: 15.5, lineHeight: 1.65, color: "#D6E4F1" }}>{q.contexte}</p>
        </div>
      )}

      <p className="mb-4" style={{ fontSize: 16, lineHeight: 1.55, fontWeight: 500 }}>{q.enonce}</p>

      {(q.props || []).map((p, i) => (
        <Proposition key={i} p={p} i={i} choisi={choix.includes(i)} corrige={corrige}
          onClic={() => setChoix((l) => l.includes(i) ? l.filter((x) => x !== i) : [...l, i])} />
      ))}

      {corrige && <Correction juste={juste} texte={q.explication} />}

      <div className="mt-5">
        {!corrige ? (
          <button onClick={() => { setCorrige(true); if (juste) setScore((s) => s + 1); onNoter(juste ? 1 : 0); }}
            disabled={!choix.length} className="w-full py-3.5 text-sm doux"
            style={{ background: choix.length ? T.accent : "#24384F", color: "#fff", borderRadius: 999, fontWeight: 600 }}>
            Valider
          </button>
        ) : (
          <button onClick={() => {
            if (n + 1 >= dossier.questions.length) return onFin(score + (juste ? 0 : 0));
            setN(n + 1); setChoix([]); setCorrige(false);
          }} className="w-full py-3.5 text-sm doux"
            style={{ background: T.ink, color: "#fff", borderRadius: 999, fontWeight: 600 }}>
            {n + 1 >= dossier.questions.length ? `Terminer — ${score}/${dossier.questions.length}` : "Question suivante"}
          </button>
        )}
      </div>
    </div>
  );
}

  const scores = {};
  items.forEach((i) => (scores[i.id] = taux(resultats.filter((r) => r.itemId === i.id))));

    let base = items.filter((i) => exos(i.id).length);
    if (mode === "college" && cible) base = base.filter((i) => i.collegeId === cible);
    if (mode === "faibles") base = base.sort((a, b) => (scores[a.id] ?? -1) - (scores[b.id] ?? -1)).slice(0, 10);
    if (mode === "jamais") base = base.filter((i) => scores[i.id] === null);

    if (mode === "qroc") paquet = paquet.filter((e) => e.type === "qroc");
    if (mode === "flash") paquet = paquet.filter((e) => e.genre === "carte");

        </div>
        <div className="text-xs" style={{ color: "#E4EEFA", lineHeight: 1.6 }}>
